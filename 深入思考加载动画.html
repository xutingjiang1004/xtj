<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>XTJ Loading Demo 02 - Neural Constellation</title>
<style>

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#07100f;color:#eafff8}
body{display:grid;place-items:center}
.stage{position:relative;width:min(92vw,860px);height:min(72vh,560px);border-radius:32px;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid rgba(190,255,235,.16);box-shadow:0 30px 90px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.title{position:absolute;left:32px;top:28px;z-index:5;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:rgba(226,255,247,.72)}
.center{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none}
.loadingText{font-size:28px;font-weight:750;letter-spacing:.04em;text-shadow:0 0 26px rgba(80,255,210,.36)}
.sub{margin-top:10px;font-size:13px;text-align:center;color:rgba(226,255,247,.58)}
.hint{position:absolute;right:28px;bottom:22px;z-index:5;font-size:12px;color:rgba(226,255,247,.42)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.stage{background:linear-gradient(145deg,#071512,#0a181f 58%,#07100f)}
.card{position:relative;width:min(82%,560px);padding:30px 34px;border-radius:28px;background:rgba(255,255,255,.075);border:1px solid rgba(170,255,232,.16);backdrop-filter:blur(20px);box-shadow:0 22px 80px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.13)}
.scan{height:4px;margin-top:24px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.08)}
.scan i{display:block;height:100%;width:38%;border-radius:99px;background:linear-gradient(90deg,transparent,#74ffe5,#7db7ff,transparent);animation:scan 1.4s ease-in-out infinite}
.steps{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.steps span{font-size:12px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);color:rgba(235,255,250,.65)}
.steps span:nth-child(2){color:#b9fff0;border-color:rgba(111,255,222,.28);box-shadow:0 0 18px rgba(75,255,208,.14)}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(270%)}}
</style>
</head>
<body>
<div class="stage">
  <canvas id="c"></canvas>
  <div class="title">Neural Constellation</div>
  <div class="center">
    <div class="card">
      <div class="loadingText">正在分析上下文...</div>
      <div class="sub" style="text-align:left">节点连接、脉冲传递，适合“深入研究 / 多 agent 拆解”过程</div>
      <div class="scan"><i></i></div>
      <div class="steps"><span>拆解问题</span><span>分析信息</span><span>组织结构</span><span>生成回答</span></div>
    </div>
  </div>
  <div class="hint">Demo 02</div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let w,h,dpr,nodes=[];
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);w=canvas.clientWidth;h=canvas.clientHeight;
 canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 nodes=Array.from({length:72},()=>({
  x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,p:Math.random()*Math.PI*2
 }));
}
function draw(t){
 ctx.clearRect(0,0,w,h);
 const mx=w/2+Math.cos(t*.0006)*w*.18,my=h/2+Math.sin(t*.0008)*h*.18;
 for(const n of nodes){
  n.x+=n.vx;n.y+=n.vy;n.p+=.03;
  if(n.x<0||n.x>w)n.vx*=-1;if(n.y<0||n.y>h)n.vy*=-1;
 }
 for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
  const a=nodes[i],b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.hypot(dx,dy);
  if(dist<112){
   const alpha=(1-dist/112)*.22;
   ctx.strokeStyle=`rgba(122,255,226,${alpha})`;
   ctx.lineWidth=.8;
   ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
 }
 for(const n of nodes){
  const d=Math.hypot(n.x-mx,n.y-my);
  const glow=Math.max(0,1-d/260);
  ctx.beginPath();
  ctx.fillStyle=`rgba(${120+glow*80},255,${220+glow*30},${.35+glow*.45})`;
  ctx.shadowColor='rgba(96,255,220,.75)';
  ctx.shadowBlur=8+glow*18;
  ctx.arc(n.x,n.y,1.5+Math.sin(n.p)*.45+glow*1.2,0,Math.PI*2);ctx.fill();
 }
 ctx.shadowBlur=0;
 requestAnimationFrame(draw);
}
addEventListener('resize',resize);resize();requestAnimationFrame(draw);
</script>
</body>
</html>
