<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>xtj 管理后台</title>
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script defer src="js/config.js"></script>
<style>
    html { scrollbar-gutter: stable; }
    :root {
        --primary: #059669;
        --primary-light: #34d399;
        --danger: #ff3b60;
        --bg: #f5f5f8;
        --card-bg: rgba(255,255,255,0.75);
        --text: #1d1d24;
        --text-muted: #6b6c7a;
        --border: rgba(255,255,255,0.5);
        --radius: 16px;
    }
    [data-theme="dark"] {
        --bg: #111118;
        --card-bg: rgba(30,30,45,0.7);
        --text: #e8e8f0;
        --text-muted: #8e8ea0;
        --border: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg); color: var(--text);
        min-height: 100vh;
    }
    .login-wrap {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; padding: 20px;
    }
    .login-card {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: 24px; padding: 40px 32px; width: 100%; max-width: 380px;
        backdrop-filter: blur(20px); box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }
    .login-card h1 { font-size: 24px; margin-bottom: 6px; }
    .login-card p { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
    .login-card input {
        width: 100%; padding: 12px 16px; border-radius: 12px;
        border: 1px solid var(--border); background: rgba(255,255,255,0.15);
        font-size: 14px; margin-bottom: 12px; outline: none; color: var(--text);
        transition: border 0.3s;
    }
    .login-card input:focus { border-color: var(--primary); }
    .login-card button {
        width: 100%; padding: 12px; border-radius: 12px;
        border: none; background: var(--primary); color: white;
        font-size: 15px; font-weight: 600; cursor: pointer;
        transition:
            transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            background 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            border-color 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        transform: translateY(0) scale(1);
        box-shadow: 0 8px 18px rgba(26, 71, 48, 0.12);
        margin-top: 6px;
    }
    .login-card button:hover {
        opacity: 0.96;
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(26, 71, 48, 0.16);
    }
    .login-card button:active {
        transform: translateY(0) scale(0.965);
        box-shadow: 0 6px 14px rgba(26, 71, 48, 0.10);
        transition-duration: 0.12s;
    }
    .login-err { color: var(--danger); font-size: 12px; margin-top: 8px; text-align: center; }

    .dashboard { display: none; }
    .dash-header {
        display: flex; align-items: flex-start; justify-content: space-between;
        padding: 16px 24px; background: var(--card-bg);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 10;
        flex-wrap: wrap; gap: 8px;
    }
    .dash-header h1 { font-size: 18px; }
    .dash-header .dh-right {
        display: flex;
        align-items: center;
        gap: 8px;
        row-gap: 8px;
        width: 100%;
        flex: 1 1 100%;
        flex-wrap: wrap;
        overflow-x: visible;
        overflow-y: visible;
        max-height: none;
        scrollbar-width: none;
    }
    .dash-header .dh-right::-webkit-scrollbar { display: none; }
    .dash-header .dh-right button {
        --tab-icon-color: #059669;
        --tab-icon-bg: rgba(5,150,105,0.10);
        --tab-icon-bg-hover: rgba(5,150,105,0.16);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 34px;
        min-height: 34px;
        padding: 0 12px;
        line-height: 1;
        box-sizing: border-box;
        flex: 0 0 auto;
        white-space: nowrap;
        vertical-align: middle;
        border: 1px solid var(--border);
        border-width: 1px;
        border-radius: 12px;
        background: rgba(255,255,255,0.1);
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        position: relative;
        overflow: visible;
        transition:
            background-color 0.16s ease,
            border-color 0.16s ease,
            color 0.16s ease,
            opacity 0.16s ease !important;
    }
    .dash-header .dh-right button,
    .dash-header .dh-right button:hover,
    .dash-header .dh-right button:active,
    .dash-header .dh-right button.active,
    .dash-header .dh-right button.xtj-btn-pressing,
    .dash-header .dh-right button.xtj-btn-release,
    .dash-header .dh-right button.xtj-btn-clicked {
        transform: none !important;
        animation: none !important;
        will-change: auto !important;
        box-shadow: none !important;
        height: 34px;
        min-height: 34px;
        padding: 0 12px;
        border-width: 1px;
        font-size: 13px;
        font-weight: 600;
    }
    .dash-header .dh-right button:hover {
        background: rgba(255,255,255,0.18);
        border-color: rgba(5,150,105,0.18);
    }
    .dash-header .dh-right button.active {
        background: rgba(5,150,105,0.12);
        color: var(--primary);
        border-color: rgba(5,150,105,0.28);
    }
    .dash-header .dh-right button.danger { color: var(--danger); border-color: rgba(255,59,96,0.3); }
    .dash-header .dh-right button:active {
        background: rgba(255,255,255,0.18);
        border-color: rgba(5,150,105,0.22);
    }
    .dash-header .dh-right button .xtj-btn-ripple,
    .dash-header .dh-right .xtj-btn-ripple {
        display: none !important;
    }
    .admin-tab-icon {
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 22px;
        border-radius: 8px;
        background: var(--tab-icon-bg);
        color: var(--tab-icon-color);
        transition:
            background-color 0.16s ease,
            color 0.16s ease,
            transform 0.16s ease;
    }
    .admin-tab-icon svg {
        width: 15px;
        height: 15px;
        display: block;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    .dash-header .dh-right button:hover .admin-tab-icon {
        background: var(--tab-icon-bg-hover);
        transform: scale(1.06);
    }
    .dash-header .dh-right button.active .admin-tab-icon {
        background: var(--tab-icon-color);
        color: #fff;
        transform: none;
    }
    #tabAnnBtn { --tab-icon-color: #ea7a22; --tab-icon-bg: rgba(234,122,34,0.12); --tab-icon-bg-hover: rgba(234,122,34,0.18); }
    #tabStatsBtn { --tab-icon-color: #2f6df6; --tab-icon-bg: rgba(47,109,246,0.12); --tab-icon-bg-hover: rgba(47,109,246,0.18); }
    #tabUsersBtn { --tab-icon-color: #1f9d5a; --tab-icon-bg: rgba(31,157,90,0.12); --tab-icon-bg-hover: rgba(31,157,90,0.18); }
    #tabSecurityBtn { --tab-icon-color: #5b6cf0; --tab-icon-bg: rgba(91,108,240,0.12); --tab-icon-bg-hover: rgba(91,108,240,0.18); }
    #tabAuditBtn { --tab-icon-color: #0fa6b8; --tab-icon-bg: rgba(15,166,184,0.12); --tab-icon-bg-hover: rgba(15,166,184,0.18); }
    #tabErrorLogBtn { --tab-icon-color: #ea5b3a; --tab-icon-bg: rgba(234,91,58,0.12); --tab-icon-bg-hover: rgba(234,91,58,0.18); }
    #tabPostsBtn { --tab-icon-color: #149a8a; --tab-icon-bg: rgba(20,154,138,0.12); --tab-icon-bg-hover: rgba(20,154,138,0.18); }
    #tabLikesBtn { --tab-icon-color: #e85b96; --tab-icon-bg: rgba(232,91,150,0.12); --tab-icon-bg-hover: rgba(232,91,150,0.18); }
    #tabCommentsBtn { --tab-icon-color: #4f9ef8; --tab-icon-bg: rgba(79,158,248,0.12); --tab-icon-bg-hover: rgba(79,158,248,0.18); }
    #tabReportsBtn { --tab-icon-color: #f08a24; --tab-icon-bg: rgba(240,138,36,0.12); --tab-icon-bg-hover: rgba(240,138,36,0.18); }
    #tabBansBtn { --tab-icon-color: #db4258; --tab-icon-bg: rgba(219,66,88,0.12); --tab-icon-bg-hover: rgba(219,66,88,0.18); }
    #tabMutesBtn { --tab-icon-color: #8a59d9; --tab-icon-bg: rgba(138,89,217,0.12); --tab-icon-bg-hover: rgba(138,89,217,0.18); }
    #tabBlacklistBtn { --tab-icon-color: #8d4f5f; --tab-icon-bg: rgba(141,79,95,0.12); --tab-icon-bg-hover: rgba(141,79,95,0.18); }
    #tabPhotosBtn { --tab-icon-color: #14a089; --tab-icon-bg: rgba(20,160,137,0.12); --tab-icon-bg-hover: rgba(20,160,137,0.18); }
    .dash-header .dh-right button[onclick="toggleTheme()"] {
        --tab-icon-color: #d6a414;
        --tab-icon-bg: rgba(214,164,20,0.12);
        --tab-icon-bg-hover: rgba(214,164,20,0.18);
    }
    .dash-header .dh-right button.danger {
        --tab-icon-color: #df4663;
        --tab-icon-bg: rgba(223,70,99,0.12);
        --tab-icon-bg-hover: rgba(223,70,99,0.18);
    }
    [data-theme="dark"] .dash-header .dh-right button .admin-tab-icon {
        background: rgba(255,255,255,0.08);
    }
    [data-theme="dark"] .dash-header .dh-right button:hover .admin-tab-icon {
        background: var(--tab-icon-bg-hover);
    }
    [data-theme="dark"] .dash-header .dh-right button.active .admin-tab-icon {
        color: #fff;
        filter: saturate(1.05) brightness(1.02);
    }
    .admin-tab-label { line-height: 1; display: inline-block; }
    .notif-badge {
        position: absolute; top: -8px; right: -8px; min-width: 18px; height: 18px;
        padding: 0 5px; border-radius: 9px; background: #ef4444; color: #fff;
        font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
        box-shadow: 0 2px 6px rgba(239,68,68,0.5); pointer-events: none; z-index: 100;
    }
    .dash-content { padding: 20px 24px; max-width: 1200px; margin: 0 auto; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: adminPanelFade 0.12s ease both; }
    @keyframes adminPanelFade { from { opacity: 0; } to { opacity: 1; } }

    .card {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
        backdrop-filter: blur(12px);
    }
    .card h3 { font-size: 15px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; margin-bottom: 16px; }
    .stat-box {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 14px 10px; text-align: center;
        backdrop-filter: blur(12px); overflow: hidden;
    }
    .stat-box .val { font-size: 24px; font-weight: 800; color: var(--primary); word-break: break-all; }
    .stat-box .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat-box.danger .val { color: var(--danger); }
    .stat-box.warn .val { color: #f59e0b; }

    /* 骨架屏脉冲动画 */
    @keyframes skeletonPulse {
        0% { opacity: 0.3; }
        50% { opacity: 0.6; }
        100% { opacity: 0.3; }
    }
    .skeleton-pulse {
        animation: skeletonPulse 1.5s ease-in-out infinite;
    }

    /* 统计图表 */
    .chart-shell {
        display: grid;
        gap: 14px;
        margin-top: 12px;
    }
    .chart-bar-row {
        display: flex; align-items: flex-end; gap: 4px; height: 200px;
        padding: 12px 8px 10px; overflow-x: hidden; overflow-y: hidden;
        border-radius: 18px;
        background: rgba(255,255,255,0.14);
        border: 1px solid var(--border);
    }
    .chart-bar {
        flex: 1 1 0; min-width: 4px;
        border-radius: 12px 12px 6px 6px; position: relative;
        transition: transform 0.22s ease, opacity 0.22s ease, filter 0.22s ease; cursor: pointer;
        box-shadow: inset 0 -1px 0 rgba(255,255,255,0.24), 0 10px 18px rgba(26, 71, 48, 0.12);
    }
    .chart-bar:hover { opacity: 0.92; transform: translateY(-2px); }
    .chart-bar .bar-tip {
        position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
        font-size: 11px; color: var(--text); white-space: nowrap; display: none;
        padding: 4px 8px; border-radius: 999px;
        background: rgba(255,255,255,0.92); border: 1px solid var(--border);
        box-shadow: 0 8px 16px rgba(0,0,0,0.08);
    }
    .chart-bar:hover .bar-tip { display: block; }
    .chart-legend {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        font-size: 12px;
    }
    .chart-legend span {
        display: flex; align-items: center; gap: 6px;
        min-height: 44px;
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(255,255,255,0.14);
        border: 1px solid var(--border);
    }
    .chart-legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
    .chart-shell > .chart-legend:last-child { display: none; }
    .chart-bar-labels {
        display: flex; gap: 10px; padding: 0 18px;
        overflow-x: visible; flex-wrap: wrap;
    }
    .chart-bar-label {
        flex: 0 0 auto; width: 34px; min-width: 34px;
        text-align: center; font-size: 10px; line-height: 1.25; color: var(--text-muted);
    }

    .date-filter-row {
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px;
    }
    .date-filter-row input[type="date"] {
        padding: 6px 12px; border-radius: 12px; border: 1px solid var(--border);
        background: rgba(255,255,255,0.1); color: var(--text); font-size: 13px;
    }
    .date-filter-row button {
        padding: 6px 16px; border-radius: 12px; border: 1px solid var(--border);
        background: rgba(255,255,255,0.1); cursor: pointer; font-size: 13px; color: var(--text);
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-weight: 600; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    td { color: var(--text); }
    tr:hover td { background: rgba(5,150,105,0.03); }
    .table-wrap { max-height: 400px; overflow-y: auto; border-radius: var(--radius); }
    .table-wrap table thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--card-bg);
        backdrop-filter: blur(12px);
    }
    .zero-val { color: transparent !important; }

    /* 每日数据明细分隔横线 */
    .divider-row td {
        padding: 0 !important;
        border-bottom: none !important;
        border-top: 1px solid var(--border);
        height: 0;
        line-height: 0;
    }
    .divider-row:hover td { background: transparent !important; }

    .btn-sm {
        padding: 4px 12px; border-radius: 12px; border: 1px solid var(--border);
        background: rgba(255,255,255,0.1); cursor: pointer; font-size: 12px;
        color: var(--text); margin: 2px;
        transition:
            transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            background 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            border-color 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            color 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        transform: translateY(0) scale(1);
        box-shadow: 0 8px 18px rgba(26, 71, 48, 0.08);
    }
    .btn-sm:hover {
        background: rgba(255,255,255,0.18);
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(26, 71, 48, 0.12);
    }
    .btn-sm.del { color: var(--danger); border-color: rgba(255,59,96,0.3); }
    .btn-sm.del:hover { background: rgba(255,59,96,0.12); }
    .btn-sm.primary { background: var(--primary); color: white; border-color: var(--primary); }
    .btn-sm:active {
        transform: translateY(0) scale(0.965);
        box-shadow: 0 6px 14px rgba(26, 71, 48, 0.08);
        transition-duration: 0.12s;
    }

    textarea {
        width: 100%; min-height: 80px; padding: 12px; border-radius: 12px;
        border: 1px solid var(--border); background: rgba(255,255,255,0.1);
        font-size: 13px; outline: none; resize: vertical; color: var(--text);
        font-family: inherit;
    }
    textarea:focus { border-color: var(--primary); }
    .publish-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 8px; }
    .publish-row textarea { flex: 1; }
    .publish-row button {
        flex-shrink: 0; padding: 8px 20px; border-radius: 12px; border: 1px solid var(--border);
        background: rgba(255,255,255,0.12); color: var(--text); cursor: pointer;
        transition:
            transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            background 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            border-color 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            color 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        transform: translateY(0) scale(1);
        box-shadow: 0 8px 18px rgba(26, 71, 48, 0.08);
    }
    .publish-row button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(26, 71, 48, 0.12);
        background: rgba(255,255,255,0.18);
    }
    .publish-row button:active {
        transform: translateY(0) scale(0.965);
        box-shadow: 0 6px 14px rgba(26, 71, 48, 0.08);
        transition-duration: 0.12s;
    }

    .loading { text-align: center; padding: 40px; color: var(--text-muted); }
    .empty { text-align: center; padding: 32px; color: var(--text-muted); font-size: 13px; }
    .badge {
        display: inline-block; padding: 2px 8px; border-radius: 99px;
        font-size: 11px; font-weight: 600;
    }
    .badge-green { background: rgba(5,150,105,0.15); color: var(--primary); }
    .badge-red { background: rgba(255,59,96,0.15); color: var(--danger); }

    .search-bar {
        display: flex; gap: 8px; margin-bottom: 14px;
    }
    .search-bar input {
        flex: 1; padding: 8px 14px; border-radius: 10px;
        border: 1px solid var(--border); background: rgba(255,255,255,0.1);
        font-size: 13px; outline: none; color: var(--text);
    }
    .search-bar input:focus { border-color: var(--primary); }
    .admin-user-form-row {
        display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end;
    }
    .admin-field {
        display: flex; flex-direction: column; gap: 4px;
    }
    .admin-field label {
        font-size: 11px; color: var(--text-muted);
    }
    .admin-user-picker {
        min-width: 220px;
    }
    .admin-user-picker-shell {
        display: flex; flex-direction: column; gap: 8px;
        width: 220px; padding: 10px; border-radius: 14px;
        border: 1px solid rgba(5,150,105,0.12);
        background: rgba(255,255,255,0.14);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    }
    .admin-user-picker.has-selection .admin-user-picker-shell {
        border-color: rgba(5,150,105,0.26);
        box-shadow: 0 10px 22px rgba(26, 71, 48, 0.08), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .admin-user-picker.is-disabled .admin-user-picker-shell {
        opacity: 0.55;
    }
    .admin-user-input {
        width: 100%; padding: 9px 12px; border-radius: 10px;
        border: 1px solid var(--border); background: rgba(255,255,255,0.15);
        font-size: 13px; outline: none; color: var(--text);
    }
    .admin-user-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(5,150,105,0.10);
    }
    .admin-user-input:disabled {
        opacity: 0.55; cursor: not-allowed;
    }
    .admin-user-list {
        display: flex; flex-direction: column; gap: 6px;
        max-height: 176px; overflow-y: auto; padding-right: 2px;
    }
    .admin-user-option {
        width: 100%; text-align: left; padding: 9px 12px; border-radius: 10px;
        border: 1px solid transparent; background: rgba(255,255,255,0.12);
        color: var(--text); cursor: pointer; font-size: 13px;
        transition:
            transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            background 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            border-color 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            color 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        transform: translateY(0) scale(1);
        box-shadow: 0 8px 18px rgba(26, 71, 48, 0.05);
    }
    .admin-user-option:hover {
        background: rgba(255,255,255,0.2);
        border-color: rgba(5,150,105,0.18);
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(26, 71, 48, 0.10);
    }

        border: 1px solid transparent;
        background: rgba(255,255,255,0.08);
        color: var(--text);
        cursor: pointer;
        font-size: 12px;
        transition: all 0.18s;
        display: flex;
        align-items: center;
        gap: 8px;
    }

        border-color: rgba(5,150,105,0.15);
    }
    .admin-user-picker-modern .picker-option:active {
        transform: scale(0.98);
    }
    .admin-user-picker-modern .picker-option.is-selected {

        color: var(--primary);

    }

        width: 22px; height: 22px;
        border-radius: 6px;
        display: flex; align-items: center; justify-content: center;

        color: white;
        flex-shrink: 0;
        background: linear-gradient(135deg, #059669, #34d399);
    }
    .admin-user-picker-modern .picker-empty {
        padding: 12px;
        text-align: center;
        color: var(--text-muted);
        font-size: 12px;
    }
    :where(
        button,
        .btn-sm,
        .filter-chip,
        .filter-chips .filter-chip,
        .admin-user-option,
        .admin-user-picker-modern .picker-option,
        .top-tabs button,
        .modal-btns button,
        .search-bar button,
        .publish-row button
    ) {
        transition:
            transform 0.24s cubic-bezier(0.16, 1, 0.3, 1),
            box-shadow 0.24s cubic-bezier(0.16, 1, 0.3, 1),
            background-color 0.24s cubic-bezier(0.16, 1, 0.3, 1),
            border-color 0.24s cubic-bezier(0.16, 1, 0.3, 1),
            color 0.24s cubic-bezier(0.16, 1, 0.3, 1),
            opacity 0.24s cubic-bezier(0.16, 1, 0.3, 1) !important;
        transform: translateY(0) scale(1);
        transform-origin: center;
        will-change: transform;
    }
    :where(
        button,
        .btn-sm,
        .filter-chip,
        .admin-user-option,
        .admin-user-picker-modern .picker-option,
        .top-tabs button,
        .modal-btns button,
        .search-bar button,
        .publish-row button
    ):not(:disabled):hover {
        transform: translateY(-1px) scale(1.01);
    }
    :where(
        button,
        .btn-sm,
        .filter-chip,
        .admin-user-option,
        .admin-user-picker-modern .picker-option,
        .top-tabs button,
        .modal-btns button,
        .search-bar button,
        .publish-row button
    ):not(:disabled):active {
        transform: translateY(0) scale(0.965);
        transition-duration: 0.12s !important;
    }
    :where(
        .top-tabs button.active,
        .filter-chip.active,
        .admin-user-option.is-selected,
        .admin-user-picker-modern .picker-option.is-selected
    ) {
        box-shadow: 0 10px 22px rgba(26, 71, 48, 0.14);
    }
    @media (prefers-reduced-motion: reduce) {
        :where(
            button,
            .btn-sm,
            .filter-chip,
            .admin-user-option,
            .admin-user-picker-modern .picker-option,
            .top-tabs button,
            .modal-btns button,
            .search-bar button,
            .publish-row button
        ) {
            transition-duration: 0.18s !important;
            animation-duration: 0.18s !important;
        }
    }
    :where(
        button,
        [role="button"],
        input[type="button"],
        input[type="submit"],
        .btn-sm,
        .filter-chip,
        .admin-user-option,
        .admin-user-picker-modern .picker-option,
        .top-tabs button,
        .modal-btns button,
        .search-bar button,
        .publish-row button
    ).xtj-btn-pressing {
        transform: translateY(0) scale(0.965) !important;
        transition-duration: 0.12s !important;
    }
    :where(
        button,
        [role="button"],
        input[type="button"],
        input[type="submit"],
        .btn-sm,
        .filter-chip,
        .admin-user-option,
        .admin-user-picker-modern .picker-option,
        .top-tabs button,
        .modal-btns button,
        .search-bar button,
        .publish-row button
    ).xtj-btn-release {
        animation: xtjAdminButtonRelease 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    :where(
        button,
        [role="button"],
        input[type="button"],
        input[type="submit"],
        .btn-sm,
        .filter-chip,
        .admin-user-option,
        .admin-user-picker-modern .picker-option,
        .top-tabs button,
        .modal-btns button,

    ).xtj-btn-clicked {

    }
    :where(
        button,
        [role="button"],
        input[type="button"],
        input[type="submit"],
        .btn-sm,
        .filter-chip,
        .admin-user-option,

        .publish-row button
    ) {

    .xtj-btn-ripple {

        pointer-events: none;
        border-radius: 50%;

        opacity: 0.95;

    }
    @keyframes xtjAdminButtonRelease {
        from { transform: translateY(0) scale(0.965); }
        62% { transform: translateY(-1px) scale(1.012); }
        to { transform: translateY(0) scale(1); }
    }
    @keyframes xtjAdminButtonRipple {
        to { transform: scale(1.12); opacity: 0; }

</style>
