<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>xtj 管理后台</title>
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script defer src="js/config.js"></script>
<style>
    :root {
        --primary: #059669;
        --primary-light: #34d399;
        --danger: #ff3b60;
        --bg: #f5f5f8;
        --card-bg: rgba(255,255,255,0.75);
        --text: #1d1d24;
        --text-muted: #6b6c7a;
        --border: rgba(255,255,255,0.5);
        --radius: 16px;
    }
    [data-theme="dark"] {
        --bg: #111118;
        --card-bg: rgba(30,30,45,0.7);
        --text: #e8e8f0;
        --text-muted: #8e8ea0;
        --border: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg); color: var(--text);
        min-height: 100vh;
    }
    .login-wrap {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; padding: 20px;
    }
    .login-card {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: 24px; padding: 40px 32px; width: 100%; max-width: 380px;
        backdrop-filter: blur(20px); box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }
    .login-card h1 { font-size: 24px; margin-bottom: 6px; }
    .login-card p { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
    .login-card input {
        width: 100%; padding: 12px 16px; border-radius: 12px;
        border: 1px solid var(--border); background: rgba(255,255,255,0.15);
        font-size: 14px; margin-bottom: 12px; outline: none; color: var(--text);
        transition: border 0.3s;
    }
    .login-card input:focus { border-color: var(--primary); }
    .login-card button {
        width: 100%; padding: 12px; border-radius: 12px;
        border: none; background: var(--primary); color: white;
        font-size: 15px; font-weight: 600; cursor: pointer;
        transition:
            transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            background 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            border-color 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        transform: translateY(0) scale(1);
        box-shadow: 0 8px 18px rgba(26, 71, 48, 0.12);
        margin-top: 6px;
    }
    .login-card button:hover {
        opacity: 0.96;
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(26, 71, 48, 0.16);
    }
    .login-card button:active {
        transform: translateY(0) scale(0.965);
        box-shadow: 0 6px 14px rgba(26, 71, 48, 0.10);
        transition-duration: 0.12s;
    }
    .login-err { color: var(--danger); font-size: 12px; margin-top: 8px; text-align: center; }

    .dashboard { display: none; }
    .dash-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 24px; background: var(--card-bg);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 10;
        flex-wrap: wrap; gap: 8px;
    }
    .dash-header h1 { font-size: 18px; }
    .dash-header .dh-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .dash-header button {
        padding: 6px 16px; border-radius: 12px; border: 1px solid var(--border);
        background: rgba(255,255,255,0.1); cursor: pointer; font-size: 13px;
        color: var(--text);
        transition:
            transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            background 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            border-color 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            color 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        transform: translateY(0) scale(1);
        box-shadow: 0 8px 18px rgba(26, 71, 48, 0.08);
    }
    .dash-header button:hover {
        background: rgba(255,255,255,0.18);
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(26, 71, 48, 0.12);
    }
    .dash-header button.active { background: var(--primary); color: white; border-color: var(--primary); }
    .dash-header button.danger { color: var(--danger); border-color: rgba(255,59,96,0.3); }
    .notif-badge {
        position: absolute; top: -8px; right: -8px; min-width: 18px; height: 18px;
        padding: 0 5px; border-radius: 9px; background: #ef4444; color: #fff;
        font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
        box-shadow: 0 2px 6px rgba(239,68,68,0.5); pointer-events: none; z-index: 100;
    }
    .dash-header button:active {
        transform: translateY(0) scale(0.965);
        box-shadow: 0 6px 14px rgba(26, 71, 48, 0.08);
        transition-duration: 0.12s;
    }

    .dash-content { padding: 20px 24px; max-width: 1200px; margin: 0 auto; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn 0.35s ease; }
    @keyframes fadeIn { 0%{opacity:0;transform:translateY(8px)} 100%{opacity:1;transform:translateY(0)} }

    .card {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
        backdrop-filter: blur(12px);
    }
    .card h3 { font-size: 15px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 12px; margin-bottom: 16px; }
    .stat-box {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 16px; text-align: center;
        backdrop-filter: blur(12px);
    }
    .stat-box .val { font-size: 28px; font-weight: 800; color: var(--primary); }
    .stat-box .lbl { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .stat-box.danger .val { color: var(--danger); }
    .stat-box.warn .val { color: #f59e0b; }

    /* 骨架屏脉冲动�?*/
    @keyframes skeletonPulse {
        0% { opacity: 0.3; }
        50% { opacity: 0.6; }
        100% { opacity: 0.3; }
    }
    .skeleton-pulse {
        animation: skeletonPulse 1.5s ease-in-out infinite;
    }

    /* 统计图表 */
    .chart-shell {
        display: grid;
        gap: 14px;
        margin-top: 12px;
    }
    .chart-bar-row {
        display: flex; align-items: flex-end; gap: 4px; height: 200px;
        padding: 12px 8px 10px; overflow-x: hidden; overflow-y: hidden;
        border-radius: 18px;
        background: rgba(255,255,255,0.14);
        border: 1px solid var(--border);
    }
    .chart-bar {
        flex: 1 1 0; min-width: 4px;
        border-radius: 12px 12px 6px 6px; position: relative;
        transition: transform 0.22s ease, opacity 0.22s ease, filter 0.22s ease; cursor: pointer;
        box-shadow: inset 0 -1px 0 rgba(255,255,255,0.24), 0 10px 18px rgba(26, 71, 48, 0.12);
    }
    .chart-bar:hover { opacity: 0.92; transform: translateY(-2px); }
    .chart-bar .bar-tip {
        position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
        font-size: 11px; color: var(--text); white-space: nowrap; display: none;
        padding: 4px 8px; border-radius: 999px;
        background: rgba(255,255,255,0.92); border: 1px solid var(--border);
        box-shadow: 0 8px 16px rgba(0,0,0,0.08);
    }
    .chart-bar:hover .bar-tip { display: block; }
    .chart-legend {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        font-size: 12px;
    }
    .chart-legend span {
        display: flex; align-items: center; gap: 6px;
        min-height: 44px;
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(255,255,255,0.14);
        border: 1px solid var(--border);
    }
    .chart-legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
    .chart-shell > .chart-legend:last-child { display: none; }
    .chart-bar-labels {
        display: flex; gap: 10px; padding: 0 18px;
        overflow-x: visible; flex-wrap: wrap;
    }
    .chart-bar-label {
        flex: 0 0 auto; width: 34px; min-width: 34px;
        text-align: center; font-size: 10px; line-height: 1.25; color: var(--text-muted);
    }

    .date-filter-row {
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px;
    }
    .date-filter-row input[type="date"] {
        padding: 6px 12px; border-radius: 12px; border: 1px solid var(--border);
        background: rgba(255,255,255,0.1); color: var(--text); font-size: 13px;
    }
    .date-filter-row button {
        padding: 6px 16px; border-radius: 12px; border: 1px solid var(--border);
        background: rgba(255,255,255,0.1); cursor: pointer; font-size: 13px; color: var(--text);
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-weight: 600; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    td { color: var(--text); }
    tr:hover td { background: rgba(5,150,105,0.03); }
    .table-wrap { max-height: 400px; overflow-y: auto; border-radius: var(--radius); }
    .table-wrap table thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--card-bg);
        backdrop-filter: blur(12px);
    }
    .zero-val { color: transparent !important; }

    /* 每日数据明细分隔横线 */
    .divider-row td {
        padding: 0 !important;
        border-bottom: none !important;
        border-top: 1px solid var(--border);
        height: 0;
        line-height: 0;
    }
    .divider-row:hover td { background: transparent !important; }

    .btn-sm {
        padding: 4px 12px; border-radius: 12px; border: 1px solid var(--border);
        background: rgba(255,255,255,0.1); cursor: pointer; font-size: 12px;
        color: var(--text); margin: 2px;
        transition:
            transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            background 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            border-color 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            color 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        transform: translateY(0) scale(1);
        box-shadow: 0 8px 18px rgba(26, 71, 48, 0.08);
    }
    .btn-sm:hover {
        background: rgba(255,255,255,0.18);
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(26, 71, 48, 0.12);
    }
    .btn-sm.del { color: var(--danger); border-color: rgba(255,59,96,0.3); }
    .btn-sm.del:hover { background: rgba(255,59,96,0.12); }
    .btn-sm.primary { background: var(--primary); color: white; border-color: var(--primary); }
    .btn-sm:active {
        transform: translateY(0) scale(0.965);
        box-shadow: 0 6px 14px rgba(26, 71, 48, 0.08);
        transition-duration: 0.12s;
    }

    textarea {
        width: 100%; min-height: 80px; padding: 12px; border-radius: 12px;
        border: 1px solid var(--border); background: rgba(255,255,255,0.1);
        font-size: 13px; outline: none; resize: vertical; color: var(--text);
        font-family: inherit;
    }
    textarea:focus { border-color: var(--primary); }
    .publish-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 8px; }
    .publish-row textarea { flex: 1; }
    .publish-row button {
        flex-shrink: 0; padding: 8px 20px; border-radius: 12px; border: 1px solid var(--border);
        background: rgba(255,255,255,0.12); color: var(--text); cursor: pointer;
        transition:
            transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            background 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            border-color 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            color 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        transform: translateY(0) scale(1);
        box-shadow: 0 8px 18px rgba(26, 71, 48, 0.08);
    }
    .publish-row button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(26, 71, 48, 0.12);
        background: rgba(255,255,255,0.18);
    }
    .publish-row button:active {
        transform: translateY(0) scale(0.965);
        box-shadow: 0 6px 14px rgba(26, 71, 48, 0.08);
        transition-duration: 0.12s;
    }

    .loading { text-align: center; padding: 40px; color: var(--text-muted); }
    .empty { text-align: center; padding: 32px; color: var(--text-muted); font-size: 13px; }
    .badge {
        display: inline-block; padding: 2px 8px; border-radius: 99px;
        font-size: 11px; font-weight: 600;
    }
    .badge-green { background: rgba(5,150,105,0.15); color: var(--primary); }
    .badge-red { background: rgba(255,59,96,0.15); color: var(--danger); }

    .search-bar {
        display: flex; gap: 8px; margin-bottom: 14px;
    }
    .search-bar input {
        flex: 1; padding: 8px 14px; border-radius: 10px;
        border: 1px solid var(--border); background: rgba(255,255,255,0.1);
        font-size: 13px; outline: none; color: var(--text);
    }
    .search-bar input:focus { border-color: var(--primary); }
    .admin-user-form-row {
        display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end;
    }
    .admin-field {
        display: flex; flex-direction: column; gap: 4px;
    }
    .admin-field label {
        font-size: 11px; color: var(--text-muted);
    }
    .admin-user-picker {
        min-width: 220px;
    }
    .admin-user-picker-shell {
        display: flex; flex-direction: column; gap: 8px;
        width: 220px; padding: 10px; border-radius: 14px;
        border: 1px solid rgba(5,150,105,0.12);
        background: rgba(255,255,255,0.14);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    }
    .admin-user-picker.has-selection .admin-user-picker-shell {
        border-color: rgba(5,150,105,0.26);
        box-shadow: 0 10px 22px rgba(26, 71, 48, 0.08), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .admin-user-picker.is-disabled .admin-user-picker-shell {
        opacity: 0.55;
    }
    .admin-user-input {
        width: 100%; padding: 9px 12px; border-radius: 10px;
        border: 1px solid var(--border); background: rgba(255,255,255,0.15);
        font-size: 13px; outline: none; color: var(--text);
    }
    .admin-user-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(5,150,105,0.10);
    }
    .admin-user-input:disabled {
        opacity: 0.55; cursor: not-allowed;
    }
    .admin-user-list {
        display: flex; flex-direction: column; gap: 6px;
        max-height: 176px; overflow-y: auto; padding-right: 2px;
    }
    .admin-user-option {
        width: 100%; text-align: left; padding: 9px 12px; border-radius: 10px;
        border: 1px solid transparent; background: rgba(255,255,255,0.12);
        color: var(--text); cursor: pointer; font-size: 13px;
        transition:
            transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            background 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            border-color 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            color 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        transform: translateY(0) scale(1);
        box-shadow: 0 8px 18px rgba(26, 71, 48, 0.05);
    }
    .admin-user-option:hover {
        background: rgba(255,255,255,0.2);
        border-color: rgba(5,150,105,0.18);
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(26, 71, 48, 0.10);
    }
    .admin-user-option:active {
        transform: translateY(0) scale(0.965);
        box-shadow: 0 6px 14px rgba(26, 71, 48, 0.07);
        transition-duration: 0.12s;
    }
    .admin-user-option.is-selected {
        background: rgba(5,150,105,0.14);
        border-color: rgba(5,150,105,0.22);
        color: var(--primary);
        font-weight: 600;
    }
    .admin-user-option-empty {
        cursor: default;
        color: var(--text-muted);
    }
    .admin-user-option-empty:hover,
    .admin-user-option-empty:active {
        transform: none;
        box-shadow: 0 8px 18px rgba(26, 71, 48, 0.05);
        background: rgba(255,255,255,0.12);
        border-color: transparent;
    }

    .toast-wrap {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        z-index: 9999; display: flex; flex-direction: column; gap: 8px;
        pointer-events: none;
    }
    .toast-item {
        padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 500;
        color: white; pointer-events: auto;
        backdrop-filter: blur(16px); box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        animation: toastIn 0.35s ease, toastOut 0.35s ease 2.2s forwards;
        max-width: 360px; text-align: center;
    }
    .toast-success { background: rgba(5,150,105,0.88); }
    .toast-error { background: rgba(255,59,96,0.88); }
    .toast-info { background: rgba(59,130,246,0.88); }

    .modal-dialog .modal-btns button {
        transition:
            transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            background 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            border-color 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            color 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        transform: translateY(0) scale(1);
        box-shadow: 0 8px 18px rgba(26, 71, 48, 0.08);
    }
    .modal-dialog .modal-btns button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(26, 71, 48, 0.12);
    }
    .modal-dialog .modal-btns button:active {
        transform: translateY(0) scale(0.965);
        box-shadow: 0 6px 14px rgba(26, 71, 48, 0.08);
        transition-duration: 0.12s;
    }
    @keyframes toastIn { 0%{opacity:0;transform:translateY(-20px) scale(0.9)} 100%{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes toastOut { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-20px) scale(0.9)} }

    .modal-overlay {
        position: fixed; inset: 0; z-index: 9998;
        background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
        display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; animation: fadeIn 0.25s ease; }
    .modal-dialog {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: 20px; padding: 28px 24px; width: 90%; max-width: 400px;
        backdrop-filter: blur(20px); box-shadow: 0 16px 48px rgba(0,0,0,0.2);
        animation: modalPop 0.3s ease;
    }
    @keyframes modalPop { 0%{opacity:0;transform:scale(0.9) translateY(10px)} 100%{opacity:1;transform:scale(1) translateY(0)} }
    .modal-dialog h3 { font-size: 17px; margin-bottom: 10px; }
    .modal-dialog p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; line-height: 1.5; white-space: pre-line; }
    .modal-dialog .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-dialog .modal-btns button {
        padding: 10px 22px; border-radius: 10px; border: 1px solid var(--border);
        font-size: 14px; font-weight: 600; cursor: pointer;
        background: rgba(255,255,255,0.1); color: var(--text);
        transition:
            transform 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            background 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            border-color 0.22s cubic-bezier(0.16, 1, 0.3, 1),
            color 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        transform: translateY(0) scale(1);
        box-shadow: 0 8px 18px rgba(26, 71, 48, 0.08);
    }
    .modal-dialog .modal-btns button:hover {
        background: rgba(255,255,255,0.18);
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(26, 71, 48, 0.12);
    }
    .modal-dialog .modal-btns button.btn-danger { background: var(--danger); color: white; border-color: var(--danger); }
    .modal-dialog .modal-btns button.btn-danger:hover { opacity: 0.85; }
    .modal-dialog .modal-btns button.btn-cancel { background: rgba(255,255,255,0.08); }
    .modal-dialog .modal-btns button:active {
        transform: translateY(0) scale(0.965);
        box-shadow: 0 6px 14px rgba(26, 71, 48, 0.08);
        transition-duration: 0.12s;
    }

    @media (max-width: 640px) {
        .dash-header { flex-direction: column; align-items: flex-start; }
        .dash-header .dh-right { width: 100%; overflow-x: auto; flex-wrap: nowrap; }
        .stats-row { grid-template-columns: repeat(2,1fr); }
        .dash-content { padding: 12px; }
        table { font-size: 11px; }
        th, td { padding: 8px 6px; }
        .toast-item { max-width: 280px; font-size: 13px; padding: 10px 18px; }
    }

    /* ===== 新用户列表美化样�?===== */
    .user-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 12px;
        margin-top: 4px;
    }
