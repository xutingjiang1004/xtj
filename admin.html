<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>xtj 管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    :root {
        --primary: #059669;
        --primary-light: #34d399;
        --danger: #ff3b60;
        --bg: #f5f5f8;
        --card-bg: rgba(255,255,255,0.75);
        --text: #1d1d24;
        --text-muted: #6b6c7a;
        --border: rgba(255,255,255,0.5);
        --radius: 16px;
    }
    [data-theme="dark"] {
        --bg: #111118;
        --card-bg: rgba(30,30,45,0.7);
        --text: #e8e8f0;
        --text-muted: #8e8ea0;
        --border: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg); color: var(--text);
        min-height: 100vh;
    }
    .login-wrap {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; padding: 20px;
    }
    .login-card {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: 24px; padding: 40px 32px; width: 100%; max-width: 380px;
        backdrop-filter: blur(20px); box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }
    .login-card h1 { font-size: 24px; margin-bottom: 6px; }
    .login-card p { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
    .login-card input {
        width: 100%; padding: 12px 16px; border-radius: 12px;
        border: 1px solid var(--border); background: rgba(255,255,255,0.15);
        font-size: 14px; margin-bottom: 12px; outline: none; color: var(--text);
        transition: border 0.3s;
    }
    .login-card input:focus { border-color: var(--primary); }
    .login-card button {
        width: 100%; padding: 12px; border-radius: 12px;
        border: none; background: var(--primary); color: white;
        font-size: 15px; font-weight: 600; cursor: pointer;
        transition: all 0.3s; margin-top: 6px;
    }
    .login-card button:hover { opacity: 0.88; }
    .login-err { color: var(--danger); font-size: 12px; margin-top: 8px; text-align: center; }

    .dashboard { display: none; }
    .dash-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 24px; background: var(--card-bg);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 10;
        flex-wrap: wrap; gap: 8px;
    }
    .dash-header h1 { font-size: 18px; }
    .dash-header .dh-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .dash-header button {
        padding: 6px 16px; border-radius: 8px; border: 1px solid var(--border);
        background: rgba(255,255,255,0.1); cursor: pointer; font-size: 13px;
        color: var(--text); transition: all 0.3s;
    }
    .dash-header button:hover { background: rgba(255,255,255,0.18); }
    .dash-header button.active { background: var(--primary); color: white; border-color: var(--primary); }
    .dash-header button.danger { color: var(--danger); border-color: rgba(255,59,96,0.3); }

    .dash-content { padding: 20px 24px; max-width: 1200px; margin: 0 auto; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadeIn 0.35s ease; }
    @keyframes fadeIn { 0%{opacity:0;transform:translateY(8px)} 100%{opacity:1;transform:translateY(0)} }

    .card {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
        backdrop-filter: blur(12px);
    }
    .card h3 { font-size: 15px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 12px; margin-bottom: 16px; }
    .stat-box {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 16px; text-align: center;
        backdrop-filter: blur(12px);
    }
    .stat-box .val { font-size: 28px; font-weight: 800; color: var(--primary); }
    .stat-box .lbl { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-weight: 600; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    td { color: var(--text); }
    tr:hover td { background: rgba(5,150,105,0.03); }
    .table-wrap { max-height: 400px; overflow-y: auto; border-radius: var(--radius); }

    .btn-sm {
        padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border);
        background: rgba(255,255,255,0.1); cursor: pointer; font-size: 12px;
        color: var(--text); transition: all 0.3s; margin: 2px;
    }
    .btn-sm:hover { background: rgba(255,255,255,0.18); }
    .btn-sm.del { color: var(--danger); border-color: rgba(255,59,96,0.3); }
    .btn-sm.del:hover { background: rgba(255,59,96,0.12); }
    .btn-sm.primary { background: var(--primary); color: white; border-color: var(--primary); }

    textarea {
        width: 100%; min-height: 80px; padding: 12px; border-radius: 12px;
        border: 1px solid var(--border); background: rgba(255,255,255,0.1);
        font-size: 13px; outline: none; resize: vertical; color: var(--text);
        font-family: inherit;
    }
    textarea:focus { border-color: var(--primary); }
    .publish-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 8px; }
    .publish-row textarea { flex: 1; }
    .publish-row button { flex-shrink: 0; padding: 8px 20px; }

    .loading { text-align: center; padding: 40px; color: var(--text-muted); }
    .empty { text-align: center; padding: 32px; color: var(--text-muted); font-size: 13px; }
    .badge {
        display: inline-block; padding: 2px 8px; border-radius: 99px;
        font-size: 11px; font-weight: 600;
    }
    .badge-green { background: rgba(5,150,105,0.15); color: var(--primary); }
    .badge-red { background: rgba(255,59,96,0.15); color: var(--danger); }

    .search-bar {
        display: flex; gap: 8px; margin-bottom: 14px;
    }
    .search-bar input {
        flex: 1; padding: 8px 14px; border-radius: 10px;
        border: 1px solid var(--border); background: rgba(255,255,255,0.1);
        font-size: 13px; outline: none; color: var(--text);
    }
    .search-bar input:focus { border-color: var(--primary); }

    .toast-wrap {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        z-index: 9999; display: flex; flex-direction: column; gap: 8px;
        pointer-events: none;
    }
    .toast-item {
        padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 500;
        color: white; pointer-events: auto;
        backdrop-filter: blur(16px); box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        animation: toastIn 0.35s ease, toastOut 0.35s ease 2.2s forwards;
        max-width: 360px; text-align: center;
    }
    .toast-success { background: rgba(5,150,105,0.88); }
    .toast-error { background: rgba(255,59,96,0.88); }
    .toast-info { background: rgba(59,130,246,0.88); }
    @keyframes toastIn { 0%{opacity:0;transform:translateY(-20px) scale(0.9)} 100%{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes toastOut { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-20px) scale(0.9)} }

    .modal-overlay {
        position: fixed; inset: 0; z-index: 9998;
        background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
        display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; animation: fadeIn 0.25s ease; }
    .modal-dialog {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: 20px; padding: 28px 24px; width: 90%; max-width: 400px;
        backdrop-filter: blur(20px); box-shadow: 0 16px 48px rgba(0,0,0,0.2);
        animation: modalPop 0.3s ease;
    }
    @keyframes modalPop { 0%{opacity:0;transform:scale(0.9) translateY(10px)} 100%{opacity:1;transform:scale(1) translateY(0)} }
    .modal-dialog h3 { font-size: 17px; margin-bottom: 10px; }
    .modal-dialog p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
    .modal-dialog .modal-btns { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-dialog .modal-btns button {
        padding: 10px 22px; border-radius: 10px; border: 1px solid var(--border);
        font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.25s;
        background: rgba(255,255,255,0.1); color: var(--text);
    }
    .modal-dialog .modal-btns button:hover { background: rgba(255,255,255,0.18); }
    .modal-dialog .modal-btns button.btn-danger { background: var(--danger); color: white; border-color: var(--danger); }
    .modal-dialog .modal-btns button.btn-danger:hover { opacity: 0.85; }
    .modal-dialog .modal-btns button.btn-cancel { background: rgba(255,255,255,0.08); }

    @media (max-width: 640px) {
        .dash-header { flex-direction: column; align-items: flex-start; }
        .dash-header .dh-right { width: 100%; overflow-x: auto; flex-wrap: nowrap; }
        .stats-row { grid-template-columns: repeat(2,1fr); }
        .dash-content { padding: 12px; }
        table { font-size: 11px; }
        th, td { padding: 8px 6px; }
        .toast-item { max-width: 280px; font-size: 13px; padding: 10px 18px; }
    }
</style>
</head>
<body>
<div class="toast-wrap" id="toastWrap"></div>

<div class="modal-overlay" id="confirmModal">
    <div class="modal-dialog">
        <h3 id="confirmTitle">确认操作</h3>
        <p id="confirmMsg">确定要执行此操作吗？</p>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeConfirm()">取消</button>
            <button class="btn-danger" id="confirmOkBtn" onclick="execConfirm()">确认删除</button>
        </div>
    </div>
</div>

<div class="login-wrap" id="loginWrap">
    <div class="login-card">
        <h1>🔐 xtj 管理后台</h1>
        <p>仅限管理员登录</p>
        <input id="loginName" placeholder="管理员账号" autocomplete="off" />
        <input id="loginPw" type="password" placeholder="管理员密码" />
        <button onclick="doAdminLogin()">登录后台</button>
        <div class="login-err" id="loginErr"></div>
    </div>
</div>

<div class="dashboard" id="dashboard">
    <div class="dash-header">
        <h1>⚙️ xtj 管理后台</h1>
        <div class="dh-right">
            <button id="tabAnnBtn" class="active" onclick="switchTab('ann')">📢 公告管理</button>
            <button id="tabUsersBtn" onclick="switchTab('users')">👥 用户数据</button>
            <button id="tabPostsBtn" onclick="switchTab('posts')">📝 帖子管理</button>
            <button id="tabLikesBtn" onclick="switchTab('likes')">❤️ 点赞数据</button>
            <button id="tabCommentsBtn" onclick="switchTab('comments')">💬 评论数据</button>
            <button onclick="toggleTheme()" title="切换主题">🌓</button>
            <button class="danger" onclick="doAdminLogout()">退出</button>
        </div>
    </div>
    <div class="dash-content">
        <div class="tab-panel active" id="tabAnn"></div>
        <div class="tab-panel" id="tabUsers"></div>
        <div class="tab-panel" id="tabPosts"></div>
        <div class="tab-panel" id="tabLikes"></div>
        <div class="tab-panel" id="tabComments"></div>
    </div>
</div>

<script>
(function() {
    var SUPABASE_URL = "https://ithowxqignlhkwaykglt.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0aG93eHFpZ25saGt3YXlrZ2x0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNzE1MTEsImV4cCI6MjA5Mjc0NzUxMX0.fNmh0HjNuIZaJTa56gMITwKpJMQfJ8mBN41HMhvyDDA";
    var ADMIN = "xxz";
    var ADMIN_PW = "xxz123";
    var AUTH_MARKER = "__auth__";
    var DM_MARKER = "__dm__";
    var ANN_MARKER = "__ann__";
    var SESSION_KEY = "xtj_admin_session";

    var sb = null;
    var allPosts = [], allLikes = [], allComments = [], allUsers = [], annList = [];
    var searchUser = '', searchPost = '';
    var confirmCallback = null;
    var currentTab = 'ann'; // 保存当前tab

    function showToast(msg, type) {
        var wrap = document.getElementById('toastWrap');
        var item = document.createElement('div');
        item.className = 'toast-item toast-' + (type || 'info');
        item.textContent = msg;
        wrap.appendChild(item);
        setTimeout(function() {
            if (item.parentNode) item.parentNode.removeChild(item);
        }, 2600);
    }

    window.showConfirm = function(title, msg, btnText, cb) {
        document.getElementById('confirmTitle').textContent = title || '确认操作';
        document.getElementById('confirmMsg').textContent = msg || '确定要执行此操作吗？';
        document.getElementById('confirmOkBtn').textContent = btnText || '确认删除';
        confirmCallback = cb;
        document.getElementById('confirmModal').classList.add('active');
    };

    window.closeConfirm = function() {
        document.getElementById('confirmModal').classList.remove('active');
        confirmCallback = null;
    };

    window.execConfirm = function() {
        document.getElementById('confirmModal').classList.remove('active');
        if (typeof confirmCallback === 'function') {
            var cb = confirmCallback;
            confirmCallback = null;
            cb();
        }
    };

    function saveSession() {
        localStorage.setItem(SESSION_KEY, JSON.stringify({ t: Date.now() }));
    }

    function clearSession() {
        localStorage.removeItem(SESSION_KEY);
    }

    function hasSession() {
        try {
            var raw = localStorage.getItem(SESSION_KEY);
            if (!raw) return false;
            var s = JSON.parse(raw);
            return (Date.now() - s.t) < 24 * 60 * 60 * 1000;
        } catch(e) { return false; }
    }

    async function initAdminClient() {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        document.getElementById('loginWrap').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        saveSession();
        await loadAllData();
    }

    window.doAdminLogin = async function() {
        var name = document.getElementById('loginName').value.trim();
        var pw = document.getElementById('loginPw').value;
        var err = document.getElementById('loginErr');
        if (name !== ADMIN) { err.textContent = '账号不正确'; return; }
        if (pw !== ADMIN_PW) { err.textContent = '密码错误'; return; }
        err.textContent = '';
        await initAdminClient();
    };

    window.doAdminLogout = function() {
        sb = null;
        allPosts = []; allLikes = []; allComments = []; allUsers = [];
        annList = [];
        clearSession();
        document.getElementById('loginWrap').style.display = 'flex';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('loginName').value = '';
        document.getElementById('loginPw').value = '';
    };

    async function loadAllData(keepTab) {
        try {
            var postRes = await sb.from('posts').select('*').order('created_at', {ascending: false}).limit(5000);
            var likeRes = await sb.from('likes').select('*').order('created_at', {ascending: false}).limit(5000);
            var commRes = await sb.from('comments').select('*').order('created_at', {ascending: false}).limit(5000);

            allPosts = (postRes.data || []).filter(function(p) { return p.media_type !== AUTH_MARKER && p.media_type !== DM_MARKER; });
            annList = (postRes.data || []).filter(function(p) { return p.media_type === ANN_MARKER; });
            allLikes = likeRes.data || [];
            allComments = commRes.data || [];

            var userMap = {};
            allPosts.forEach(function(p) { userMap[p.user_name] = true; });
            allLikes.forEach(function(l) { userMap[l.user_name] = true; });
            allComments.forEach(function(c) { userMap[c.user_name] = true; });
            allUsers = Object.keys(userMap).sort();

            if (!keepTab) {
                switchTab('ann');
            } else {
                renderTab(currentTab);
            }
        } catch(e) {
            console.error(e);
            showToast('数据加载失败，请刷新重试', 'error');
        }
    }

    window.switchTab = function(tab) {
        currentTab = tab; // 保存当前tab
        ['ann','users','posts','likes','comments'].forEach(function(t) {
            document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.remove('active');
            document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1) + 'Btn').classList.remove('active');
        });
        document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
        document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1) + 'Btn').classList.add('active');
        renderTab(tab);
    };

    function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s || '';
        return d.innerHTML;
    }

    function formatTime(d) {
        if (!d) return '';
        return new Date(d).toLocaleString();
    }

    function renderTab(tab) {
        var el = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
        if (!el) return;
        switch(tab) {
            case 'ann': renderAnnTab(el); break;
            case 'users': renderUsersTab(el); break;
            case 'posts': renderPostsTab(el); break;
            case 'likes': renderLikesTab(el); break;
            case 'comments': renderCommentsTab(el); break;
        }
    }

    function renderAnnTab(el) {
        var h = '<div class="card"><h3>📢 发布新公告</h3>';
        h += '<textarea id="adminAnnInp" placeholder="输入公告内容..." maxlength="2000"></textarea>';
        h += '<div class="publish-row"><button class="btn-sm primary" onclick="publishAdminAnn()">发布公告</button></div></div>';
        h += '<div class="card"><h3>📋 公告列表（' + annList.length + '条）</h3>';
        if (!annList.length) {
            h += '<div class="empty">暂无公告</div>';
        } else {
            h += '<div class="table-wrap"><table><thead><tr><th>内容</th><th>发布时间</th><th>操作</th></tr></thead><tbody>';
            annList.forEach(function(a) {
                var preview = (a.content || '').slice(0, 80);
                if (a.content && a.content.length > 80) preview += '...';
                h += '<tr><td>' + escapeHtml(preview) + '</td><td>' + formatTime(a.created_at) + '</td>';
                h += '<td><button class="btn-sm del" onclick="deleteAdminAnn(\'' + a.id + '\')">删除</button></td></tr>';
            });
            h += '</tbody></table></div>';
        }
        h += '</div>';
        el.innerHTML = h;
    }

    function renderUsersTab(el) {
        var h = '<div class="stats-row">';
        h += '<div class="stat-box"><div class="val">' + allUsers.length + '</div><div class="lbl">注册用户总数</div></div>';
        h += '<div class="stat-box"><div class="val">' + allPosts.length + '</div><div class="lbl">总帖子数</div></div>';
        h += '<div class="stat-box"><div class="val">' + allLikes.length + '</div><div class="lbl">总点赞数</div></div>';
        h += '<div class="stat-box"><div class="val">' + allComments.length + '</div><div class="lbl">总评论数</div></div>';
        h += '</div>';
        h += '<div class="card"><h3>👥 用户列表</h3>';
        h += '<div class="search-bar"><input id="userSearchInp" placeholder="搜索用户..." oninput="searchUserInp()" /></div>';
        var filtered = allUsers;
        if (searchUser) filtered = allUsers.filter(function(u) { return u.toLowerCase().includes(searchUser.toLowerCase()); });
        if (!filtered.length) { h += '<div class="empty">无匹配用户</div>'; }
        else {
            h += '<div class="table-wrap"><table><thead><tr><th>用户名</th><th>帖子数</th><th>点赞数</th><th>评论数</th></tr></thead><tbody>';
            filtered.forEach(function(u) {
                var pc = allPosts.filter(function(p) { return p.user_name === u; }).length;
                var lc = allLikes.filter(function(l) { return l.user_name === u; }).length;
                var cc = allComments.filter(function(c) { return c.user_name === u; }).length;
                h += '<tr><td><strong>' + escapeHtml(u) + '</strong>' + (u === ADMIN ? ' <span class="badge badge-red">管理员</span>' : '') + '</td>';
                h += '<td>' + pc + '</td><td>' + lc + '</td><td>' + cc + '</td></tr>';
            });
            h += '</tbody></table></div>';
        }
        h += '</div>';
        el.innerHTML = h;
    }

    function renderPostsTab(el) {
        var visiblePosts = allPosts.filter(function(p) { return p.media_type !== ANN_MARKER; });
        var h = '<div class="card"><h3>📝 帖子管理（' + visiblePosts.length + '条）</h3>';
        h += '<div class="search-bar"><input id="postSearchInp" placeholder="搜索帖子内容或用户名..." oninput="searchPostInp()" /></div>';
        var filtered = visiblePosts;
        if (searchPost) {
            var q = searchPost.toLowerCase();
            filtered = visiblePosts.filter(function(p) {
                return (p.user_name || '').toLowerCase().includes(q) || (p.content || '').toLowerCase().includes(q);
            });
        }
        if (!filtered.length) { h += '<div class="empty">无匹配帖子</div>'; }
        else {
            h += '<div class="table-wrap"><table><thead><tr><th>用户</th><th>内容</th><th>浏览</th><th>时间</th><th>操作</th></tr></thead><tbody>';
            filtered.forEach(function(p) {
                var content = (p.content || '').slice(0, 50);
                if (p.content && p.content.length > 50) content += '...';
                h += '<tr><td>' + escapeHtml(p.user_name || '') + '</td>';
                h += '<td>' + escapeHtml(content) + (p.media_url ? ' 📎' : '') + '</td>';
                h += '<td>' + (p.views || 0) + '</td>';
                h += '<td>' + formatTime(p.created_at) + '</td>';
                h += '<td><button class="btn-sm del" onclick="deleteAdminPost(\'' + p.id + '\')">删除</button></td></tr>';
            });
            h += '</tbody></table></div>';
        }
        h += '</div>';
        el.innerHTML = h;
    }

    function renderLikesTab(el) {
        var h = '<div class="card"><h3>❤️ 点赞记录（' + allLikes.length + '条）</h3>';
        if (!allLikes.length) { h += '<div class="empty">暂无点赞数据</div>'; }
        else {
            h += '<div class="table-wrap"><table><thead><tr><th>用户</th><th>帖子作者</th><th>帖子内容</th><th>时间</th></tr></thead><tbody>';
            var recentLikes = allLikes.slice(0, 500);
            recentLikes.forEach(function(l) {
                var post = allPosts.find(function(p) { return p.id === l.post_id; });
                var postContent = post ? ((post.content || '').slice(0, 30) + (post.content && post.content.length > 30 ? '...' : '')) : '(已删除)';
                h += '<tr><td>' + escapeHtml(l.user_name || '') + '</td>';
                h += '<td>' + escapeHtml((post && post.user_name) || '') + '</td>';
                h += '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(postContent) + '</td>';
                h += '<td>' + formatTime(l.created_at) + '</td></tr>';
            });
            h += '</tbody></table></div>';
            if (allLikes.length > 500) h += '<div class="empty">仅显示最近500条记录</div>';
        }
        h += '</div>';
        el.innerHTML = h;
    }

    function renderCommentsTab(el) {
        var h = '<div class="card"><h3>💬 评论记录（' + allComments.length + '条）</h3>';
        if (!allComments.length) { h += '<div class="empty">暂无评论数据</div>'; }
        else {
            h += '<div class="table-wrap"><table><thead><tr><th>用户</th><th>评论内容</th><th>时间</th><th>状态</th><th>操作</th></tr></thead><tbody>';
            var recentComments = allComments.slice(0, 500);
            recentComments.forEach(function(c) {
                var isDeleted = c.content && c.content.startsWith('__DELETED_BY_');
                var displayContent = c.content || '';
                var deletedBy = '';
                if (isDeleted) {
                    var m = c.content.match(/^__DELETED_BY_(.+?)__/);
                    deletedBy = m ? m[1] : 'unknown';
                    displayContent = c.content.replace(/^__DELETED_BY_.+?__/, '');
                }
                h += '<tr><td>' + escapeHtml(c.user_name || '') + '</td>';
                h += '<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(displayContent) + '</td>';
                h += '<td>' + formatTime(c.created_at) + '</td>';
                if (isDeleted) {
                    h += '<td><span class="badge badge-red">已删除</span><br><span style="font-size:11px;color:var(--text-muted);">by ' + escapeHtml(deletedBy) + '</span></td>';
                    h += '<td>-</td>';
                } else {
                    h += '<td><span class="badge badge-green">正常</span></td>';
                    h += '<td><button class="btn-sm del" onclick="deleteAdminComment(' + c.id + ', \'' + (c.actor_key || '') + '\')">删除</button></td>';
                }
                h += '</tr>';
            });
            h += '</tbody></table></div>';
            if (allComments.length > 500) h += '<div class="empty">仅显示最近500条记录</div>';
        }
        h += '</div>';
        el.innerHTML = h;
    }

    window.publishAdminAnn = async function() {
        var inp = document.getElementById('adminAnnInp');
        var content = (inp.value || '').trim();
        if (!content) { showToast('请输入公告内容', 'error'); return; }
        try {
            var res = await sb.from('posts').insert([{
                user_name: ADMIN, content: content,
                media_type: ANN_MARKER, media_url: '',
                actor_key: 'admin_' + Date.now()
            }]);
            if (res.error) { showToast('发布失败: ' + res.error.message, 'error'); return; }
            inp.value = '';
            await loadAllData(true); // 保持当前tab
            showToast('公告已发布', 'success');
        } catch(e) { showToast('发布失败: ' + e.message, 'error'); }
    };

    window.deleteAdminAnn = function(id) {
        showConfirm(
            '删除公告',
            '确定要删除此公告吗？删除后所有用户将无法查看。',
            '确认删除',
            async function() {
                try {
                    var ann = annList.find(function(x) { return x.id === id; });
                    var key = ann ? ann.actor_key : 'admin_' + Date.now();
                    var res = await sb.rpc('delete_post_with_actor', { p_post_id: id, p_actor_key: key });
                    if (res.error) { showToast('删除失败: ' + res.error.message, 'error'); return; }
                    if (!res.data) { showToast('公告不存在或已被删除', 'info'); }
                    await loadAllData(true); // 保持当前tab
                    showToast('公告已删除', 'success');
                } catch(e) { showToast('删除失败: ' + e.message, 'error'); }
            }
        );
    };

    window.deleteAdminPost = function(id) {
        showConfirm(
            '删除帖子',
            '确定要删除此帖子吗？此操作不可恢复，相关的点赞和评论也会一并删除。',
            '确认删除',
            async function() {
                try {
                    var post = allPosts.find(function(x) { return x.id === id; });
                    var key = post ? post.actor_key : 'admin_' + Date.now();
                    var res = await sb.rpc('delete_post_with_actor', { p_post_id: id, p_actor_key: key });
                    if (res.error) { showToast('删除失败: ' + res.error.message, 'error'); return; }
                    if (!res.data) { showToast('帖子不存在或已被删除', 'info'); }
                    await loadAllData(true); // 保持当前tab
                    showToast('帖子已删除', 'success');
                } catch(e) { showToast('删除失败: ' + e.message, 'error'); }
            }
        );
    };

    // 管理后台删除评论 - 通过 RPC 绕过 RLS
    window.deleteAdminComment = function(id, actorKey) {
        showConfirm(
            '删除评论',
            '确定要删除此评论吗？评论将标记为删除，但记录保留。',
            '确认删除',
            async function() {
                try {
                    var cid = parseInt(id, 10);
                    var res = await sb.rpc('delete_comment_v2', {
                        p_comment_id: cid,
                        p_deleted_by: ADMIN
                    });
                    if (res.error) {
                        showToast('删除失败: ' + res.error.message, 'error');
                        return;
                    }
                    if (res.data && res.data.success) {
                        await loadAllData(true);
                        showToast('评论已标记为删除', 'success');
                    } else {
                        showToast('删除失败: ' + (res.data && res.data.message ? res.data.message : '未知错误'), 'error');
                    }
                } catch(e) { showToast('删除失败: ' + e.message, 'error'); }
            }
        );
    };

    window.searchUserInp = function() {
        searchUser = document.getElementById('userSearchInp').value.trim();
        renderTab('users');
    };
    window.searchPostInp = function() {
        searchPost = document.getElementById('postSearchInp').value.trim();
        renderTab('posts');
    };

    window.toggleTheme = function() {
        var html = document.documentElement;
        var isDark = html.getAttribute('data-theme') === 'dark';
        if (isDark) { html.removeAttribute('data-theme'); localStorage.setItem('xtj-admin-theme', 'light'); }
        else { html.setAttribute('data-theme', 'dark'); localStorage.setItem('xtj-admin-theme', 'dark'); }
    };

    (function() {
        var saved = localStorage.getItem('xtj-admin-theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        if (hasSession()) {
            initAdminClient();
        }
    })();
})();
</script>
