name: Auto Fix Tool Promise Guard

on:
  push:
    paths:
      - 'scripts/auto-fix-tool-promise.js'
      - '.github/workflows/auto-fix-tool-promise.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run fix script
        run: node scripts/auto-fix-tool-promise.js

      - name: Commit patched server.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add render-api/server.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: guard parallel tool execution with try/catch [skip ci]"
            git push
          fi
