name: Render Keep Alive

on:
  # Manual recovery only. Recurring keepalive runs in Supabase pg_cron.
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # No checkout, dependency installation, website login or secrets required.
      # Only warm the main site: free services share the workspace's monthly hours.
      - name: Wake the main Render service
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          url = 'https://xtj.onrender.com/health'
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(url, headers={
                      'User-Agent': 'XTJ-Render-KeepAlive/1.0',
                      'Cache-Control': 'no-cache',
                  })
                  with urllib.request.urlopen(request, timeout=90) as response:
                      payload = json.load(response)
                  if payload.get('ok') is not True or payload.get('node', {}).get('status') != 'running':
                      raise ValueError('Service is not healthy yet')
                  print('Main Render service is awake and healthy.')
                  break
              except (OSError, ValueError) as error:
                  print(f'Attempt {attempt}/3 failed: {error}')
                  if attempt == 3:
                      raise SystemExit('Main Render service did not become healthy.')
                  time.sleep(10)
          PY
