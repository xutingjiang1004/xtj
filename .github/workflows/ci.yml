name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Run build consistency check
        run: npm run test:consistency

      - name: Verify generated assets are committed
        run: git diff --exit-code

      - name: Run project tests
        run: npm test

  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unified syntax check
        run: npm run test:syntax

      - name: Finish
        run: echo "ALL SYNTAX CHECKS PASSED"

  ui:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, syntax]

    env:
      API_SECRET: test-ci-secret-key-123456
      SUPABASE_SERVICE_KEY: test-ci-service-key-123456
      ADMIN_PASSWORD: test-admin-password-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm run test:ui
