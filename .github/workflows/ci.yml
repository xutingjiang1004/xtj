name: CI

on:
  push:
    branches:
      - main
      - xtj-hotfix

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify generated assets are committed
        run: git diff --exit-code

      - name: Run project tests
        run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check render-api/server.js

      - name: Check build script syntax
        run: node --check scripts/build.js

      - name: Check core syntax
        run: node --check js/core.js

      - name: Check login device syntax
        run: node --check js/login-device.js

      - name: Check AI agent syntax
        run: node --check js/ai-agent.js

      - name: Finish
        run: echo "ALL SYNTAX CHECKS PASSED"
