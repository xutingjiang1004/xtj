name: CI

on:
  push:
    branches:
      - main
      - xtj-hotfix

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run project tests
        run: npm test
        # Note: `npm run build` is intentionally not run in CI. The minified
        # assets (*.min.css / *.min.js) are stored via Git LFS and committed
        # alongside the source files; running build in CI risks regenerating
        # .min files with byte-different output (csso / terser are not 100%
        # deterministic across Node versions or platforms) and breaking the
        # git diff check below. Source-of-truth for hash sync is the existing
        # test "index.html CSS/JS query hashes match file content".

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check render-api/server.js

      - name: Check build script syntax
        run: node --check scripts/build.js

      - name: Check core syntax
        run: node --check js/core.js

      - name: Check login device syntax
        run: node --check js/login-device.js

      - name: Check AI agent syntax
        run: node --check js/ai-agent.js

      - name: Check English learning syntax
        run: node --check js/english-learning.js

      - name: Check English dictionary syntax
        run: node --check js/english-dict.js

      - name: Finish
        run: echo "ALL SYNTAX CHECKS PASSED"
