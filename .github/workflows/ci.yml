name: CI

on:
  push:
    branches: [main, xtj-hotfix]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Check for garbled visible strings
        run: |
          for f in js/ai-agent.js js/english-learning.js; do
            while IFS= read -r line; do
              case "$line" in \*\ /\*|\/\/*|*) continue ;; esac
              if echo "$line" | grep -qF '鈥' || echo "$line" | grep -qF '错误错误'; then
                echo "FAIL: $f"
                exit 1
              fi
            done < "$f"
          done
          echo "OK: No garbled visible strings"
      - name: Check no legacy auth
        run: |
          if grep -qF 'password_hash' js/english-learning.js; then
            echo "FAIL: password_hash still referenced"
            exit 1
          fi
          echo "OK: No legacy auth"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node --check render-api/server.js
      - run: node --check js/core.js
      - run: node --check js/ai-agent.js
      - run: node --check js/english-learning.js
      - run: node --check js/english-dict.js
      - run: echo "ALL SYNTAX CHECKS PASSED"
