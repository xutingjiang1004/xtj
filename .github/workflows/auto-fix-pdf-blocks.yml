name: Auto-fix server.js generate_pdf blocks

on:
  push:
    branches: [main]
    paths: ['.github/workflows/auto-fix-pdf-blocks.yml', 'scripts/auto-fix-pdf-blocks.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run patch script
        run: node scripts/auto-fix-pdf-blocks.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add render-api/server.js
          if git diff --cached --quiet; then
            echo "No changes to commit - already patched or target not found."
          else
            git commit -m "[skip ci] fix: generate_pdf blocks参数容错——模型传content/text时自动转blocks"
            git push
            echo "Successfully pushed fix."
          fi
