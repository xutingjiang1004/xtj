<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#047857" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Glass highlight -->
  <rect x="16" y="16" width="480" height="240" rx="96" ry="96" fill="url(#glow)"/>
  <!-- X letter -->
  <g filter="url(#shadow)">
    <line x1="156" y1="156" x2="356" y2="356" stroke="white" stroke-width="36" stroke-linecap="round"/>
    <line x1="356" y1="156" x2="156" y2="356" stroke="white" stroke-width="36" stroke-linecap="round"/>
  </g>
  <!-- Small decorative dots -->
  <circle cx="380" cy="140" r="6" fill="white" opacity="0.4"/>
  <circle cx="140" cy="380" r="4" fill="white" opacity="0.3"/>
</svg>
