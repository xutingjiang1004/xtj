<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xtj - 纯净雨境版</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      /* 浅绿玻璃主题 */
      --primary: #059669;
      --bg-light-green: #eef7f2;
      --text-main: #1d1d24;
      --text-muted: #6b6c7a;
      --radius-md: 24px;
      --trans-ppt: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      --trans-spring: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: -apple-system, system-ui, sans-serif;
      color: var(--text-main); background: var(--bg-light-green);
      min-height: 100vh; overflow-x: hidden;
    }

    /* 动态雨滴背景系统 */
    .background-system {
      position: fixed; inset: 0; z-index: -1;
      background: linear-gradient(160deg, #e8f5e9 0%, #c8e6c9 100%);
    }
    #rainCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .glass-overlay {
      position: absolute; inset: 0;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      background: rgba(255, 255, 255, 0.15);
    }

    .glass {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px rgba(5, 150, 105, 0.05);
    }

    nav {
      position: sticky; top: 0; z-index: 100; padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.3);
    }
    h1 { margin: 0; font-size: 20px; background: linear-gradient(135deg, #059669, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .nav-auth { display: flex; gap: 8px; }
    .nav-input {
      background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.8);
      padding: 6px 12px; border-radius: 99px; outline: none; width: 110px; font-size: 13px;
    }
    .btn {
      cursor: pointer; border: none; font-weight: 600; padding: 7px 16px; border-radius: 99px;
      font-size: 13px; transition: var(--trans-spring); display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-primary { background: var(--primary); color: white; }

    .wrap { max-width: 600px; margin: 20px auto; padding: 0 16px; position: relative; z-index: 1; }

    .publish-box { padding: 20px; border-radius: var(--radius-md); margin-bottom: 24px; }
    .publish-box textarea {
      width: 100%; min-height: 60px; border: none; background: transparent; resize: none; font-size: 15px; outline: none;
    }

    .feed { display: flex; flex-direction: column; gap: 16px; }
    .post { 
      padding: 20px; border-radius: var(--radius-md); 
      opacity: 0; transform: translateY(20px); transition: var(--trans-ppt);
    }
    .post.visible { opacity: 1; transform: translateY(0); }

    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #059669; color: white; font-weight: bold; }
    .avatar.admin { background: linear-gradient(135deg, #ff9f0a, #ff3b60); }
    .user-name { font-weight: 700; font-size: 14px; }
    .admin-tag { font-size: 10px; background: #ff9f0a; color: white; padding: 1px 5px; border-radius: 4px; margin-left: 4px; }

    .content { font-size: 15px; line-height: 1.5; margin-bottom: 12px; }
    .media img { width: 100%; border-radius: 12px; margin-bottom: 12px; }

    .post-stats-text { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

    .actions { display: flex; gap: 8px; align-items: center; }

    /* 修复按钮对齐问题：固定宽度 + Flex居中 */
    .action-btn { 
      background: rgba(255,255,255,0.5); 
      border: 1px solid rgba(255,255,255,0.5); 
      padding: 6px 0; border-radius: 99px; font-size: 13px; color: var(--text-muted); 
      width: 82px; /* 固定宽度防止跳动 */
      display: inline-flex; justify-content: center; align-items: center;
      transition: var(--trans-spring); font-weight: 600; cursor: pointer;
    }
    .action-btn.liked { color: #ff3b60; background: rgba(255, 59, 96, 0.08); border-color: rgba(255, 59, 96, 0.2); }
    .action-btn.del { width: auto; padding: 6px 12px; margin-left: auto; color: #ff3b60; background: transparent; border: none; }

    .comments { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.05); display: grid; gap: 6px; }
    .comment-item { 
      padding: 8px 12px; background: rgba(255,255,255,0.3); border-radius: 10px; font-size: 13px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .comment-del-btn { background: transparent; border: none; color: #ff3b60; opacity: 0.4; cursor: pointer; padding: 2px 8px; }

    /* PPT级平滑弹窗动画 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.2); 
      backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 200;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal-box {
      width: 85%; max-width: 360px; padding: 24px; border-radius: 30px;
      transform: translateY(40px) scale(0.95); opacity: 0;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-overlay.active .modal-box { transform: translateY(0) scale(1); opacity: 1; }

    .loading-state { text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px; }
  </style>
</head>
<body>

  <div class="background-system">
    <canvas id="rainCanvas"></canvas>
    <div class="glass-overlay"></div>
  </div>

  <nav>
    <h1>xtj</h1>
    <div class="nav-auth">
      <div id="unauthUI">
        <input id="nickInp" class="nav-input" placeholder="输入昵称" />
        <button class="btn btn-primary" onclick="doLogin()">登录</button>
      </div>
      <div id="authUI" style="display: none;">
        <span id="myName" style="font-weight:700; font-size:13px; margin-right:10px;"></span>
        <button class="btn" style="padding:4px 10px;" onclick="doLogout()">退出</button>
      </div>
    </div>
  </nav>

  <div class="wrap">
    <div class="publish-box glass">
      <textarea id="postInp" placeholder="此刻在想什么..."></textarea>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
        <input type="file" id="fileInp" style="font-size:12px; width:150px;" />
        <button class="btn btn-primary" id="pubBtn" onclick="doPublish()">发布动态</button>
      </div>
    </div>

    <div id="feed" class="feed">
      <div class="loading-state">正在同步雨境动态...</div>
    </div>
  </div>

  <div class="modal-overlay" id="commentModal">
    <div class="modal-box glass">
      <h3 style="margin-top:0">发表评论</h3>
      <textarea id="commInp" style="width:100%; min-height:80px; border:none; background:transparent; outline:none; font-size:16px;"></textarea>
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
        <button class="btn" onclick="closeModal('commentModal')">取消</button>
        <button class="btn btn-primary" id="commBtn">发送</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="delModal">
    <div class="modal-box glass" style="text-align:center">
      <h3>确认删除动态？</h3>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn" style="flex:1" onclick="closeModal('delModal')">算了</button>
        <button class="btn btn-primary" style="flex:1; background:#ff3b60" id="delBtn">确认删除</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ithowxqignlhkwaykglt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0aG93eHFpZ25saGt3YXlrZ2x0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNzE1MTEsImV4cCI6MjA5Mjc0NzUxMX0.fNmh0HjNuIZaJTa56gMITwKpJMQfJ8mBN41HMhvyDDA";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ADMIN_NAME = "xxz";
    let currentUser = localStorage.getItem("xtj_user") || "";
    const deviceId = localStorage.getItem("xtj_device_id") || crypto.randomUUID();
    localStorage.setItem("xtj_device_id", deviceId);

    // 核心：雨滴引擎
    function initRain() {
      const canvas = document.getElementById('rainCanvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      let rain = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for(let i=0; i<80; i++) {
        rain.push({ x: Math.random()*w, y: Math.random()*h, l: Math.random()*15+5, s: Math.random()*10+10 });
      }

      function draw() {
        ctx.clearRect(0,0,w,h);
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        rain.forEach(p => {
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x, p.y + p.l);
          p.y += p.s;
          if(p.y > h) { p.y = -20; p.x = Math.random()*w; }
        });
        ctx.stroke();
        requestAnimationFrame(draw);
      }
      draw();
    }

    // 登录与UI
    function initUI() {
      const isLogged = !!currentUser;
      document.getElementById("unauthUI").style.display = isLogged ? "none" : "flex";
      document.getElementById("authUI").style.display = isLogged ? "flex" : "none";
      if(isLogged) document.getElementById("myName").textContent = currentUser;
    }
    function doLogin() {
      const n = document.getElementById("nickInp").value.trim();
      if(!n) return; currentUser = n; localStorage.setItem("xtj_user", n); initUI(); loadFeed();
    }
    function doLogout() { currentUser = ""; localStorage.removeItem("xtj_user"); initUI(); loadFeed(); }

    // 动态加载
    async function loadFeed() {
      // 优化加载体验：不显示全屏Loading，直接更新内容
      try {
        const { data: posts } = await sb.from("posts").select("*").order("created_at", { ascending: false });
        const { data: likes } = await sb.from("likes").select("*");
        const { data: comms } = await sb.from("comments").select("*").order("created_at");
        renderFeed(posts || [], likes || [], comms || []);
      } catch (e) { console.error(e); }
    }

    function renderFeed(posts, likes, comms) {
      const feed = document.getElementById("feed");
      feed.innerHTML = posts.map(p => {
        const pLikes = likes.filter(l => l.post_id === p.id);
        const pComms = comms.filter(c => c.post_id === p.id);
        const isLiked = pLikes.some(l => l.actor_key === deviceId);
        
        // 修复1：只要是当前设备的 ID 或管理员，即可看到删除按钮
        const canDelete = (p.actor_key === deviceId) || (currentUser === ADMIN_NAME);

        return `
          <div class="post glass visible">
            <div class="post-header">
              <div class="avatar ${p.user_name===ADMIN_NAME?'admin':''}">${p.user_name[0].toUpperCase()}</div>
              <div class="user-info">
                <span class="user-name">${p.user_name}${p.user_name===ADMIN_NAME?'<span class="admin-tag">ADMIN</span>':''}</span>
              </div>
            </div>
            <div class="content">${p.content}</div>
            ${p.media_url ? `<div class="media"><img src="${p.media_url}"></div>` : ''}
            <div class="post-stats-text">点赞 ${pLikes.length} · 评论 ${pComms.length}</div>
            <div class="actions">
              <button class="action-btn ${isLiked?'liked':''}" onclick="toggleLike(this, '${p.id}')">
                ${isLiked ? '已点赞' : '点赞'}
              </button>
              <button class="action-btn" onclick="openComment('${p.id}')">评论</button>
              ${canDelete ? `<button class="action-btn del" onclick="reqDelete('${p.id}')">删除</button>` : ''}
            </div>
            ${pComms.length ? `<div class="comments">${pComms.map(c => `
              <div class="comment-item">
                <span><b>${c.user_name}:</b> ${c.content}</span>
                ${(c.actor_key===deviceId || currentUser===ADMIN_NAME) ? `<button class="comment-del-btn" onclick="doDelComm('${c.id}')">×</button>` : ''}
              </div>
            `).join('')}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    // 交互逻辑
    async function toggleLike(btn, pid) {
      if(!currentUser) return alert("请先登录");
      const isLiked = btn.classList.contains("liked");
      btn.classList.toggle("liked");
      btn.textContent = isLiked ? "点赞" : "已点赞"; // 此时宽度不会动

      if(isLiked) {
        await sb.from("likes").delete().match({ post_id: pid, actor_key: deviceId });
      } else {
        await sb.from("likes").insert([{ post_id: pid, user_name: currentUser, actor_key: deviceId }]);
      }
      loadFeed();
    }

    let activePid = null;
    function openComment(pid) { 
      if(!currentUser) return alert("请先登录");
      activePid = pid; 
      document.getElementById("commentModal").classList.add("active"); 
    }
    document.getElementById("commBtn").onclick = async () => {
      const content = document.getElementById("commInp").value.trim();
      if(!content) return;
      await sb.from("comments").insert([{ post_id: activePid, user_name: currentUser, content, actor_key: deviceId }]);
      closeModal('commentModal'); loadFeed();
    };

    function reqDelete(pid) {
      activePid = pid;
      document.getElementById("delModal").classList.add("active");
    }
    document.getElementById("delBtn").onclick = async () => {
      // 这里的 delete_post_with_actor RPC 必须允许 deviceId 操作
      await sb.rpc("delete_post_with_actor", { p_post_id: activePid, p_actor_key: (currentUser === ADMIN_NAME ? 'xxz_master_key' : deviceId) });
      closeModal('delModal'); loadFeed();
    };

    async function doDelComm(cid) {
      await sb.from("comments").delete().eq("id", cid);
      loadFeed();
    }

    async function doPublish() {
      if(!currentUser) return alert("请登录");
      const content = document.getElementById("postInp").value.trim();
      const file = document.getElementById("fileInp").files[0];
      if(!content && !file) return;
      
      document.getElementById("pubBtn").disabled = true;
      let media_url = "";
      if(file) {
        const path = `${Date.now()}_${file.name}`;
        await sb.storage.from("uploads").upload(path, file);
        media_url = sb.storage.from("uploads").getPublicUrl(path).data.publicUrl;
      }
      await sb.from("posts").insert([{ user_name: currentUser, content, media_url, actor_key: deviceId }]);
      document.getElementById("postInp").value = "";
      document.getElementById("pubBtn").disabled = false;
      loadFeed();
    }

    function closeModal(id) { document.getElementById(id).classList.remove("active"); }

    // 初始化
    initRain();
    initUI();
    loadFeed();

    // 订阅更新
    sb.channel('any').on('postgres_changes', {event:'*', schema:'public'}, () => loadFeed()).subscribe();
  </script>
</body>
</html>
