<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>朋友圈</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<h2>登录</h2>
<input id="username" placeholder="输入昵称">
<button onclick="login()">登录</button>

<h2>发布</h2>
<textarea id="content" placeholder="说点什么..."></textarea><br>
<input type="file" id="file">
<button onclick="post()">发布</button>

<h2>动态</h2>
<div id="feed">加载中...</div>

<script>
const supabaseClient = supabase.createClient(
  "https://ithowxqignlhkwaykglt.supabase.co",
  "sb_publishable_RFqxlLe3nKnbs_PUHrJjpg_AUVaOGbu"
);

let user = "";

// 登录
function login(){
  user = document.getElementById("username").value;
  if(!user){
    alert("先输名字");
    return;
  }
  alert("登录成功：" + user);
}

// 发布
async function post(){
  if(!user){
    alert("先登录");
    return;
  }

  let content = document.getElementById("content").value;
  let file = document.getElementById("file").files[0];

  let media_url = "";
  let media_type = "";

  if(file){
    const fileName = Date.now() + "_" + file.name;

    const { data, error } = await supabaseClient.storage
      .from('uploads')
      .upload(fileName, file);

    if(error){
      alert("上传失败");
      console.log(error);
      return;
    }

    const { data: urlData } = supabaseClient.storage
      .from('uploads')
      .getPublicUrl(fileName);

    media_url = urlData.publicUrl;
    media_type = file.type.startsWith("image") ? "image" : "video";
  }

  const { error } = await supabaseClient.from('posts').insert({
    user_name: user,
    content: content,
    media_url: media_url,
    media_type: media_type
  });

  if(error){
    alert("发布失败");
    console.log(error);
    return;
  }

  document.getElementById("content").value = "";
  document.getElementById("file").value = "";

  load();
}

// 加载动态
async function load(){
  const { data, error } = await supabaseClient
    .from('posts')
    .select('*')
    .order('created_at', { ascending: false });

  if(error){
    document.getElementById("feed").innerHTML = "加载失败";
    console.log(error);
    return;
  }

  let html = "";

  data.forEach(p => {
    html += `
      <div style="border:1px solid #ccc;margin:10px;padding:10px">
        <b>${p.user_name}</b><br>
        ${p.content}<br>
        ${p.media_type==="image" ? `<img src="${p.media_url}" width="200">` : ""}
        ${p.media_type==="video" ? `<video src="${p.media_url}" width="200" controls></video>` : ""}
        <br>
        <button onclick="like('${p.id}')">点赞</button>
        <button onclick="comment('${p.id}')">评论</button>
      </div>
    `;
  });

  document.getElementById("feed").innerHTML = html || "还没有动态";
}

// 点赞
async function like(id){
  if(!user){
    alert("先登录");
    return;
  }

  await supabaseClient.from('likes').insert({
    post_id: id,
    user_name: user
  });

  alert("点赞成功");
}

// 评论
async function comment(id){
  if(!user){
    alert("先登录");
    return;
  }

  let text = prompt("输入评论");

  if(!text) return;

  await supabaseClient.from('comments').insert({
    post_id: id,
    user_name: user,
    content: text
  });

  alert("评论成功");
}

load();
</script>

</body>
</html>
