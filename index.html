<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>液态玻璃朋友圈</title>
  <!-- 引入 Supabase 后端工具 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--txt:#0f172a;--sub:#475569;--pri:#6366f1;--line:rgba(255,255,255,.35)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(130deg,#c7d2fe 0%,#dbeafe 35%,#fae8ff 70%,#bfdbfe 100%);overflow-x:hidden}
    .bg-blob{position:fixed;filter:blur(40px);z-index:-1;opacity:.45;animation:float 12s ease-in-out infinite}
    .b1{width:320px;height:320px;background:#818cf8;border-radius:48% 52% 45% 55%/58% 41% 59% 42%;left:-80px;top:-70px}
    .b2{width:420px;height:420px;background:#22d3ee;border-radius:60% 40% 63% 37%/44% 58% 42% 56%;right:-120px;top:120px;animation-delay:1.5s}
    .b3{width:380px;height:380px;background:#f472b6;border-radius:53% 47% 37% 63%/36% 67% 33% 64%;left:20%;bottom:-140px;animation-delay:2.5s}

    .app{max-width:1120px;margin:0 auto;padding:18px}
    .glass{background:rgba(255,255,255,.28);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--line);box-shadow:0 20px 40px rgba(15,23,42,.15)}

    .top{position:sticky;top:14px;z-index:20;border-radius:20px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;animation:enter .5s ease}
    .title{font-size:24px;font-weight:800;letter-spacing:.4px}
    .sub{font-size:12px;color:var(--sub)}

    .grid{display:grid;grid-template-columns:1fr 340px;gap:14px;margin-top:14px}
    .panel{border-radius:20px;padding:14px}
    .feed{display:grid;gap:12px}

    .post{border-radius:16px;padding:12px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.5);transition:all .25s ease;animation:rise .35s ease}
    .post:hover{transform:translateY(-3px);box-shadow:0 16px 28px rgba(30,41,59,.14)}
    .meta{font-size:12px;color:var(--sub)}
    .small{font-size:12px;color:var(--sub)}

    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .btn{border:0;border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:700;transition:all .2s ease}
    .btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(1px) scale(.99)}
    .btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 10px 20px rgba(99,102,241,.3)}
    .btn-ghost{background:rgba(255,255,255,.62);color:#312e81;border:1px solid rgba(255,255,255,.7)}

    textarea,input{width:100%;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.56);border-radius:12px;padding:10px;font:inherit;outline:none;transition:border-color .2s ease,box-shadow .2s ease}
    textarea:focus,input:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.25)}
    textarea{min-height:102px;resize:vertical}

    .toast{position:fixed;right:18px;bottom:18px;background:rgba(15,23,42,.9);color:#fff;padding:10px 12px;border-radius:10px;opacity:0;transform:translateY(10px);transition:all .2s ease;pointer-events:none}
    .toast.show{opacity:1;transform:none}

    @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(8deg)}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes enter{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
    @media (max-width:940px){.grid{grid-template-columns:1fr}.title{font-size:22px}}
  </style>
</head>
<body>
<div class="bg-blob b1"></div><div class="bg-blob b2"></div><div class="bg-blob b3"></div>

<div class="app">
  <header class="top glass">
    <div>
      <div class="title">💧 液态玻璃朋友圈</div>
      <div class="sub">Supabase云端后端：登录发布、游客评论点赞、浏览计数、实时同步</div>
    </div>
    <button id="loginBtn" class="btn btn-primary">登录</button>
  </header>

  <main class="grid">
    <section class="panel glass">
      <div style="font-weight:800;margin-bottom:8px">动态广场</div>
      <div id="feed" class="feed"></div>
    </section>

    <aside class="panel glass">
      <div style="font-weight:800;margin:14px 0 6px">发布文字动态</div>
      <form id="publishForm">
        <textarea name="content" placeholder="发一条你此刻的心情..." required></textarea>
        <button class="btn btn-primary" type="submit" style="margin-top:8px">发布</button>
      </form>

      <div style="font-weight:800;margin:14px 0 6px">全站统计</div>
      <div id="stats" class="small">加载中...</div>
    </aside>
  </main>
</div>

<div id="toast" class="toast"></div>

<script>
// 已为你填入完整的Supabase信息
const SUPABASE_URL = "https://ithowxqignlhkwaykglt.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0aG93eHFpZ25saGt3YXlrZ2x0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNzE1MTEsImV4cCI6MjA5Mjc0NzUxMX0.fNmh0HjNuIZaJTa56gMITwKpJMQfJ8mBN41HMhvyDDA";

// 初始化后端连接
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 全局状态
const state = {
  username: localStorage.getItem('username') || '',
  visitorId: localStorage.getItem('visitorId') || crypto.randomUUID(),
  posts: []
};
localStorage.setItem('visitorId', state.visitorId);

// DOM元素
const feed = document.getElementById('feed');
const stats = document.getElementById('stats');
const loginBtn = document.getElementById('loginBtn');
const toastEl = document.getElementById('toast');

// 工具函数
const fmt = (t) => new Date(t).toLocaleString('zh-CN', { hour12: false });
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1800);
}

// 统计数据
function renderStats() {
  const views = state.posts.reduce((n, p) => n + (p.view_count || 0), 0);
  const likes = state.posts.reduce((n, p) => n + (p.like_count || 0), 0);
  const comments = state.posts.reduce((n, p) => n + (p.comments?.length || 0), 0);
  stats.innerHTML = `总浏览：${views} 次<br>总点赞：${likes} 次<br>总评论：${comments} 条`;
}

// 渲染卡片
function card(p) {
  const comments = (p.comments || []).slice(-3).map(c =>
    `<div class='small'>${c.nickname}：${c.content}</div>`
  ).join('') || "<div class='small'>暂无评论</div>";
  return `
  <article class='post' data-id='${p.id}'>
    <div><strong>@${p.author}</strong></div>
    <div class='meta'>${fmt(p.created_at)}</div>
    <p>${p.content}</p>
    <div class='actions'>
      <button class='btn btn-ghost' data-a='view'>👁 浏览（${p.view_count || 0}）</button>
      <button class='btn btn-ghost' data-a='like'>👍 点赞（${p.like_count || 0}）</button>
      <button class='btn btn-ghost' data-a='comment'>💬 评论</button>
    </div>
    <div style='margin-top:8px'>${comments}</div>
  </article>`;
}

// 渲染页面
function render() {
  feed.innerHTML = state.posts.map(card).join('') || '<div class="small">还没有动态，发第一条试试 ✨</div>';
  renderStats();
}

// 加载动态
async function load() {
  const { data, error } = await supabase
    .from('posts')
    .select(`
      *,
      comments(*)
    `)
    .order('created_at', { ascending: false });

  if (error) {
    toast("加载失败：" + error.message);
    return;
  }
  state.posts = data;
  render();
}

// 登录功能
function login() {
  const username = prompt('输入昵称（发布动态需要登录）', state.username || '');
  if (!username) return;
  state.username = username;
  localStorage.setItem('username', state.username);
  loginBtn.textContent = `已登录：${state.username}`;
  toast('登录成功');
}

// 发布动态
async function publish(e) {
  e.preventDefault();
  if (!state.username) {
    toast('请先登录');
    return;
  }
  const content = e.target.content.value.trim();
  const { error } = await supabase.from('posts').insert([{
    author: state.username,
    content: content,
    view_count: 0,
    like_count: 0
  }]);

  if (error) {
    toast('发布失败：' + error.message);
    return;
  }
  e.target.reset();
  toast('发布成功');
  await load();
}

// 浏览计数
async function viewPost(id) {
  const post = state.posts.find(p => p.id === id);
  if (!post) return;
  await supabase.from('posts').update({
    view_count: (post.view_count || 0) + 1
  }).eq('id', id);
  await load();
}

// 点赞功能
async function likePost(id) {
  const post = state.posts.find(p => p.id === id);
  if (!post) return;
  await supabase.from('posts').update({
    like_count: (post.like_count || 0) + 1
  }).eq('id', id);
  await load();
  toast('点赞成功');
}

// 评论功能
async function commentPost(id) {
  const content = prompt('输入评论内容');
  if (!content) return;
  const nickname = prompt('昵称（可空）', state.username || '') || '游客';

  const { error } = await supabase.from('comments').insert([{
    post_id: id,
    nickname: nickname,
    content: content
  }]);

  if (error) {
    toast('评论失败：' + error.message);
    return;
  }
  await load();
  toast('评论成功');
}

// 实时刷新
function realtime() {
  setInterval(load, 5000);
}

// 事件绑定
feed.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-a]');
  if (!btn) return;
  const el = btn.closest('.post');
  if (!el) return;
  const id = el.dataset.id;
  if (btn.dataset.a === 'view') await viewPost(id);
  if (btn.dataset.a === 'like') await likePost(id);
  if (btn.dataset.a === 'comment') await commentPost(id);
});

document.getElementById('publishForm').addEventListener('submit', publish);
loginBtn.addEventListener('click', login);

// 初始化
(async () => {
  if (state.username) loginBtn.textContent = `已登录：${state.username}`;
  await load();
  realtime();
  toast("页面加载完成 ✅");
})();
</script>
</body>
</html>
