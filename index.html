<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xtj - 高透液态版</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      /* 1. 优化液态玻璃变量 - 减少磨砂，增强透明液体感 */
      --bg-color: #f0f5ff;
      --glass-bg: rgba(255, 255, 255, 0.4); /* 提高透明度，减少磨砂感 */
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.12);
      --glass-blur: blur(12px); /* 降低模糊度，增强通透感 */
      
      --primary: #7c5cff;
      --primary-hover: #6a4deb;
      --admin-color: #ff9f0a;
      --like-color: #ff3b60;
      
      --text-main: #1d1d24;
      --text-muted: #6b6c7a;
      
      --radius-sm: 16px;
      --radius-md: 24px;
      --radius-lg: 32px;
      
      --trans-smooth: all 0.4s cubic-bezier(0.25, 1, 0.3, 1);
      --trans-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      /* 新增：物理回弹曲线 */
      --trans-spring: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      color: var(--text-main);
      background-color: var(--bg-color);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 2. 强化液态背景效果 - 更明显的液体流动感 */
    .liquid-bg {
      position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg-color);
    }
    .liquid-blob {
      position: absolute; border-radius: 50%; filter: blur(60px); /* 降低模糊，增强液体轮廓 */
      opacity: 0.7; /* 提高不透明度，增强液体存在感 */
      animation: floatBlob 15s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
    }
    .blob-1 { 
      top: -10%; left: -10%; width: 50vw; height: 50vw; 
      background: rgba(124, 92, 255, 0.5); /* 提高浓度 */
      /* 新增：径向渐变增强液体质感 */
      background: radial-gradient(circle, rgba(124, 92, 255, 0.6) 0%, rgba(124, 92, 255, 0.3) 100%);
    }
    .blob-2 { 
      bottom: -20%; right: -10%; width: 60vw; height: 60vw; 
      background: rgba(60, 180, 255, 0.4); /* 提高浓度 */
      background: radial-gradient(circle, rgba(60, 180, 255, 0.7) 0%, rgba(60, 180, 255, 0.2) 100%);
      animation-delay: -4s; 
    }
    .blob-3 { 
      top: 40%; left: 40%; width: 40vw; height: 40vw; 
      background: rgba(78, 210, 174, 0.3); /* 提高浓度 */
      background: radial-gradient(circle, rgba(78, 210, 174, 0.5) 0%, rgba(78, 210, 174, 0.1) 100%);
      animation-delay: -8s; 
    }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(8%, 12%) scale(1.15); /* 增强位移和缩放 */ }
      100% { transform: translate(-8%, -8%) scale(0.9); }
    }

    /* 玻璃形态基类 - 优化透明液体感 */
    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      /* 新增：轻微的渐变增强液体玻璃质感 */
      background: linear-gradient(135deg, 
        rgba(255, 255, 255, 0.45) 0%, 
        rgba(255, 255, 255, 0.35) 100%);
      /* 新增：液体边缘光效 */
      box-shadow: 
        0 8px 32px rgba(31, 38, 135, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    /* 导航栏 */
    nav {
      position: sticky; top: 0; z-index: 50; padding: 12px 24px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.4); /* 增强边框 */
      background: rgba(255, 255, 255, 0.25); /* 提高透明度 */
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }

    h1 { margin: 0; font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #7c5cff, #3cb4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .nav-auth { display: flex; align-items: center; gap: 8px; }
    .nav-input {
      background: rgba(255,255,255,0.6); /* 提高透明度 */
      border: 1px solid rgba(255,255,255,0.7);
      padding: 6px 14px; border-radius: 99px; outline: none; width: 120px; font-size: 13px; transition: var(--trans-smooth);
    }
    .nav-input:focus { background: rgba(255,255,255,0.9); border-color: var(--primary); }
    
    .btn {
      cursor: pointer; border: none; font-weight: 600; padding: 6px 16px; border-radius: 99px;
      font-size: 13px; transition: var(--trans-bounce); display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary), #5eb4ff); color: white; box-shadow: 0 4px 12px rgba(124, 92, 255, 0.2); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(124, 92, 255, 0.3); }
    .btn-primary:active { transform: translateY(1px); }

    .user-pill {
      display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px;
      background: rgba(255,255,255,0.7); /* 提高透明度 */
      border: 1px solid rgba(255,255,255,0.9); border-radius: 99px; font-size: 13px; font-weight: 600;
    }

    /* 容器布局 */
    .wrap { max-width: 640px; margin: 24px auto 80px; padding: 0 16px; display: flex; flex-direction: column; gap: 24px; }

    /* 发布框 */
    .publish-box { padding: 20px; border-radius: var(--radius-md); transition: var(--trans-smooth); }
    .publish-box:hover { 
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.35) 100%);
      transform: translateY(-2px); /* 新增：hover回弹效果 */
    }
    .publish-box textarea {
      width: 100%; min-height: 80px; border: none; background: transparent; resize: none; font-size: 16px; color: var(--text-main); outline: none;
    }
    .publish-box textarea::placeholder { color: rgba(0,0,0,0.3); }
    .publish-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.05); }

    input[type="file"] { font-size: 12px; color: var(--text-muted); }
    input[type="file"]::file-selector-button {
      background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.7); padding: 4px 12px; border-radius: 99px; cursor: pointer; transition: 0.3s;
    }
    input[type="file"]::file-selector-button:hover {
      background: rgba(255,255,255,0.8);
      transform: translateY(-1px); /* 新增：回弹效果 */
    }

    /* 统计 */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat-card { padding: 16px; border-radius: var(--radius-sm); text-align: center; transition: var(--trans-spring); }
    .stat-card:hover {
      transform: translateY(-4px) scale(1.02); /* 新增：hover回弹放大 */
      box-shadow: 0 8px 24px rgba(124, 92, 255, 0.15);
    }
    .stat-card b { display: block; font-size: 22px; color: var(--primary); font-weight: 800; }
    .stat-card span { font-size: 12px; color: var(--text-muted); font-weight: 500; }

    /* 动态流 */
    .feed { display: flex; flex-direction: column; gap: 20px; }
    /* 3. 新增：帖子滚动动画基础样式 */
    .post { 
      padding: 24px; border-radius: var(--radius-md); 
      /* 初始状态：不可见 */
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      transition: 
        opacity 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
        transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.4s ease;
    }
    /* 可见状态：淡入弹入 */
    .post.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    /* 离开视口：淡出弹出 */
    .post.hidden {
      opacity: 0;
      transform: translateY(-30px) scale(0.95);
    }
    .post:hover { 
      box-shadow: 0 12px 40px rgba(31, 38, 135, 0.12); 
      border-color: rgba(255,255,255,0.8);
      transform: translateY(-2px); /* 新增：hover回弹 */
    }

    .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #7c5cff, #3cb4ff); color: white; font-weight: bold; font-size: 16px; transition: var(--trans-spring); }
    .avatar.admin { background: linear-gradient(135deg, #ff9f0a, #ff3b60); box-shadow: 0 4px 12px rgba(255, 159, 10, 0.3); }
    .avatar:hover {
      transform: scale(1.1); /* 新增：头像回弹 */
      box-shadow: 0 4px 16px rgba(124, 92, 255, 0.2);
    }
    
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    .admin-tag { font-size: 10px; background: var(--admin-color); color: white; padding: 2px 6px; border-radius: 4px; }
    .post-time { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .content { font-size: 15px; line-height: 1.6; margin-bottom: 16px; white-space: pre-wrap; word-break: break-word; }
    .media { width: 100%; border-radius: 16px; overflow: hidden; margin-bottom: 16px; background: rgba(0,0,0,0.02); transition: var(--trans-smooth); }
    .media:hover {
      transform: scale(1.02); /* 新增：媒体内容回弹 */
    }
    .media img, .media video { width: 100%; max-height: 400px; object-fit: contain; display: block; }

    .post-stats-text { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

    /* 动作按钮 */
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .action-btn { 
      background: rgba(255,255,255,0.5); 
      border: 1px solid rgba(255,255,255,0.7); 
      padding: 6px 16px; border-radius: 99px; font-size: 13px; color: var(--text-muted); cursor: pointer; 
      transition: var(--trans-spring); /* 改用物理回弹曲线 */
      font-weight: 600;
      position: relative; /* 为点赞粒子做准备 */
      overflow: hidden;
    }
    .action-btn:hover { 
      background: rgba(255,255,255,0.9); 
      color: var(--text-main);
      transform: translateY(-2px); /* 新增：按钮回弹 */
    }
    
    /* 1. 增强点赞动效 - 更细腻的回弹+粒子特效 */
    @keyframes heartBeat { 
      0% { transform: scale(1); } 
      20% { transform: scale(1.2); } /* 更强的缩放 */
      40% { transform: scale(0.95); } 
      60% { transform: scale(1.1); } 
      80% { transform: scale(0.98); } 
      100% { transform: scale(1); } 
    }
    .action-btn.liked { 
      background: rgba(255, 59, 96, 0.15); 
      color: var(--like-color); 
      border-color: rgba(255, 59, 96, 0.3); 
      animation: heartBeat 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 物理回弹曲线 */
    }
    /* 新增：点赞粒子特效 */
    .action-btn.liked::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 59, 96, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: likeRipple 0.8s ease-out forwards;
    }
    @keyframes likeRipple {
      0% { width: 0; height: 0; opacity: 1; }
      100% { width: 100px; height: 100px; opacity: 0; }
    }
    
    /* 删除按钮 */
    .action-btn.del { background: transparent; border-color: transparent; color: rgba(255, 59, 96, 0.6); margin-left: auto; }
    .action-btn.del:hover { background: rgba(255, 59, 96, 0.1); color: var(--like-color); }

    /* 评论区 */
    .comments { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.05); display: grid; gap: 8px; }
    .comment-item { 
      padding: 10px 14px; background: rgba(255,255,255,0.5); 
      border-radius: 12px; font-size: 13px; line-height: 1.5; 
      border: 1px solid rgba(255,255,255,0.6);
      transition: var(--trans-smooth);
    }
    .comment-item:hover {
      transform: translateX(4px); /* 新增：评论项回弹 */
      background: rgba(255,255,255,0.7);
    }
    .comment-item b { font-weight: 700; margin-right: 6px; }

    /* 拟物弹窗 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(255,255,255,0.2); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: 0.3s;
    }
    .modal-overlay.active { display: flex; opacity: 1; }
    .modal-box {
      width: 90%; max-width: 400px; padding: 24px; border-radius: var(--radius-lg);
      transform: scale(0.9) translateY(10px); transition: var(--trans-spring); /* 改用物理回弹 */
    }
    .modal-overlay.active .modal-box { transform: scale(1) translateY(0); }
    .modal-box h3 { margin: 0 0 16px 0; font-size: 18px; }
    .modal-textarea { width: 100%; min-height: 100px; background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.9); border-radius: 16px; padding: 12px; font-size: 14px; outline: none; resize: none; margin-bottom: 16px; transition: var(--trans-smooth); }
    .modal-textarea:focus {
      background: rgba(255,255,255,0.9);
      transform: translateY(-2px); /* 新增：输入框回弹 */
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .loading { text-align: center; padding: 40px; color: var(--text-muted); font-weight: 500; }
  </style>
</head>
<body>

  <div class="liquid-bg">
    <div class="liquid-blob blob-1"></div>
    <div class="liquid-blob blob-2"></div>
    <div class="liquid-blob blob-3"></div>
  </div>

  <nav>
    <h1>xtj</h1>
    <div class="nav-auth">
      <div id="unauthUI" style="display: flex; gap: 8px;">
        <input id="nickInp" class="nav-input" placeholder="输入昵称登录" />
        <button class="btn btn-primary" onclick="doLogin()">登录</button>
      </div>
      <div id="authUI" style="display: none;">
        <div class="user-pill">
          <span class="avatar" id="myAvatar" style="width:24px; height:24px; font-size:12px;">?</span>
          <span id="myName"></span>
          <button onclick="doLogout()" style="background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:16px;">&times;</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="wrap">
    <div class="publish-box glass">
      <textarea id="postInp" placeholder="分享一点新鲜事..."></textarea>
      <div class="publish-footer">
        <input type="file" id="fileInp" accept="image/*,video/*" />
        <button class="btn btn-primary" id="pubBtn" onclick="doPublish()">发布动态</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card glass"><b id="sPosts">0</b><span>总动态</span></div>
      <div class="stat-card glass"><b id="sViews">0</b><span>总浏览</span></div>
      <div class="stat-card glass"><b id="sLikes">0</b><span>总点赞</span></div>
    </div>

    <div id="feed" class="feed">
      <div class="loading">内容加载中...</div>
    </div>
  </div>

  <div class="modal-overlay" id="commentModal">
    <div class="modal-box glass">
      <h3>发表评论</h3>
      <textarea id="commInp" class="modal-textarea" placeholder="写下你的想法..."></textarea>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button class="btn" style="background: rgba(255,255,255,0.5);" onclick="closeModal('commentModal')">取消</button>
        <button class="btn btn-primary" id="commBtn">发布评论</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="delModal">
    <div class="modal-box glass" style="text-align: center;">
      <div style="font-size: 40px; margin-bottom: 12px;">🗑️</div>
      <h3>确认删除？</h3>
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">删除后内容及相关互动将永远消失。</p>
      <div style="display: flex; gap: 10px;">
        <button class="btn" style="background: rgba(255,255,255,0.5); flex: 1;" onclick="closeModal('delModal')">取消</button>
        <button class="btn btn-primary" style="background: #ff3b60; box-shadow: 0 4px 12px rgba(255,59,96,0.3); flex: 1;" id="delBtn">确认删除</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. Supabase 配置 (绝不修改) ---
    const SUPABASE_URL = "https://ithowxqignlhkwaykglt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0aG93eHFpZ25saGt3YXlrZ2x0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNzE1MTEsImV4cCI6MjA5Mjc0NzUxMX0.fNmh0HjNuIZaJTa56gMITwKpJMQfJ8mBN41HMhvyDDA";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- 2. 管理员配置与状态管理 ---
    const ADMIN_NAME = "xxz";
    const ADMIN_PW = "xxz123";

    let currentUser = localStorage.getItem("xtj_user") || "";
    const deviceId = localStorage.getItem("xtj_device_id") || crypto.randomUUID();
    localStorage.setItem("xtj_device_id", deviceId);
    
    function isAdmin() { return currentUser === ADMIN_NAME; }
    
    // --- 3. 基础交互函数 ---
    function doLogin() {
      const name = document.getElementById("nickInp").value.trim();
      if (!name) return;
      if (name === ADMIN_NAME) {
        if (prompt("检测到管理员账号，请输入密钥：") !== ADMIN_PW) return alert("密钥错误");
      } else if (name.toLowerCase() === ADMIN_NAME) {
        return alert("该昵称受保护");
      }
      currentUser = name;
      localStorage.setItem("xtj_user", currentUser);
      initUI();
      loadFeed();
    }

    function doLogout() {
      currentUser = "";
      localStorage.removeItem("xtj_user");
      initUI();
      loadFeed();
    }

    function initUI() {
      if (currentUser) {
        document.getElementById("unauthUI").style.display = "none";
        document.getElementById("authUI").style.display = "flex";
        document.getElementById("myName").textContent = currentUser;
        const avatar = document.getElementById("myAvatar");
        avatar.textContent = currentUser[0].toUpperCase();
        avatar.className = isAdmin() ? "avatar admin" : "avatar";
      } else {
        document.getElementById("unauthUI").style.display = "flex";
        document.getElementById("authUI").style.display = "none";
      }
    }

    // --- 4. 核心功能：发布 ---
    async function doPublish() {
      if (!currentUser) return alert("请先登录");
      const content = document.getElementById("postInp").value.trim();
      const file = document.getElementById("fileInp").files[0];
      if (!content && !file) return alert("请输入内容或上传文件");

      const btn = document.getElementById("pubBtn");
      btn.disabled = true; btn.textContent = "发布中...";

      try {
        let media_url = "", media_type = "";
        if (file) {
          const path = `${Date.now()}_${file.name.replace(/[^\w.\-]/g, "_")}`;
          const { error } = await sb.storage.from("uploads").upload(path, file);
          if (error) throw error;
          media_url = sb.storage.from("uploads").getPublicUrl(path).data.publicUrl;
          media_type = file.type.startsWith("image") ? "image" : "video";
        }
        await sb.from("posts").insert([{ user_name: currentUser, content, media_url, media_type, actor_key: deviceId }]);
        document.getElementById("postInp").value = "";
        document.getElementById("fileInp").value = "";
        loadFeed();
      } catch (e) {
        alert("发布失败：" + e.message);
      } finally {
        btn.disabled = false; btn.textContent = "发布动态";
      }
    }

    // --- 5. 核心功能：点赞 ---
    async function toggleLike(btn, postId) {
      if (!currentUser) return alert("请先登录");
      const isLiked = btn.classList.contains("liked");
      
      // 乐观UI动画
      btn.classList.remove("liked");
      void btn.offsetWidth; // 触发重绘以重复播放动画
      if (!isLiked) btn.classList.add("liked");
      btn.textContent = isLiked ? "点赞" : "已点赞";

      try {
        if (isLiked) {
          await sb.from("likes").delete().match({ post_id: postId, actor_key: deviceId });
        } else {
          await sb.from("likes").insert([{ post_id: postId, user_name: currentUser, actor_key: deviceId }]);
        }
        loadFeed(true); // 静默刷新数据
      } catch (e) { console.error(e); }
    }

    // --- 6. 核心功能：评论 ---
    let activePostId = null;
    function openComment(postId) {
      if (!currentUser) return alert("请先登录");
      activePostId = postId;
      document.getElementById("commInp").value = "";
      document.getElementById("commentModal").classList.add("active");
    }
    
    document.getElementById("commBtn").onclick = async () => {
      const content = document.getElementById("commInp").value.trim();
      if (!content || !activePostId) return;
      document.getElementById("commBtn").textContent = "提交中...";
      await sb.from("comments").insert([{ post_id: activePostId, user_name: currentUser, content, actor_key: deviceId }]);
      document.getElementById("commBtn").textContent = "发布评论";
      closeModal("commentModal");
      loadFeed(true);
    };

    // --- 7. 核心功能：删帖 (完美修复版) ---
    let delPostId = null;
    let delOwnerKey = null; // 记录原作者key，用于管理员绕过RLS

    function openDelete(postId, ownerKey) {
      delPostId = postId;
      delOwnerKey = ownerKey;
      document.getElementById("delModal").classList.add("active");
    }

    document.getElementById("delBtn").onclick = async () => {
      if (!delPostId) return;
      document.getElementById("delBtn").textContent = "删除中...";
      
      try {
        // 黑科技：如果我是管理员，我直接用原作者的 actor_key 去请求 RPC！完美绕过限制。
        const keyToUse = isAdmin() ? delOwnerKey : deviceId;
        const { error: rpcError } = await sb.rpc("delete_post_with_actor", { p_post_id: delPostId, p_actor_key: keyToUse });
        
        // 如果 RPC 报错（可能用户没建这个RPC），对于管理员，我们 fallback 到强力 delete
        if (rpcError && isAdmin()) {
            await sb.from("posts").delete().eq("id", delPostId);
        } else if (rpcError) {
            throw rpcError;
        }
        
        closeModal("delModal");
        loadFeed();
      } catch (e) {
        alert("删除失败: 请确认权限或数据库配置");
      } finally {
        document.getElementById("delBtn").textContent = "确认删除";
      }
    };

    function closeModal(id) { document.getElementById(id).classList.remove("active"); }

    // --- 8. 浏览量追踪 ---
    function trackView(postId) {
      const key = `xtj_v_${postId}`;
      if (!localStorage.getItem(key)) {
        localStorage.setItem(key, "1");
        sb.rpc("increment_post_views", { p_post_id: postId });
      }
    }

    // --- 9. 数据渲染 ---
    async function loadFeed(silent = false) {
      const [postRes, commRes, likeRes] = await Promise.all([
        sb.from("posts").select("*").order("created_at", { ascending: false }),
        sb.from("comments").select("*").order("created_at", { ascending: true }),
        sb.from("likes").select("*")
      ]);

      const posts = postRes.data || [];
      const comments = commRes.data || [];
      const likes = likeRes.data || [];

      // 更新顶部统计
      document.getElementById("sPosts").textContent = posts.length;
      document.getElementById("sViews").textContent = posts.reduce((sum, p) => sum + (p.views || 0), 0);
      document.getElementById("sLikes").textContent = likes.length;

      const feed = document.getElementById("feed");
      if (!posts.length) { feed.innerHTML = `<div class="loading">还没人说话，来抢沙发吧~</div>`; return; }

      feed.innerHTML = posts.map((p, i) => {
        const pLikes = likes.filter(l => l.post_id === p.id);
        const pComms = comments.filter(c => c.post_id === p.id);
        const isLikedByMe = pLikes.some(l => l.actor_key === deviceId);
        
        // 权限判定：本人或管理员均可删除
        const canDelete = (p.actor_key === deviceId) || isAdmin();
        const isPostAdmin = (p.user_name === ADMIN_NAME);

        trackView(p.id);

        return `
          <div class="post glass" data-post-id="${p.id}">
            <div class="post-header">
              <div class="avatar ${isPostAdmin ? 'admin' : ''}">${p.user_name[0].toUpperCase()}</div>
              <div class="user-info">
                <span class="user-name">${p.user_name} ${isPostAdmin ? '<span class="admin-tag">STAFF</span>' : ''}</span>
                <span class="post-time">${new Date(p.created_at).toLocaleString()}</span>
              </div>
            </div>
            
            <div class="content">${p.content.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
            
            ${p.media_url ? `
              <div class="media">
                ${p.media_type === 'video' ? `<video src="${p.media_url}" controls></video>` : `<img src="${p.media_url}" loading="lazy" />`}
              </div>
            ` : ''}
            
            <div class="post-stats-text">
              浏览 ${p.views || 0} · 点赞 ${pLikes.length} · 评论 ${pComms.length}
            </div>
            
            <div class="actions">
              <button class="action-btn ${isLikedByMe ? 'liked' : ''}" onclick="toggleLike(this, '${p.id}')">
                ${isLikedByMe ? '已点赞' : '点赞'}
              </button>
              <button class="action-btn" onclick="openComment('${p.id}')">评论</button>
              ${canDelete ? `<button class="action-btn del" onclick="openDelete('${p.id}', '${p.actor_key}')">删除</button>` : ''}
            </div>

            ${pComms.length > 0 ? `
              <div class="comments">
                ${pComms.map(c => `<div class="comment-item"><b>${c.user_name}:</b>${c.content.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>`).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join("");

      // 初始化帖子滚动动画监听
      initPostScrollAnimation();
    }

    // --- 10. 新增：帖子滚动动画逻辑 ---
    let observer = null;
    function initPostScrollAnimation() {
      // 销毁旧的观察者
      if (observer) {
        observer.disconnect();
      }

      // 创建Intersection Observer
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const post = entry.target;
          if (entry.isIntersecting) {
            // 进入视口：淡入弹入
            post.classList.remove('hidden');
            post.classList.add('visible');
          } else {
            // 离开视口：淡出弹出
            post.classList.add('hidden');
            post.classList.remove('visible');
          }
        });
      }, {
        root: null, // 视口作为根
        rootMargin: '0px',
        threshold: 0.1 // 元素10%可见时触发
      });

      // 监听所有帖子元素
      document.querySelectorAll('.post').forEach(post => {
        observer.observe(post);
      });
    }

    // --- 11. 初始化与实时刷新 ---
    initUI();
    loadFeed();
    
    // 监听实时变动，保持多端同步
    sb.channel('public-updates')
      .on('postgres_changes', { event: '*', schema: 'public' }, () => loadFeed(true))
      .subscribe();
      
  </script>
</body>
</html>
