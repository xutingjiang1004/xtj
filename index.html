<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>xtj</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg: rgba(255,255,255,.10);
      --bg2: rgba(255,255,255,.16);
      --line: rgba(255,255,255,.15);
      --text: #f4f4fa;
      --muted: rgba(255,255,255,.70);
      --shadow: 0 20px 50px rgba(0,0,0,.25);
      --radius: 24px;
      --accent: #8b7cf0;
      --accent2: #5cc8ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color:var(--text);
      min-height:100vh;
      background:
        radial-gradient(circle at 0% 0%, rgba(130,180,255,.35), transparent 35%),
        radial-gradient(circle at 100% 0%, rgba(180,130,255,.30), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(100,210,170,.25), transparent 30%),
        linear-gradient(135deg, #0b1020 0%, #121a2f 50%, #0a0f1f 100%);
      padding:24px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .wrap{
      max-width:1200px;
      width:100%;
      display:grid;
      grid-template-columns: 340px 1fr;
      gap:20px;
      align-items:start;
    }
    .card{
      background:var(--bg);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius:var(--radius);
      transition: border-color .3s ease, box-shadow .3s ease;
    }
    .card:hover{
      border-color: rgba(255,255,255,.22);
      box-shadow: 0 24px 60px rgba(0,0,0,.30);
    }
    .panel{padding:18px 20px}
    h1,h2,h3,p{margin:0}
    h1{font-size:26px; font-weight:700; letter-spacing: -0.3px; margin-bottom:4px}
    .sub{color:var(--muted); font-size:13px; line-height:1.6}

    /* 顶部紧凑登录区域 */
    .auth-mini{
      display: flex;
      flex-direction: column;
      gap:8px;
      margin-top:4px;
      margin-bottom:14px;
    }
    .auth-mini input{
      padding:10px 12px;
      font-size:14px;
      border-radius:14px;
    }
    .auth-row{
      display: flex;
      gap:8px;
      align-items: center;
    }
    .auth-row button{
      flex:1;
      font-size:14px;
      padding:10px 0;
      margin:0;
      white-space: nowrap;
    }

    .user-card{
      display: flex;
      align-items: center;
      gap:10px;
      background: rgba(255,255,255,.06);
      border-radius:18px;
      padding:10px 12px;
      margin-bottom:12px;
    }
    .avatar-box{
      position: relative;
      width:40px;
      height:40px;
      border-radius:50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight:600;
      color:#fff;
      overflow:hidden;
      flex-shrink:0;
      box-shadow: 0 6px 18px rgba(0,0,0,.25);
    }
    .avatar-box img{
      width:100%;
      height:100%;
      object-fit: cover;
    }
    .avatar-placeholder{
      position: absolute;
      inset:0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size:18px;
      font-weight:700;
      color:#fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
    }
    .user-meta{
      flex:1;
      min-width:0;
    }
    .user-meta .name{
      font-weight:700;
      font-size:15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-meta .status{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
    }
    .logout-link{
      color:var(--muted);
      font-size:12px;
      cursor:pointer;
      text-decoration: underline;
      margin-left:auto;
    }

    .block{margin-top:12px}
    input, textarea, button, select{
      width:100%;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      color:var(--text);
      outline:none;
      padding:11px 14px;
      font-size:14px;
      transition: .18s ease;
    }
    input:focus, textarea:focus{
      border-color: rgba(255,255,255,.35);
      background: rgba(255,255,255,.12);
      box-shadow: 0 0 0 3px rgba(120,120,255,.08);
    }
    textarea{min-height:100px; resize:vertical}
    input::placeholder, textarea::placeholder{color:rgba(255,255,255,.45)}
    button{
      cursor:pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border:none;
      font-weight:700;
      letter-spacing: 0.2px;
      transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease;
      margin-top:8px;
      position: relative;
      overflow: hidden;
    }
    button:active{ transform: scale(0.97); }
    button:hover{ transform: translateY(-1px); opacity:.95; box-shadow: 0 12px 24px rgba(100,100,255,.18); }
    button.secondary{
      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.14);
      font-weight:600;
      color:var(--text);
    }
    button.secondary:hover{ background: rgba(255,255,255,.14); }

    .stats{
      display:grid;
      grid-template-columns: repeat(3,1fr);
      gap:8px;
      margin-top:14px;
    }
    .stat{
      padding:12px 8px;
      border-radius:16px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      text-align: center;
    }
    .stat b{display:block; font-size:20px; margin-bottom:2px}
    .stat span{font-size:11px; color:var(--muted)}

    .feed{ display:grid; gap:16px; }
    .post{
      padding:18px;
      border-radius:22px;
      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease, border-color .3s ease;
      will-change: transform;
    }
    .post:hover{
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(0,0,0,.25);
      border-color: rgba(255,255,255,.20);
    }
    .meta{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      color:var(--muted);
      font-size:13px;
      margin-bottom:10px;
    }
    .user{
      font-weight:700;
      color:var(--text);
      font-size:15px;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .avatar{
      width:30px;
      height:30px;
      border-radius:50%;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:13px;
      font-weight:700;
      color:#fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      overflow:hidden;
      border:1px solid rgba(255,255,255,.15);
    }
    .avatar img{ width:100%; height:100%; object-fit:cover; }
    .content{white-space:pre-wrap; line-height:1.7; margin-bottom:10px; word-break: break-word;}
    .media{
      width:100%;
      border-radius:18px;
      overflow:hidden;
      margin:10px 0 12px;
      border:1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.20);
    }
    .media img, .media video{
      display:block;
      width:100%;
      max-height:420px;
      object-fit:contain;
    }
    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:8px;
    }
    .actions button{
      width:auto;
      margin-top:0;
      padding:8px 14px;
      border-radius:999px;
      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.14);
      font-weight:600;
      font-size:13px;
    }
    .actions button:disabled{ opacity:0.5; cursor:default; transform:none; }
    .comments{
      margin-top:12px;
      padding-top:10px;
      border-top:1px solid rgba(255,255,255,.08);
      display:grid;
      gap:6px;
    }
    .comment{
      padding:10px 12px;
      border-radius:14px;
      background: rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.07);
      font-size:13px;
      line-height:1.6;
      display: flex;
      gap:8px;
      align-items: flex-start;
    }
    .comment .avatar{
      width:24px;
      height:24px;
      font-size:11px;
      flex-shrink:0;
    }
    .comment-body{ flex:1; min-width:0; }
    .comment b{font-weight:700}
    .small{font-size:12px; color:var(--muted)}
    .toprow{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      margin-bottom:10px;
    }
    .tag{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:6px 12px;
      border-radius:999px;
      background: rgba(255,255,255,.07);
      color:var(--muted);
      font-size:11px;
      border:1px solid rgba(255,255,255,.08);
    }
    .empty{
      padding:28px;
      text-align:center;
      color:var(--muted);
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(5,10,24,.60);
      backdrop-filter: blur(6px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:50;
      padding:16px;
    }
    .modal.show{display:flex}
    .modal-card{
      width:min(560px,100%);
      border-radius:20px;
      border:1px solid rgba(255,255,255,.15);
      background:rgba(18,24,44,.90);
      box-shadow:0 18px 56px rgba(0,0,0,.40);
      padding:20px;
      backdrop-filter: blur(18px);
    }
    .modal-actions{
      margin-top:14px;
      display:flex;
      gap:10px;
      justify-content:flex-end;
    }
    .modal-actions button{width:auto;margin-top:0}

    /* 点赞回弹动画 */
    .like-pop{
      animation: likeBounce 0.35s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes likeBounce{
      0%{ transform: scale(1); }
      30%{ transform: scale(1.25); }
      60%{ transform: scale(0.95); }
      100%{ transform: scale(1); }
    }
    @keyframes fadeUp{
      from{ opacity:0; transform:translateY(8px); }
      to{ opacity:1; transform:translateY(0); }
    }
    .post{ animation: fadeUp .3s ease both; }

    /* 文件上传按钮样式 */
    .file-label{
      display: inline-block;
      padding:8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.14);
      color:var(--text);
      font-size:13px;
      cursor:pointer;
      transition: .18s ease;
      margin-top:6px;
    }
    .file-label:hover{ background: rgba(255,255,255,.14); }
    input[type=file]{ display: none; }

    @media (max-width: 980px){
      .wrap{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 左侧：个人信息 + 发布 -->
    <div class="card panel">
      <h1>xtj</h1>
      <p class="sub">轻量社区·先让核心跑起来</p>

      <!-- 登录/注册区域 -->
      <div id="authArea" class="auth-mini">
        <input id="nickname" placeholder="昵称 (2-20字符)" />
        <input id="password" type="password" placeholder="密码 (6位以上)" />
        <div class="auth-row">
          <button id="loginBtn">登录</button>
          <button id="registerBtn" class="secondary">注册</button>
        </div>
      </div>

      <!-- 已登录状态卡片 -->
      <div id="userCard" class="user-card" style="display:none;">
        <div class="avatar-box">
          <img id="userAvatarImg" src="" alt="avatar" style="display:none;" />
          <div id="userAvatarPlaceholder" class="avatar-placeholder">?</div>
        </div>
        <div class="user-meta">
          <div class="name" id="userNameDisplay"></div>
          <div class="status" id="userStatus"></div>
        </div>
        <span class="logout-link" id="logoutLink">退出</span>
      </div>

      <!-- 头像上传 -->
      <div id="avatarUploadArea" style="margin-bottom:12px; display:none;">
        <label for="avatarFileInput" class="file-label">📷 上传头像</label>
        <input type="file" id="avatarFileInput" accept="image/*" />
      </div>

      <!-- 发布动态 -->
      <div class="block card panel" style="padding:14px;">
        <div class="small" style="margin-bottom:6px;">发布动态</div>
        <textarea id="postText" placeholder="写点什么..."></textarea>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <label for="fileInput" class="file-label">📎 图片/视频</label>
          <input id="fileInput" type="file" accept="image/*,video/*" />
          <span id="fileNameDisplay" class="small" style="margin-left:4px;"></span>
        </div>
        <button id="postBtn">发布</button>
      </div>

      <div class="stats">
        <div class="stat"><b id="sPosts">0</b><span>动态</span></div>
        <div class="stat"><b id="sViews">0</b><span>浏览</span></div>
        <div class="stat"><b id="sLikes">0</b><span>点赞</span></div>
      </div>

      <div class="block small" id="status" style="line-height:1.7;">准备就绪。</div>
    </div>

    <!-- 右侧：动态流 -->
    <div class="card panel">
      <div class="toprow">
        <div>
          <h2 style="font-size:20px;">动态流</h2>
          <div class="small">内容实时更新</div>
        </div>
        <button id="refreshBtn" class="secondary" style="width:auto;padding:8px 14px;">刷新</button>
      </div>
      <div id="feed" class="feed">
        <div class="empty">加载中...</div>
      </div>
    </div>
  </div>

  <!-- 评论模态框 -->
  <div class="modal" id="commentModal">
    <div class="modal-card">
      <h3 style="margin-bottom:8px;">发表评论</h3>
      <textarea id="commentText" placeholder="写下你的想法..." style="min-height:120px;"></textarea>
      <div class="modal-actions">
        <button class="secondary" id="commentCancelBtn" type="button">取消</button>
        <button id="commentSubmitBtn" type="button">发布评论</button>
      </div>
    </div>
  </div>

  <!-- 删除确认模态框 -->
  <div class="modal" id="deleteModal">
    <div class="modal-card">
      <h3 style="margin-bottom:8px;">删除确认</h3>
      <p class="small">删除后不可恢复，确认继续吗？</p>
      <div class="modal-actions">
        <button class="secondary" id="deleteCancelBtn" type="button">取消</button>
        <button id="deleteConfirmBtn" type="button">确认删除</button>
      </div>
    </div>
  </div>

  <script>
    // ---------- 配置 ----------
    const SUPABASE_URL = "https://ithowxqignlhkwaykglt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0aG93eHFpZ25saGt3YXlrZ2x0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNzE1MTEsImV4cCI6MjA5Mjc0NzUxMX0.fNmh0HjNuIZaJTa56gMITwKpJMQfJ8mBN41HMhvyDDA";

    // ---------- 初始化 Supabase 客户端 ----------
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false }
    });

    // ---------- 全局状态 ----------
    let currentUser = "";               // 当前登录用户名
    let sessionToken = null;           // JWT token
    let avatarUrl = "";                // 当前用户头像 URL
    let postsCache = [];
    let commentsCache = [];
    let likesCache = [];
    let avatarMap = {};                // username -> avatar URL 缓存
    let pendingCommentPostId = null;
    let pendingDeletePostId = null;
    const deviceId = localStorage.getItem("xtj_device_id") || crypto.randomUUID();
    localStorage.setItem("xtj_device_id", deviceId);

    // 浏览去重 key
    const viewedKey = (id) => `xtj_viewed_${id}`;

    // ---------- DOM 工具 ----------
    const el = (id) => document.getElementById(id);
    const status = (msg) => { el("status").textContent = msg; };

    // ---------- 安全工具 ----------
    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function sanitizeInput(str) {
      return str.replace(/[<>"']/g, "");
    }

    // 防抖
    function debounce(fn, delay = 300) {
      let timer;
      return function(...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
      };
    }

    // ---------- 认证与登录 ----------
    function requireLogin(actionName = "操作") {
      if (sessionToken && currentUser) return true;
      alert(`请先登录后再${actionName}`);
      el("nickname").focus();
      return false;
    }

    function showAuthUI() {
      el("authArea").style.display = "flex";
      el("userCard").style.display = "none";
      el("avatarUploadArea").style.display = "none";
    }

    function showUserUI() {
      el("authArea").style.display = "none";
      el("userCard").style.display = "flex";
      el("avatarUploadArea").style.display = "flex";
      el("userNameDisplay").textContent = `@${currentUser}`;
      el("userStatus").textContent = "已登录";
      updateAvatarDisplay();
    }

    function updateAvatarDisplay() {
      const img = el("userAvatarImg");
      const placeholder = el("userAvatarPlaceholder");
      if (avatarUrl) {
        img.src = avatarUrl;
        img.style.display = "block";
        placeholder.style.display = "none";
      } else {
        img.style.display = "none";
        placeholder.style.display = "flex";
        placeholder.textContent = (currentUser || "?").slice(0,1).toUpperCase();
      }
    }

    async function restoreSession() {
      const savedToken = localStorage.getItem("xtj_token");
      const savedUser = localStorage.getItem("xtj_user");
      if (savedToken && savedUser) {
        try {
          const { error } = await client.auth.setSession({ access_token: savedToken, refresh_token: "" });
          if (error) throw error;
          sessionToken = savedToken;
          currentUser = savedUser;
          avatarUrl = localStorage.getItem("xtj_avatar") || "";
          showUserUI();
          status(`已恢复登录：@${currentUser}`);
          return true;
        } catch (e) {
          console.warn("会话恢复失败，请重新登录", e);
          clearSession();
        }
      }
      showAuthUI();
      return false;
    }

    function clearSession() {
      sessionToken = null;
      currentUser = "";
      avatarUrl = "";
      localStorage.removeItem("xtj_token");
      localStorage.removeItem("xtj_user");
      localStorage.removeItem("xtj_avatar");
      client.auth.signOut().catch(() => {});
      showAuthUI();
      el("nickname").value = "";
      el("password").value = "";
    }

    async function login() {
      const nickname = el("nickname").value.trim();
      const password = el("password").value;
      if (!nickname || !password) return alert("请输入昵称和密码");
      if (nickname.length < 2 || nickname.length > 20) return alert("昵称长度 2-20 字符");
      if (password.length < 6) return alert("密码至少6位");

      status("登录中...");
      try {
        const { data, error } = await client.rpc("login_user", {
          p_nickname: nickname,
          p_password: password
        });
        if (error) throw error;
        if (!data || !data.token) throw new Error("登录失败，服务器返回异常");

        // 设置 session
        const { error: authError } = await client.auth.setSession({
          access_token: data.token,
          refresh_token: ""
        });
        if (authError) throw authError;

        sessionToken = data.token;
        currentUser = data.user_name || nickname;
        avatarUrl = data.avatar_url || "";
        localStorage.setItem("xtj_token", sessionToken);
        localStorage.setItem("xtj_user", currentUser);
        localStorage.setItem("xtj_avatar", avatarUrl);

        showUserUI();
        status(`已登录：@${currentUser}`);
        await loadAll();
      } catch (err) {
        console.error(err);
        alert("登录失败：" + (err.message || "未知错误"));
        status("登录失败");
        clearSession();
      }
    }

    async function register() {
      const nickname = el("nickname").value.trim();
      const password = el("password").value;
      if (!nickname || !password) return alert("请输入昵称和密码");
      if (nickname.length < 2 || nickname.length > 20) return alert("昵称长度 2-20 字符");
      if (password.length < 6) return alert("密码至少6位");

      status("注册中...");
      try {
        const { data, error } = await client.rpc("register_user", {
          p_nickname: nickname,
          p_password: password
        });
        if (error) throw error;
        if (!data || !data.token) throw new Error("注册失败，服务器返回异常");

        const { error: authError } = await client.auth.setSession({
          access_token: data.token,
          refresh_token: ""
        });
        if (authError) throw authError;

        sessionToken = data.token;
        currentUser = data.user_name || nickname;
        avatarUrl = data.avatar_url || "";
        localStorage.setItem("xtj_token", sessionToken);
        localStorage.setItem("xtj_user", currentUser);
        localStorage.setItem("xtj_avatar", avatarUrl);

        showUserUI();
        status(`注册成功，已登录：@${currentUser}`);
        await loadAll();
      } catch (err) {
        console.error(err);
        alert("注册失败：" + (err.message || "未知错误"));
        status("注册失败");
      }
    }

    async function logout() {
      clearSession();
      status("已退出登录");
      await loadAll(); // 刷新公开内容
    }

    // ---------- 头像上传 ----------
    async function uploadAvatar(file) {
      if (!requireLogin("上传头像")) return;
      if (!file) return;
      // 文件类型校验
      const allowedTypes = ["image/jpeg", "image/png", "image/webp", "image/gif"];
      if (!allowedTypes.includes(file.type)) return alert("头像仅支持 JPEG/PNG/WebP/GIF");
      if (file.size > 2 * 1024 * 1024) return alert("头像大小不能超过 2MB");

      const safeName = `avatar_${currentUser}_${Date.now()}.${file.name.split(".").pop()}`;
      status("上传头像中...");
      try {
        const { error: uploadError } = await client.storage.from("avatars").upload(safeName, file, {
          cacheControl: "3600",
          upsert: true
        });
        if (uploadError) throw uploadError;
        const { data: urlData } = client.storage.from("avatars").getPublicUrl(safeName);
        const newAvatarUrl = urlData.publicUrl;

        // 更新用户头像
        const { error: updateError } = await client.rpc("update_user_avatar", {
          p_avatar_url: newAvatarUrl
        });
        if (updateError) throw updateError;

        avatarUrl = newAvatarUrl;
        localStorage.setItem("xtj_avatar", avatarUrl);
        updateAvatarDisplay();
        status("头像更新成功");
        await loadAll(); // 刷新内容中的头像显示
      } catch (err) {
        console.error(err);
        alert("头像上传失败：" + (err.message || "未知错误"));
        status("头像上传失败");
      }
    }

    // ---------- 媒体上传（发布用） ----------
    async function uploadMedia(file) {
      const maxImageSize = 5 * 1024 * 1024;
      const maxVideoSize = 20 * 1024 * 1024;
      const imageTypes = ["image/jpeg", "image/png", "image/webp", "image/gif"];
      const videoTypes = ["video/mp4", "video/webm"];

      if (imageTypes.includes(file.type) && file.size > maxImageSize) throw new Error("图片不能超过5MB");
      if (videoTypes.includes(file.type) && file.size > maxVideoSize) throw new Error("视频不能超过20MB");
      if (!imageTypes.includes(file.type) && !videoTypes.includes(file.type)) throw new Error("不支持的文件类型");

      const ext = file.name.split(".").pop();
      const safeName = `${Date.now()}_${deviceId}.${ext}`;
      const { data, error } = await client.storage.from("uploads").upload(safeName, file, {
        cacheControl: "3600",
        upsert: false
      });
      if (error) throw error;
      const { data: urlData } = client.storage.from("uploads").getPublicUrl(data.path);
      return urlData.publicUrl;
    }

    // ---------- 发布动态 ----------
    const publishPost = debounce(async function() {
      if (!requireLogin("发布")) return;
      const content = el("postText").value.trim();
      const file = el("fileInput").files[0];
      if (!content && !file) return alert("至少写点文字或上传文件");

      status("发布中...");
      let media_url = "";
      let media_type = "";

      try {
        if (file) {
          media_url = await uploadMedia(file);
          media_type = file.type.startsWith("image/") ? "image" : "video";
        }

        const { error } = await client.from("posts").insert([{
          user_name: currentUser,
          actor_key: deviceId,
          content,
          media_url,
          media_type
        }]);
        if (error) throw error;

        el("postText").value = "";
        el("fileInput").value = "";
        el("fileNameDisplay").textContent = "";
        status("发布成功");
        await loadAll();
      } catch (err) {
        console.error(err);
        alert("发布失败：" + (err.message || "未知错误"));
        status("发布失败");
      }
    }, 500);

    // ---------- 点赞 ----------
    async function likePost(postId, event) {
      if (!requireLogin("点赞")) return;
      // 动画触发
      const btn = event?.currentTarget;
      if (btn) {
        btn.classList.add("like-pop");
        setTimeout(() => btn.classList.remove("like-pop"), 400);
      }

      try {
        const { error } = await client.from("likes").insert([{
          post_id: postId,
          user_name: currentUser,
          actor_key: deviceId
        }]);
        if (error) {
          if (error.code === "23505" || String(error.message || "").toLowerCase().includes("duplicate")) {
            status("你已经点过赞了");
            return;
          }
          throw error;
        }
        status("点赞成功");
        await loadAll();
      } catch (err) {
        console.error(err);
        alert("点赞失败，请确认权限设定");
      }
    }

    // ---------- 评论 ----------
    function commentPost(postId) {
      if (!requireLogin("评论")) return;
      pendingCommentPostId = postId;
      el("commentText").value = "";
      el("commentModal").classList.add("show");
      el("commentText").focus();
    }

    async function submitCommentModal() {
      const text = el("commentText").value.trim();
      if (!text || !pendingCommentPostId) return;
      try {
        const { error } = await client.from("comments").insert([{
          post_id: pendingCommentPostId,
          user_name: currentUser,
          content: text,
          actor_key: deviceId
        }]);
        if (error) throw error;
        closeCommentModal();
        status("评论成功");
        await loadAll();
      } catch (err) {
        console.error(err);
        alert("评论失败：" + (err.message || "未知错误"));
      }
    }

    // ---------- 删除与私密 ----------
    async function deletePost(postId) {
      if (!requireLogin("删除")) return;
      pendingDeletePostId = postId;
      el("deleteModal").classList.add("show");
    }

    async function submitDeleteModal() {
      if (!pendingDeletePostId) return;
      try {
        const { data, error } = await client.rpc("delete_post_with_actor", {
          p_post_id: pendingDeletePostId
        });
        if (error) throw error;
        if (!data) {
          alert("你没有权限删除此动态");
        } else {
          status("删除成功");
        }
        closeDeleteModal();
        await loadAll();
      } catch (err) {
        console.error(err);
        alert("删除失败：" + (err.message || "未知错误"));
      }
    }

    async function togglePrivacy(postId) {
      if (!requireLogin("修改权限")) return;
      try {
        const { error } = await client.rpc("toggle_post_privacy", {
          p_post_id: postId
        });
        if (error) throw error;
        status("私密状态已更新");
        await loadAll();
      } catch (err) {
        console.error(err);
        alert("操作失败：" + (err.message || "未知错误"));
      }
    }

    // ---------- 模态框控制 ----------
    function closeCommentModal() {
      pendingCommentPostId = null;
      el("commentModal").classList.remove("show");
    }
    function closeDeleteModal() {
      pendingDeletePostId = null;
      el("deleteModal").classList.remove("show");
    }

    // ---------- 头像辅助 ----------
    function getUserAvatar(name) {
      const url = avatarMap[name];
      if (url) {
        return `<img src="${escapeHtml(url)}" alt="avatar" />`;
      }
      return escapeHtml((name || "?").slice(0, 1).toUpperCase());
    }

    // ---------- 浏览统计 ----------
    async function trackView(postId) {
      if (localStorage.getItem(viewedKey(postId)) === "1") return;
      localStorage.setItem(viewedKey(postId), "1");
      const { error } = await client.rpc("increment_post_views", { p_post_id: postId });
      if (error) console.error("view error:", error);
    }

    // ---------- 数据分组 ----------
    function groupByPost(rows) {
      const map = {};
      for (const row of rows) {
        if (!map[row.post_id]) map[row.post_id] = [];
        map[row.post_id].push(row);
      }
      return map;
    }

    // ---------- 渲染动态流 ----------
    function renderFeed() {
      const feed = el("feed");
      if (!postsCache.length) {
        feed.innerHTML = `<div class="empty">还没有动态，先发一条。</div>`;
        return;
      }

      const commentMap = groupByPost(commentsCache);
      const likeMap = groupByPost(likesCache);

      feed.innerHTML = postsCache.map((p) => {
        const comments = commentMap[p.id] || [];
        const likes = likeMap[p.id] || [];
        const likedByMe = likes.some((l) => l.user_name === currentUser);
        const isAuthor = (p.user_name === currentUser);
        const canDelete = isAuthor;
        const privacyLabel = p.is_private ? " 🔒 私密" : "";

        const media = p.media_url ? (
          p.media_type === "image"
            ? `<div class="media"><img src="${escapeHtml(p.media_url)}" alt="media" loading="lazy" /></div>`
            : `<div class="media"><video src="${escapeHtml(p.media_url)}" controls preload="metadata"></video></div>`
        ) : "";

        const commentsHtml = comments.length
          ? comments.map(c => {
              const cAvatar = getUserAvatar(c.user_name);
              return `<div class="comment">
                <div class="avatar">${cAvatar}</div>
                <div class="comment-body"><b>${escapeHtml(c.user_name)}</b>：${escapeHtml(c.content)}</div>
              </div>`;
            }).join("")
          : `<div class="small">暂无评论</div>`;

        queueMicrotask(() => trackView(p.id));

        return `
          <article class="post">
            <div class="meta">
              <div class="user">
                <div class="avatar">${getUserAvatar(p.user_name)}</div>
                ${escapeHtml(p.user_name)}${privacyLabel}
              </div>
              <div>${new Date(p.created_at).toLocaleString()}</div>
            </div>
            <div class="content">${escapeHtml(p.content)}</div>
            ${media}
            <div class="small">浏览 ${p.views || 0} · 点赞 ${likes.length} · 评论 ${comments.length}</div>
            <div class="actions">
              <button ${likedByMe ? "disabled" : ""} onclick="likePost('${p.id}', event)" title="${likedByMe ? '已点赞' : '点赞'}">
                ${likedByMe ? "❤️ 已点赞" : "🤍 点赞"}
              </button>
              <button onclick="commentPost('${p.id}')">💬 评论</button>
              ${canDelete ? `<button onclick="deletePost('${p.id}')">🗑 删除</button>` : ""}
              ${isAuthor ? `<button onclick="togglePrivacy('${p.id}')">${p.is_private ? '🔓 设为公开' : '🔒 设为私密'}</button>` : ""}
            </div>
            <div class="comments">${commentsHtml}</div>
          </article>
        `;
      }).join("");
    }

    // ---------- 加载所有数据 ----------
    async function loadAll() {
      try {
        status("加载中...");
        const [postRes, commentRes, likeRes] = await Promise.all([
          client.from("posts").select("*").order("created_at", { ascending: false }),
          client.from("comments").select("*").order("created_at", { ascending: true }),
          client.from("likes").select("*")
        ]);

        if (postRes.error) throw postRes.error;
        if (commentRes.error) throw commentRes.error;
        if (likeRes.error) throw likeRes.error;

        postsCache = postRes.data || [];
        commentsCache = commentRes.data || [];
        likesCache = likeRes.data || [];

        el("sPosts").textContent = postsCache.length;
        el("sViews").textContent = postsCache.reduce((sum, p) => sum + (p.views || 0), 0);
        el("sLikes").textContent = likesCache.length;

        // 批量获取用户头像
        const usernames = new Set();
        postsCache.forEach(p => usernames.add(p.user_name));
        commentsCache.forEach(c => usernames.add(c.user_name));
        if (currentUser) usernames.add(currentUser);
        if (usernames.size > 0) {
          const { data: usersData } = await client.from("users")
            .select("user_name, avatar_url")
            .in("user_name", Array.from(usernames));
          if (usersData) {
            avatarMap = {};
            usersData.forEach(u => { avatarMap[u.user_name] = u.avatar_url; });
          }
        }

        renderFeed();
        status(`已加载 ${postsCache.length} 条动态`);
      } catch (err) {
        console.error(err);
        el("feed").innerHTML = `<div class="empty">加载失败：${escapeHtml(err.message || "未知错误")}</div>`;
        status("加载失败");
      }
    }

    // ---------- 实时订阅 ----------
    function setupRealtime() {
      client.channel("xtj-feed")
        .on("postgres_changes", { event: "*", schema: "public", table: "posts" }, loadAll)
        .on("postgres_changes", { event: "*", schema: "public", table: "comments" }, loadAll)
        .on("postgres_changes", { event: "*", schema: "public", table: "likes" }, loadAll)
        .subscribe();
    }

    // ---------- 事件绑定 ----------
    window.login = login;
    window.register = register;
    window.logout = logout;
    window.likePost = likePost;
    window.commentPost = commentPost;
    window.deletePost = deletePost;
    window.togglePrivacy = togglePrivacy;
    window.submitCommentModal = submitCommentModal;
    window.submitDeleteModal = submitDeleteModal;
    window.closeCommentModal = closeCommentModal;
    window.closeDeleteModal = closeDeleteModal;

    el("loginBtn").addEventListener("click", login);
    el("registerBtn").addEventListener("click", register);
    el("logoutLink").addEventListener("click", logout);
    el("postBtn").addEventListener("click", publishPost);
    el("refreshBtn").addEventListener("click", loadAll);
    el("commentCancelBtn").addEventListener("click", closeCommentModal);
    el("commentSubmitBtn").addEventListener("click", submitCommentModal);
    el("deleteCancelBtn").addEventListener("click", closeDeleteModal);
    el("deleteConfirmBtn").addEventListener("click", submitDeleteModal);
    el("commentModal").addEventListener("click", (e) => { if (e.target.id === "commentModal") closeCommentModal(); });
    el("deleteModal").addEventListener("click", (e) => { if (e.target.id === "deleteModal") closeDeleteModal(); });
    window.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      closeCommentModal();
      closeDeleteModal();
    });

    // 文件选择显示文件名
    el("fileInput").addEventListener("change", () => {
      const file = el("fileInput").files[0];
      el("fileNameDisplay").textContent = file ? file.name : "";
    });

    // 头像上传
    el("avatarFileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) uploadAvatar(file);
    });

    // 启动时恢复会话
    restoreSession().then(() => {
      loadAll();
      setupRealtime();
    });
  </script>
</body>
</html>
