<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>XTJ社区</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #0f172a;
  overflow-x: hidden;
}

/* 🌊 液态背景 */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: -1;
}

.blob {
  position: absolute;
  width: 400px;
  height: 400px;
  background: #4f46e5;
  filter: blur(80px);
  opacity: 0.7;
  mix-blend-mode: screen;
  animation: move 20s infinite linear, morph 12s infinite ease-in-out;
}

@keyframes move {
  0% { transform: translate(0,0); }
  50% { transform: translate(200px,300px); }
  100% { transform: translate(0,0); }
}

@keyframes morph {
  0% { border-radius: 50%; }
  25% { border-radius: 40% 60% 55% 45% / 60% 40% 60% 40%; }
  50% { border-radius: 60% 40% 40% 60% / 45% 55% 45% 55%; }
  75% { border-radius: 50% 50% 60% 40% / 50% 60% 40% 50%; }
  100% { border-radius: 50%; }
}

/* 💎 玻璃卡片 */
.glass {
  margin: 20px;
  padding: 15px;
  border-radius: 16px;

  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.55),
    rgba(255,255,255,0.2)
  );

  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);

  border: 1px solid rgba(255,255,255,0.6);

  box-shadow:
    0 8px 32px rgba(0,0,0,0.1),
    inset 0 1px 0 rgba(255,255,255,0.7);

  color: #000;
}

/* 按钮 */
button {
  padding: 6px 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.delete {
  background: red;
  color: white;
}
</style>
</head>

<body>

<div class="bg">
  <div class="blob" style="top:10%;left:20%;"></div>
  <div class="blob" style="top:50%;left:60%;background:#22c55e;"></div>
</div>

<div id="feed"></div>

<script>
const SUPABASE_URL = "你的URL";
const SUPABASE_KEY = "你的KEY";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 👇 设备ID
let deviceId = localStorage.getItem("device_id");
if (!deviceId) {
  deviceId = Date.now().toString();
  localStorage.setItem("device_id", deviceId);
}

// 👇 假管理员判断
function isAdmin() {
  return true; // 你自己改
}

// 🚀 加载评论
async function loadFeed() {
  const { data, error } = await sb.from("comments").select("*");

  if (error) {
    console.error(error);
    return;
  }

  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "glass";
    div.id = "comment-" + item.id;

    div.innerHTML = `
      <p>${item.content}</p>
      <button class="delete" onclick="deleteComment('${item.id}')">删除</button>
    `;

    feed.appendChild(div);
  });
}

// 🧨 删除评论（修复版）
async function deleteComment(id) {
  let q = sb
    .from("comments")
    .delete()
    .eq("id", id)
    .select(); // 👈 关键

  if (!isAdmin()) {
    q = q.eq("actor_key", deviceId);
  }

  const { data, error } = await q;

  if (error) {
    alert("删除失败");
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    alert("删除失败：没权限或不存在");
    return;
  }

  // ✅ 只删DOM，不刷新
  const el = document.getElementById("comment-" + id);
  if (el) el.remove();
}

// 初始化
loadFeed();
</script>

</body>
</html>
