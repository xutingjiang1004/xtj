<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xtj</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg: rgba(255,255,255,.12);
      --bg2: rgba(255,255,255,.18);
      --line: rgba(255,255,255,.18);
      --text: #f7f7fb;
      --muted: rgba(255,255,255,.72);
      --shadow: 0 20px 60px rgba(0,0,0,.22);
      --radius: 24px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color:var(--text);
      min-height:100vh;
      background:
        radial-gradient(circle at top left, rgba(117,196,255,.45), transparent 30%),
        radial-gradient(circle at top right, rgba(191,125,255,.35), transparent 28%),
        radial-gradient(circle at bottom center, rgba(78,210,174,.25), transparent 28%),
        linear-gradient(135deg, #0b1020, #141a33 45%, #0a0f1f);
      padding:24px;
    }
    .wrap{
      max-width:1200px;
      margin:0 auto;
      display:grid;
      grid-template-columns: 360px 1fr;
      gap:20px;
      align-items:start;
    }
    .card{
      background:var(--bg);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius:var(--radius);
    }
    .panel{padding:20px}
    h1,h2,h3,p{margin:0}
    h1{font-size:28px; margin-bottom:6px}
    .sub{color:var(--muted); font-size:14px; line-height:1.6}
    .loginbar{
      margin-top:12px;
      padding:10px 12px;
      border-radius:14px;
      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:13px;
      color:var(--muted);
    }
    .block{margin-top:18px}
    input, textarea, button, select{
      width:100%;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      color:var(--text);
      outline:none;
      padding:12px 14px;
      font-size:15px;
    }
    textarea{min-height:110px; resize:vertical}
    input::placeholder, textarea::placeholder{color:rgba(255,255,255,.5)}
    button{
      cursor:pointer;
      background: linear-gradient(135deg, rgba(124,92,255,.95), rgba(60,180,255,.92));
      border:none;
      font-weight:700;
      transition:.18s transform ease, .18s opacity ease;
      margin-top:10px;
    }
    button:hover{transform: translateY(-1px); opacity:.95}
    button.secondary{
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.16);
      font-weight:600;
    }
    .stats{
      display:grid;
      grid-template-columns: repeat(3,1fr);
      gap:10px;
      margin-top:14px;
    }
    .stat{
      padding:14px;
      border-radius:18px;
      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
    }
    .stat b{display:block; font-size:22px; margin-bottom:4px}
    .stat span{font-size:12px; color:var(--muted)}
    .feed{
      display:grid;
      gap:16px;
    }
    .post{
      padding:18px;
      border-radius:22px;
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
    }
    .meta{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      color:var(--muted);
      font-size:13px;
      margin-bottom:12px;
    }
    .user{
      font-weight:700;
      color:var(--text);
      font-size:15px;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .avatar{
      width:26px;
      height:26px;
      border-radius:50%;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      color:#fff;
      background: linear-gradient(135deg, #7c5cff, #3cb4ff);
      border:1px solid rgba(255,255,255,.2);
    }
    .content{white-space:pre-wrap; line-height:1.7; margin-bottom:12px}
    .media{
      width:100%;
      border-radius:18px;
      overflow:hidden;
      margin:10px 0 12px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
    }
    .media img, .media video{
      display:block;
      width:100%;
      max-height:420px;
      object-fit:contain;
    }
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .actions button{
      width:auto;
      margin-top:0;
      padding:10px 14px;
      border-radius:999px;
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.16);
      font-weight:600;
    }
    .comments{
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid rgba(255,255,255,.10);
      display:grid;
      gap:8px;
    }
    .comment{
      padding:10px 12px;
      border-radius:14px;
      background: rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.08);
      font-size:14px;
      line-height:1.6;
    }
    .comment b{font-weight:700}
    .small{font-size:12px; color:var(--muted)}
    .toprow{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      margin-bottom:10px;
    }
    .tag{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:8px 12px;
      border-radius:999px;
      background: rgba(255,255,255,.08);
      color:var(--muted);
      font-size:12px;
      border:1px solid rgba(255,255,255,.10);
    }
    .empty{
      padding:26px;
      text-align:center;
      color:var(--muted);
    }
    .modal{
      position:fixed;
      inset:0;
      background:rgba(5,10,24,.52);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:50;
      padding:16px;
    }
    .modal.show{display:flex}
    .modal-card{
      width:min(560px,100%);
      border-radius:18px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(22,28,52,.92);
      box-shadow:0 18px 56px rgba(0,0,0,.35);
      padding:16px;
    }
    .modal-actions{
      margin-top:12px;
      display:flex;
      gap:10px;
      justify-content:flex-end;
    }
    .modal-actions button{width:auto;margin-top:0}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .post{transition:transform .2s ease, box-shadow .2s ease;}
    .post:hover{transform:translateY(-2px); box-shadow:0 12px 30px rgba(0,0,0,.18);}
    @media (max-width: 980px){
      .wrap{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card panel">
      <h1>xtj</h1>
      <p class="sub">昵称登录、发动态、传图传视频、点赞、评论、浏览统计。先把能跑的做出来，别一上来就拿“未来感”糊墙。</p>
      <div class="loginbar">
        <span>登录状态</span>
        <b id="loginState">未登录</b>
      </div>

      <div class="block card panel" style="padding:16px;">
        <div class="toprow">
          <div>
            <div class="small">当前身份</div>
            <div id="whoami" style="font-weight:700;margin-top:4px;">未登录</div>
          </div>
          <span class="tag">昵称登录</span>
        </div>
        <input id="nickname" placeholder="输入昵称" />
        <button id="loginBtn">登录 / 切换昵称</button>
        <button id="logoutBtn" class="secondary">退出</button>
      </div>

      <div class="block card panel" style="padding:16px;">
        <div class="small">发布动态</div>
        <textarea id="postText" placeholder="写点什么..."></textarea>
        <input id="fileInput" type="file" accept="image/*,video/*" />
        <button id="postBtn">发布</button>
      </div>

      <div class="stats">
        <div class="stat"><b id="sPosts">0</b><span>总动态</span></div>
        <div class="stat"><b id="sViews">0</b><span>总浏览</span></div>
        <div class="stat"><b id="sLikes">0</b><span>总点赞</span></div>
      </div>

      <div class="block small" id="status" style="line-height:1.7;">准备就绪。</div>
    </div>

    <div class="card panel">
      <div class="toprow">
        <div>
          <h2 style="font-size:22px;">动态流</h2>
          <div class="small">右边这栏就是内容，不是装饰品。</div>
        </div>
        <button id="refreshBtn" class="secondary" style="width:auto;padding:10px 14px;">刷新</button>
      </div>
      <div id="feed" class="feed">
        <div class="empty">加载中...</div>
      </div>
    </div>
  </div>

  <div class="modal" id="commentModal">
    <div class="modal-card">
      <h3 style="margin-bottom:8px;">发表评论</h3>
      <textarea id="commentText" placeholder="写下你的想法..." style="min-height:120px;"></textarea>
      <div class="modal-actions">
        <button class="secondary" id="commentCancelBtn" type="button">取消</button>
        <button id="commentSubmitBtn" type="button">发布评论</button>
      </div>
    </div>
  </div>

  <div class="modal" id="deleteModal">
    <div class="modal-card">
      <h3 style="margin-bottom:8px;">删除确认</h3>
      <p class="small">删除后不可恢复，确认继续吗？</p>
      <div class="modal-actions">
        <button class="secondary" id="deleteCancelBtn" type="button">取消</button>
        <button id="deleteConfirmBtn" type="button">确认删除</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ithowxqignlhkwaykglt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0aG93eHFpZ25saGt3YXlrZ2x0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNzE1MTEsImV4cCI6MjA5Mjc0NzUxMX0.fNmh0HjNuIZaJTa56gMITwKpJMQfJ8mBN41HMhvyDDA";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false }
    });

    let currentUser = localStorage.getItem("xtj_user") || "";
    const deviceId = localStorage.getItem("xtj_device_id") || crypto.randomUUID();
    localStorage.setItem("xtj_device_id", deviceId);

    let postsCache = [];
    let commentsCache = [];
    let likesCache = [];
    let pendingCommentPostId = null;
    let pendingDeletePostId = null;
    const viewedKey = (id) => `xtj_viewed_${id}`;

    const el = (id) => document.getElementById(id);
    const status = (msg) => { el("status").textContent = msg; };

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function requireLogin(actionName = "操作") {
      if (currentUser) return true;
      alert(`请先登录后再${actionName}`);
      el("nickname").focus();
      return false;
    }

    function renderUser() {
      el("whoami").textContent = currentUser ? `@${currentUser}` : "未登录";
      el("nickname").value = currentUser;
      el("loginState").textContent = currentUser ? `@${currentUser}` : "未登录";
    }

    async function login() {
      const name = el("nickname").value.trim();
      if (!name) return alert("请输入昵称");
      if (name.length < 2 || name.length > 20) return alert("昵称长度需在 2~20 之间");
      currentUser = name;
      localStorage.setItem("xtj_user", currentUser);
      renderUser();
      status(`已登录：@${currentUser}`);
    }

    function logout() {
      currentUser = "";
      localStorage.removeItem("xtj_user");
      renderUser();
      status("已退出登录");
    }

    async function uploadMedia(file) {
      const safeName = `${Date.now()}_${deviceId}_${file.name.replace(/[^\w.\-]/g, "_")}`;
      const { data, error } = await client.storage.from("uploads").upload(safeName, file, {
        cacheControl: "3600",
        upsert: false
      });
      if (error) throw error;
      const { data: urlData } = client.storage.from("uploads").getPublicUrl(data.path);
      return urlData.publicUrl;
    }

    async function publishPost() {
      if (!requireLogin("发布")) return;
      const content = el("postText").value.trim();
      const file = el("fileInput").files[0];
      if (!content && !file) return alert("至少写点文字或上传一个文件");

      status("正在发布...");
      let media_url = "";
      let media_type = "";

      try {
        if (file) {
          media_url = await uploadMedia(file);
          media_type = file.type.startsWith("image/") ? "image" : "video";
        }

        const { error } = await client.from("posts").insert([{
          user_name: currentUser,
          actor_key: deviceId,
          content,
          media_url,
          media_type
        }]);
        if (error) throw error;

        el("postText").value = "";
        el("fileInput").value = "";
        status("发布成功");
        await loadAll();
      } catch (err) {
        console.error(err);
        status(`发布失败：${err.message || "未知错误"}`);
      }
    }

    async function likePost(postId) {
      if (!requireLogin("点赞")) return;
      try {
        const { error } = await client.from("likes").insert([{
          post_id: postId,
          user_name: currentUser,
          actor_key: deviceId
        }]);

        if (error) {
          if (error.code === "23505" || String(error.message || "").toLowerCase().includes("duplicate")) {
            status("你已经点过赞了");
            return;
          }
          throw error;
        }

        status("点赞成功");
        await loadAll();
      } catch (err) {
        console.error(err);
        alert("点赞失败，请确认数据库约束和 RLS");
      }
    }

    async function commentPost(postId) {
      if (!requireLogin("评论")) return;
      pendingCommentPostId = postId;
      el("commentText").value = "";
      el("commentModal").classList.add("show");
      el("commentText").focus();
    }

    async function submitCommentModal() {
      const text = el("commentText").value.trim();
      if (!text || !text.trim() || !pendingCommentPostId) return;

      try {
        const { error } = await client.from("comments").insert([{
          post_id: pendingCommentPostId,
          user_name: currentUser,
          content: text.trim(),
          actor_key: deviceId
        }]);
        if (error) throw error;
        closeCommentModal();
        status("评论成功");
        await loadAll();
      } catch (err) {
        console.error(err);
        alert("评论失败，请确认 comments 表权限");
      }
    }

    async function deletePost(postId) {
      if (!requireLogin("删除")) return;
      pendingDeletePostId = postId;
      el("deleteModal").classList.add("show");
    }

    async function submitDeleteModal() {
      if (!pendingDeletePostId) return;
      try {
        const { data, error } = await client.rpc("delete_post_with_actor", { p_post_id: pendingDeletePostId, p_actor_key: deviceId });
        if (error) throw error;
        if (!data) return alert("你不是发布者，不能删除这条动态");
        closeDeleteModal();
        status("删除成功");
        await loadAll();
      } catch (err) {
        console.error(err);
        alert("删除失败，请确认 delete_post_with_actor 函数已创建");
      }
    }

    function closeCommentModal() {
      pendingCommentPostId = null;
      el("commentModal").classList.remove("show");
    }

    function closeDeleteModal() {
      pendingDeletePostId = null;
      el("deleteModal").classList.remove("show");
    }

    function avatarOf(name) {
      return `<span class="avatar">${escapeHtml(String(name || "?").slice(0, 1).toUpperCase())}</span>`;
    }

    async function trackView(postId) {
      if (localStorage.getItem(viewedKey(postId)) === "1") return;
      localStorage.setItem(viewedKey(postId), "1");
      const { error } = await client.rpc("increment_post_views", { p_post_id: postId });
      if (error) console.error("view error:", error);
    }

    function groupByPost(rows) {
      const map = {};
      for (const row of rows) {
        if (!map[row.post_id]) map[row.post_id] = [];
        map[row.post_id].push(row);
      }
      return map;
    }

    function renderFeed() {
      const feed = el("feed");
      if (!postsCache.length) {
        feed.innerHTML = `<div class="empty">还没有动态，先发一条。</div>`;
        return;
      }

      const commentMap = groupByPost(commentsCache);
      const likeMap = groupByPost(likesCache);

      feed.innerHTML = postsCache.map((p) => {
        const comments = commentMap[p.id] || [];
        const likes = likeMap[p.id] || [];
        const likedByMe = likes.some((l) => l.actor_key === deviceId);
        const canDelete = p.actor_key === deviceId;

        const media = p.media_url ? (
          p.media_type === "image"
            ? `<div class="media"><img src="${escapeHtml(p.media_url)}" alt="media" /></div>`
            : `<div class="media"><video src="${escapeHtml(p.media_url)}" controls></video></div>`
        ) : "";

        const commentsHtml = comments.length
          ? comments.map(c => `<div class="comment"><b>${escapeHtml(c.user_name)}</b>：${escapeHtml(c.content)}</div>`).join("")
          : `<div class="small">暂无评论</div>`;

        queueMicrotask(() => trackView(p.id));

        return `
          <article class="post" style="animation:fadeUp .35s ease both;">
            <div class="meta">
              <div class="user">${avatarOf(p.user_name)}${escapeHtml(p.user_name)}</div>
              <div>${new Date(p.created_at).toLocaleString()}</div>
            </div>
            <div class="content">${escapeHtml(p.content)}</div>
            ${media}
            <div class="small">浏览 ${p.views || 0} · 点赞 ${likes.length} · 评论 ${comments.length}</div>
            <div class="actions">
              <button ${likedByMe ? "disabled" : ""} onclick="likePost('${p.id}')">${likedByMe ? "已点赞" : "点赞"}</button>
              <button onclick="commentPost('${p.id}')">评论</button>
              ${canDelete ? `<button onclick="deletePost('${p.id}')">删除</button>` : ""}
            </div>
            <div class="comments">${commentsHtml}</div>
          </article>
        `;
      }).join("");
    }

    async function loadAll() {
      try {
        status("加载中...");
        const [postRes, commentRes, likeRes] = await Promise.all([
          client.from("posts").select("*").order("created_at", { ascending: false }),
          client.from("comments").select("*").order("created_at", { ascending: true }),
          client.from("likes").select("*")
        ]);

        if (postRes.error) throw postRes.error;
        if (commentRes.error) throw commentRes.error;
        if (likeRes.error) throw likeRes.error;

        postsCache = postRes.data || [];
        commentsCache = commentRes.data || [];
        likesCache = likeRes.data || [];

        el("sPosts").textContent = postsCache.length;
        el("sViews").textContent = postsCache.reduce((sum, p) => sum + (p.views || 0), 0);
        el("sLikes").textContent = likesCache.length;

        renderFeed();
        status(`已加载 ${postsCache.length} 条动态`);
      } catch (err) {
        console.error(err);
        el("feed").innerHTML = `<div class="empty">加载失败：${escapeHtml(err.message || "未知错误")}</div>`;
        status("加载失败");
      }
    }

    function setupRealtime() {
      client.channel("xtj-feed")
        .on("postgres_changes", { event: "*", schema: "public", table: "posts" }, loadAll)
        .on("postgres_changes", { event: "*", schema: "public", table: "comments" }, loadAll)
        .on("postgres_changes", { event: "*", schema: "public", table: "likes" }, loadAll)
        .subscribe();
    }

    window.login = login;
    window.logout = logout;
    window.likePost = likePost;
    window.commentPost = commentPost;
    window.deletePost = deletePost;
    window.submitCommentModal = submitCommentModal;
    window.submitDeleteModal = submitDeleteModal;
    window.closeCommentModal = closeCommentModal;
    window.closeDeleteModal = closeDeleteModal;

    el("loginBtn").addEventListener("click", login);
    el("logoutBtn").addEventListener("click", logout);
    el("postBtn").addEventListener("click", publishPost);
    el("refreshBtn").addEventListener("click", loadAll);
    el("commentCancelBtn").addEventListener("click", closeCommentModal);
    el("commentSubmitBtn").addEventListener("click", submitCommentModal);
    el("deleteCancelBtn").addEventListener("click", closeDeleteModal);
    el("deleteConfirmBtn").addEventListener("click", submitDeleteModal);
    el("commentModal").addEventListener("click", (e) => { if (e.target.id === "commentModal") closeCommentModal(); });
    el("deleteModal").addEventListener("click", (e) => { if (e.target.id === "deleteModal") closeDeleteModal(); });
    window.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      closeCommentModal();
      closeDeleteModal();
    });

    renderUser();
    loadAll();
    setupRealtime();
  </script>
</body>
</html>
