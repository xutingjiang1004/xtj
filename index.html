<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>xtj</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        :root {
            --bg-color: #e8f5e9;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.58);
            --glass-shadow: 0 18px 50px rgba(5, 150, 105, 0.08);
            --glass-blur: blur(24px);
            --primary: #059669;
            --admin-color: #ff9f0a;
            --like-color: #ff3b60;
            --text-main: #1d1d24;
            --text-muted: #6b6c7a;
            --radius-sm: 16px;
            --radius-md: 24px;
            --radius-lg: 32px;
            --trans-smooth: all 0.4s cubic-bezier(0.25, 1, 0.3, 1);
            --trans-spring: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --trans-ppt: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        html { scroll-behavior: smooth; scroll-padding: 20px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            position: relative;
            isolation: isolate;
        }

        .rain-bg-container {
            position: fixed;
            inset: 0;
            z-index: -999;
            overflow: hidden;
            pointer-events: none;
            background: linear-gradient(135deg, #f5f5f7 0%, #e8e8ed 50%, #dddde3 100%);
        }

        #rainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
            pointer-events: none;
        }

        .rain-glass-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            background: rgba(255, 255, 255, 0.15);
            pointer-events: none;
        }

        .toast-container {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            width: auto;
            max-width: 90vw;
        }
        .toast {
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 28px;
            border-radius: 99px;
            font-size: 14px;
            font-weight: 500;
            animation: toastPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: auto;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            white-space: nowrap;
        }
        @keyframes toastPop {
            0% { transform: scale(0.5) translateY(-20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        @keyframes toastFade {
            0% { transform: scale(1) translateY(0); opacity: 1; }
            100% { transform: scale(0.8) translateY(-30px); opacity: 0; }
        }

        .glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.2) 100%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 34px rgba(5, 150, 105, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(18px) saturate(165%);
            -webkit-backdrop-filter: blur(18px) saturate(165%);
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            flex-wrap: wrap;
            gap: 8px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #059669, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-auth { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .nav-input {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 6px 14px;
            border-radius: 99px;
            outline: none;
            width: 100px;
            font-size: 13px;
            transition: var(--trans-smooth);
        }
        .nav-input:focus { background: rgba(255, 255, 255, 0.95); border-color: var(--primary); }
        .btn {
            cursor: pointer;
            border: none;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 99px;
            font-size: 13px;
            transition: var(--trans-spring);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #10b981);
            color: white;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(5, 150, 105, 0.35); }
        .btn-ghost {
            background: rgba(255,255,255,0.6);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.8);
        }
        .btn-ghost:hover { background: rgba(255,255,255,0.9); transform: translateY(-2px); }
        .user-pill {
            display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 99px; font-size: 13px; font-weight: 600;
        }

        .wrap {
            position: relative; z-index: 2; max-width: 640px; margin: 24px auto 80px; padding: 0 16px;
            display: flex; flex-direction: column; gap: 24px;
        }

        .publish-box {
            position: relative; z-index: 1; padding: 24px; border-radius: var(--radius-md);
            transition: var(--trans-smooth);
            background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.12) 100%);
            border: 1px solid rgba(255,255,255,0.4);
            backdrop-filter: blur(22px) saturate(175%);
            -webkit-backdrop-filter: blur(22px) saturate(175%);
            box-shadow: 0 10px 34px rgba(5, 150, 105, 0.06), inset 0 1px 0 rgba(255,255,255,0.6);
        }
        .publish-box::before {
            content: ''; position: absolute; inset: -1px; border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 50%, rgba(5,150,105,0.08) 100%);
            pointer-events: none; z-index: -1;
        }
        .publish-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 48px rgba(5, 150, 105, 0.1), inset 0 1px 0 rgba(255,255,255,0.7);
            border-color: rgba(255,255,255,0.55);
        }
        .publish-box:focus-within {
            border-color: rgba(5, 150, 105, 0.15);
            box-shadow: 0 12px 40px rgba(5, 150, 105, 0.08), 0 0 0 3px rgba(5, 150, 105, 0.06), inset 0 1px 0 rgba(255,255,255,0.7);
        }
        .publish-box textarea {
            width: 100%; min-height: 80px; border: none; background: transparent; resize: none;
            font-size: 16px; color: var(--text-main); outline: none;
            transition: var(--trans-smooth);
        }
        .publish-box textarea::placeholder { color: rgba(107, 108, 122, 0.6); }
        .publish-box textarea:focus::placeholder { color: rgba(107, 108, 122, 0.3); }
        .publish-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 14px; margin-top: 4px;
            border-top: 1px solid rgba(255,255,255,0.25);
            position: relative;
        }
        .publish-footer::after {
            content: ''; position: absolute; top: -1px; left: 0; right: 60%;
            height: 1px;
            background: linear-gradient(90deg, rgba(5,150,105,0.2), transparent);
            pointer-events: none;
        }
        .publish-footer input[type="file"] {
            font-size: 12px; color: var(--text-muted);
            background: rgba(255,255,255,0.2);
            padding: 4px 10px; border-radius: 99px;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            transition: var(--trans-smooth);
            max-width: 140px;
        }
        .publish-footer input[type="file"]:hover {
            background: rgba(255,255,255,0.35);
            border-color: rgba(255,255,255,0.3);
        }
        .publish-footer input[type="file"]::file-selector-button {
            background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.5);
            padding: 4px 12px; border-radius: 99px; cursor: pointer;
            transition: all 0.3s ease;
            font-size: 11px;
            margin-right: 6px;
        }
        .publish-footer input[type="file"]::file-selector-button:hover {
            background: rgba(255,255,255,0.85);
            transform: scale(1.04);
        }
        .publish-footer .btn-primary {
            padding: 8px 22px; font-size: 14px;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }

        .stats { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .stat-card { padding: 16px; border-radius: var(--radius-sm); text-align: center; transition: var(--trans-spring); }
        .stat-card:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 8px 24px rgba(5, 150, 105, 0.15); }
        .stat-card b { display: block; font-size: 22px; color: var(--primary); font-weight: 800; }
        .stat-card span { font-size: 12px; color: var(--text-muted); }

        .feed { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 20px; }
        .post {
            padding: 24px; border-radius: var(--radius-md);
            opacity: 0; transform: translateY(30px) scale(0.95);
            transition: opacity 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .post.visible { opacity: 1; transform: translateY(0) scale(1); }
        .post:hover { box-shadow: 0 12px 40px rgba(5, 150, 105, 0.12); transform: translateY(-2px); }

        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #059669, #34d399); color: white; font-weight: bold; font-size: 16px;
            transition: var(--trans-spring);
        }
        .avatar.admin { background: linear-gradient(135deg, #ff9f0a, #ff3b60); box-shadow: 0 4px 12px rgba(255, 159, 10, 0.3); }
        .avatar:hover { transform: scale(1.1); }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: 700; font-size: 15px; }
        .admin-tag { font-size: 10px; background: var(--admin-color); color: white; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }
        .post-time { font-size: 12px; color: var(--text-muted); }

        .content { font-size: 15px; line-height: 1.6; margin-bottom: 16px; white-space: pre-wrap; }
        .media { width: 100%; border-radius: 16px; overflow: hidden; margin-bottom: 16px; background: rgba(0,0,0,0.02); }
        .media img, .media video {
            width: 100%; max-height: 400px; object-fit: contain; display: block;
            cursor: pointer;
        }

        .post-stats-text { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

        .actions { display: flex; gap: 8px; flex-wrap: wrap; position: relative; }
        .action-btn {
            background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.8);
            padding: 6px 16px; border-radius: 99px; font-size: 13px; color: var(--text-muted);
            cursor: pointer; transition: var(--trans-spring); font-weight: 600;
            position: relative; overflow: visible !important;
            min-width: 86px; display: inline-flex; justify-content: center; align-items: center; box-sizing: border-box;
        }
        .action-btn:hover { background: rgba(255,255,255,1); transform: translateY(-2px); }

        @keyframes likePulse {
            0% { transform: scale(1); box-shadow: 0 0 0px rgba(255, 59, 96, 0.4); }
            25% { transform: scale(1.35); box-shadow: 0 0 18px 6px rgba(255, 59, 96, 0.3); }
            50% { transform: scale(0.85); box-shadow: 0 0 12px 4px rgba(255, 59, 96, 0.2); }
            75% { transform: scale(1.1); box-shadow: 0 0 16px 4px rgba(255, 59, 96, 0.2); }
            100% { transform: scale(1); box-shadow: 0 0 12px rgba(255, 59, 96, 0.15); }
        }
        .action-btn.liked {
            background: rgba(255, 59, 96, 0.15); color: var(--like-color);
            border-color: rgba(255, 59, 96, 0.3);
            animation: likePulse 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .heart-particle {
            position: fixed;
            font-size: 22px;
            pointer-events: none;
            animation: heartFly 1.2s ease-out forwards;
            z-index: 9999;
            text-shadow: 0 0 12px rgba(255, 59, 96, 0.6);
        }
        @keyframes heartFly {
            0%   { transform: translate(0,0) scale(0) rotate(0deg); opacity: 1; }
            25%  { transform: translate(var(--tx25), var(--ty25)) scale(1.6) rotate(-20deg); opacity: 1; }
            60%  { transform: translate(var(--tx60), var(--ty60)) scale(0.8) rotate(10deg); opacity: 0.7; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(30deg); opacity: 0; }
        }

        .action-btn.del { background: transparent; border-color: transparent; color: #ff3b60; margin-left: auto; }
        .action-btn.del:hover { background: rgba(255,59,96,0.1); }

        .comments { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.05); display: grid; gap: 8px; }
        .comment-item {
            padding: 10px 14px; background: rgba(255,255,255,0.4); border-radius: 12px;
            font-size: 13px; line-height: 1.5; border: 1px solid rgba(255,255,255,0.6);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%);
        }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.15);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 100;
            opacity: 0; pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.16,1,0.3,1), backdrop-filter 0.5s cubic-bezier(0.16,1,0.3,1);
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-box {
            width: 90%; max-width: 400px; padding: 24px; border-radius: var(--radius-lg);
            transform: translateY(35px) scale(0.96); opacity: 0; transition: var(--trans-ppt);
        }
        .modal-overlay.active .modal-box { transform: translateY(0) scale(1); opacity: 1; }

        .loading { text-align: center; padding: 40px; color: var(--text-muted); }

        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .auth-form .af-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: var(--trans-smooth);
            box-sizing: border-box;
        }
        .auth-form .af-input:focus {
            background: rgba(255,255,255,0.85);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }
        .auth-form .af-input::placeholder { color: var(--text-muted); }
        .auth-form .af-btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
        }
        .auth-form .af-link {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--trans-smooth);
            padding: 4px;
        }
        .auth-form .af-link:hover { color: var(--primary); }
        .auth-form .af-title {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #059669, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 480px) {
            .toast { white-space: normal; text-align: center; padding: 10px 18px; font-size: 13px; }
            nav { padding: 10px 12px; }
            .btn { font-size: 12px; padding: 5px 12px; }
        }

        .img-viewer {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.16,1,0.3,1);
            will-change: opacity;
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        .img-viewer.active { opacity: 1; pointer-events: all; }
        .img-viewer .iv-wrapper {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
            will-change: transform;
            transform: scale(0.92);
            transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
            -webkit-transform: scale(0.92);
            -webkit-transition: -webkit-transform 0.35s cubic-bezier(0.16,1,0.3,1);
        }
        .img-viewer.active .iv-wrapper { transform: scale(1); -webkit-transform: scale(1); }
        .img-viewer .iv-wrapper.instant {
            transition: none !important;
            -webkit-transition: none !important;
        }
        .img-viewer img {
            max-width: 92vw; max-height: 88vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 80px rgba(0,0,0,0.6);
            display: block;
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
            pointer-events: none;
        }
        .img-viewer .iv-close {
            position: fixed; top: 20px; right: 24px;
            width: 44px; height: 44px;
            background: rgba(255,255,255,0.12);
            border: none; border-radius: 50%;
            color: white; font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10;
        }
        .img-viewer .iv-close:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }
        .img-viewer .iv-zoom-hint {
            position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 8px 18px;
            border-radius: 99px;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
            white-space: nowrap;
        }
        .img-viewer .iv-zoom-hint.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="rain-bg-container">
        <canvas id="rainCanvas"></canvas>
        <div class="rain-glass-layer"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <nav style="position:relative; z-index:3;">
        <h1>xtj</h1>
        <div class="nav-auth">
            <div id="unauthUI" style="display: flex; gap: 6px; align-items: center;">
                <button class="btn btn-primary" onclick="openAuthModal('login')">登录</button>
                <button class="btn btn-ghost" onclick="openAuthModal('register')">注册</button>
            </div>
            <div id="authUI" style="display: none;">
                <div class="user-pill">
                    <span class="avatar" id="myAvatar" style="width:24px; height:24px; font-size:12px;">?</span>
                    <span id="myName"></span>
                    <button onclick="doLogout()" style="background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:18px; line-height:1;">&times;</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="wrap" style="position:relative; z-index:2;">
        <div class="publish-box glass">
            <textarea id="postInp" placeholder="分享一点新鲜事..."></textarea>
            <div class="publish-footer">
                <input type="file" id="fileInp" accept="image/*,video/*" />
                <button class="btn btn-primary" id="pubBtn" onclick="doPublish()">发布动态</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card glass"><b id="sPosts">0</b><span>总动态</span></div>
            <div class="stat-card glass"><b id="sViews">0</b><span>总浏览</span></div>
            <div class="stat-card glass"><b id="sLikes">0</b><span>总点赞</span></div>
        </div>

        <div id="feed" class="feed">
            <div class="loading">内容加载中...</div>
        </div>
    </div>

    <div class="modal-overlay" id="commentModal">
        <div class="modal-box glass">
            <h3 style="margin-top:0;">发表评论</h3>
            <textarea id="commInp" placeholder="写下你的想法..." style="width:100%; min-height:80px; border:none; background:transparent; resize:none; font-size:16px; outline:none;"></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top:16px;">
                <button class="btn btn-ghost" onclick="closeModal('commentModal')">取消</button>
                <button class="btn btn-primary" id="commBtn">发布评论</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="delModal">
        <div class="modal-box glass" style="text-align: center;">
            <h3 style="margin-top:0;">确认删除帖子？</h3>

            // ===================== 密码哈希 =====================
            async function hashPassword(password) {
                const encoder = new TextEncoder();
                const data = encoder.encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            // ===================== 雨滴动画 =====================
            function initRainAnimation() {
                const canvas = document.getElementById('rainCanvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let w, h;
                let drops = [], slideDrops = [], staticDrops = [];

                function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
                window.addEventListener('resize', resize);
                resize();

                for (let i = 0; i < 150; i++) drops.push({ x: Math.random()*w, y: Math.random()*h, len: Math.random()*15+10, xs: -1.5+Math.random()*2, ys: Math.random()*14+10 });
                for (let i = 0; i < 40; i++) slideDrops.push({ x: Math.random()*w, y: Math.random()*h, speed: Math.random()*1.2+0.3, trail: Math.random()*18+8, opacity: Math.random()*0.4+0.2 });
                for (let i = 0; i < 200; i++) staticDrops.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*2.2+0.8, o: Math.random()*0.5+0.25 });

                let animId = null;
                function draw() {
                    ctx.clearRect(0,0,w,h);
                    ctx.strokeStyle = 'rgba(180,190,210,0.45)';
                    ctx.lineCap = 'round';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    for (let p of drops) {
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p.x+p.xs, p.y+p.ys);
                        p.x += p.xs; p.y += p.ys;
                        if (p.y>h || p.x>w || p.x<0) { p.x = Math.random()*w; p.y = -20; }
                    }
                    ctx.stroke();

                    for (let sd of slideDrops) {
                        ctx.beginPath();
                        ctx.arc(sd.x, sd.y, 2.5, 0, Math.PI*2);
                        ctx.fillStyle = 'rgba(180,190,210,0.3)';
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(sd.x, sd.y);
                        ctx.lineTo(sd.x, sd.y + sd.trail);
                        ctx.strokeStyle = 'rgba(180,190,210,0.15)';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                        sd.y += sd.speed;
                        if (sd.y > h + 20) { sd.y = -20; sd.x = Math.random()*w; }
                    }

                    ctx.fillStyle = 'rgba(200,230,220,0.35)';
                    for (let s of staticDrops) {
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
                        ctx.fill();
                    }
                    animId = requestAnimationFrame(draw);
                }
                draw();
            }

            function createHeartParticles(btn) {
                const rect = btn.getBoundingClientRect();
                const cx = rect.left + rect.width/2;
                const cy = rect.top + rect.height/2;
                const emojis = ["❤️","💕","💗","✨","💖","💓"];
                for (let i=0; i<10; i++) {
                    const heart = document.createElement('div');
                    heart.className = 'heart-particle';
                    heart.textContent = emojis[Math.floor(Math.random()*emojis.length)];
                    const angle = (Math.PI*2*i/10) + (Math.random()-0.5)*0.5;
                    const dist1 = 40 + Math.random()*30;
                    const dist2 = 80 + Math.random()*60;
                    const dist3 = 120 + Math.random()*80;
                    heart.style.left = cx+'px';
                    heart.style.top = cy+'px';
                    heart.style.setProperty('--tx25', Math.cos(angle)*dist1+'px');
                    heart.style.setProperty('--ty25', Math.sin(angle)*dist1-20+'px');
                    heart.style.setProperty('--tx60', Math.cos(angle)*dist2+'px');
                    heart.style.setProperty('--ty60', Math.sin(angle)*dist2-50+'px');
                    heart.style.setProperty('--tx', Math.cos(angle)*dist3+'px');
                    heart.style.setProperty('--ty', Math.sin(angle)*dist3-100+'px');
                    heart.style.animationDelay = (Math.random()*0.15)+'s';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 1400);
                }
            }

            // ===================== 图片查看器 - 高性能缩放 =====================
            const ivZoomState = { scale: 1, tx: 0, ty: 0 };
            let ivIsZooming = false;
            let ivIsPanning = false;
            let ivLastDist = 0;
            let ivPanStartX = 0, ivPanStartY = 0;
            let ivStartTx = 0, ivStartTy = 0;
            let ivLastTapTime = 0;
            let ivDoubleTapTimer = null;
            let ivHintTimer = null;
            let ivTouchEndTime = 0;

            function ivApplyTransform() {
                const w = document.getElementById('ivWrapper');
                const v = ivZoomState;
                const t = `translate3d(${v.tx}px, ${v.ty}px, 0) scale(${v.scale})`;
                w.style.transform = t;
                w.style.webkitTransform = t;
            }

            function ivResetZoom(instant = false) {
                const w = document.getElementById('ivWrapper');
                ivZoomState.scale = 1;
                ivZoomState.tx = 0;
                ivZoomState.ty = 0;
                if (instant) {
                    w.classList.add('instant');
                    w.style.transform = '';
                    w.style.webkitTransform = '';
                    void w.offsetWidth;
                    w.classList.remove('instant');
                } else {
                    w.style.transform = '';
                    w.style.webkitTransform = '';
                }
            }

            function ivShowHint() {
                const h = document.getElementById('ivZoomHint');
                h.classList.add('show');
                clearTimeout(ivHintTimer);
                ivHintTimer = setTimeout(() => h.classList.remove('show'), 2000);
            }

            window.openImageViewer = function (src) {
                const viewer = document.getElementById('imgViewer');
                const img = document.getElementById('ivImg');
                ivResetZoom(true);
                img.src = src;
                viewer.classList.add('active');
                document.body.style.overflow = 'hidden';
            };

            window.closeImageViewer = function () {
                const viewer = document.getElementById('imgViewer');
                const wrapper = document.getElementById('ivWrapper');
                wrapper.classList.remove('instant');
                ivResetZoom(false);
                viewer.classList.remove('active');
                document.body.style.overflow = '';
            };

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeImageViewer();
            });

            // ========== 触摸/交互事件 ==========
            const ivViewerEl = document.getElementById('imgViewer');
            const ivWrapperEl = document.getElementById('ivWrapper');

            ivViewerEl.addEventListener('click', function (e) {
                if (Date.now() - ivTouchEndTime < 120) return;
                if (e.target === ivViewerEl || e.target === ivWrapperEl) {
                    closeImageViewer();
                }
            });

            ivViewerEl.addEventListener('contextmenu', function (e) {
                e.preventDefault();
            });

            ivViewerEl.addEventListener('touchstart', function (e) {
                if (e.target.closest('.iv-close')) return;

                if (e.touches.length === 2) {
                    e.preventDefault();
                    ivIsZooming = true;
                    const t = e.touches;
                    ivLastDist = Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
                    ivStartTx = ivZoomState.tx;
                    ivStartTy = ivZoomState.ty;
                    ivWrapperEl.classList.add('instant');
                } else if (e.touches.length === 1) {
                    const now = Date.now();
                    if (now - ivLastTapTime < 320) {
                        clearTimeout(ivDoubleTapTimer);
                        ivLastTapTime = 0;
                        if (ivZoomState.scale > 1.5) {
                            ivResetZoom(false);
                        } else {
                            ivWrapperEl.classList.add('instant');
                            ivZoomState.scale = 2.5;
                            ivZoomState.tx = 0;
                            ivZoomState.ty = 0;
                            ivApplyTransform();
                            void ivWrapperEl.offsetWidth;
                            ivWrapperEl.classList.remove('instant');
                            ivShowHint();
                        }
                        return;
                    }
                    ivLastTapTime = now;
                    ivDoubleTapTimer = setTimeout(() => { ivLastTapTime = 0; }, 350);

                    if (ivZoomState.scale > 1) {
                        ivIsPanning = true;
                        ivWrapperEl.classList.add('instant');
                        ivPanStartX = e.touches[0].clientX;
                        ivPanStartY = e.touches[0].clientY;
                        ivStartTx = ivZoomState.tx;
                        ivStartTy = ivZoomState.ty;
                    }
                }
            }, { passive: false });

            ivViewerEl.addEventListener('touchmove', function (e) {
                if (ivIsZooming && e.touches.length === 2) {
                    e.preventDefault();
                    const t = e.touches;
                    const dist = Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
                    const newScale = Math.max(1, Math.min(6, ivZoomState.scale * (dist / ivLastDist)));

                    const cx = (t[0].clientX + t[1].clientX) / 2;
                    const cy = (t[0].clientY + t[1].clientY) / 2;
                    const ratio = newScale / ivZoomState.scale;

                    ivZoomState.tx = cx - ratio * (cx - ivStartTx);
                    ivZoomState.ty = cy - ratio * (cy - ivStartTy);
                    ivZoomState.scale = newScale;
                    ivLastDist = dist;
                    ivStartTx = ivZoomState.tx;
                    ivStartTy = ivZoomState.ty;

                    ivApplyTransform();
                    ivShowHint();
                } else if (ivIsPanning && e.touches.length === 1) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - ivPanStartX;
                    const dy = e.touches[0].clientY - ivPanStartY;
                    ivZoomState.tx = ivStartTx + dx;
                    ivZoomState.ty = ivStartTy + dy;
                    ivApplyTransform();
                }
            }, { passive: false });

            ivViewerEl.addEventListener('touchend', function (e) {
                ivTouchEndTime = Date.now();
                if (ivIsZooming) {
                    ivIsZooming = false;
                    if (ivZoomState.scale <= 1) {
                        ivResetZoom(false);
                    } else {
                        setTimeout(() => ivWrapperEl.classList.remove('instant'), 50);
                    }
                }
                if (ivIsPanning) {
                    ivIsPanning = false;
                    setTimeout(() => ivWrapperEl.classList.remove('instant'), 50);
                }
            });

            ivViewerEl.addEventListener('wheel', function (e) {
                if (!ivViewerEl.classList.contains('active')) return;
                e.preventDefault();

                const delta = -e.deltaY * 0.001;
                const newScale = Math.max(1, Math.min(6, ivZoomState.scale * (1 + delta)));

                const rect = ivViewerEl.getBoundingClientRect();
                const cx = e.clientX - rect.left;
                const cy = e.clientY - rect.top;
                const ratio = newScale / ivZoomState.scale;

                ivZoomState.tx = cx - ratio * (cx - ivZoomState.tx);
                ivZoomState.ty = cy - ratio * (cy - ivZoomState.ty);
                ivZoomState.scale = newScale;

                ivWrapperEl.classList.add('instant');
                ivApplyTransform();
                ivShowHint();

                if (ivZoomState.scale <= 1) {
                    setTimeout(() => ivResetZoom(false), 10);
                }
                setTimeout(() => ivWrapperEl.classList.remove('instant'), 100);
            }, { passive: false });

            // ===================== 浏览量统计 =====================
            function trackView(postId) {
                const key = `xtj_v_${postId}`;
                if (!localStorage.getItem(key) && !viewTracked.has(postId)) {
                    viewTracked.add(postId);
                    localStorage.setItem(key, "1");
                    setTimeout(async () => { try { await sb.rpc("increment_post_views", { p_post_id: postId }); } catch(e){ console.error(e); } }, 1000);
                }
            }

            // ===================== 加载动态 =====================
            async function loadFeed(forceRefresh = false) {
                const now = Date.now();
                if (!forceRefresh) {
                    const cached = localStorage.getItem(CACHE_KEY);
                    if (cached) {
                        try {
                            const parsed = JSON.parse(cached);
                            if (parsed?.data && now - parsed.timestamp < CACHE_DURATION) {
                                renderFeed(parsed.data); return;
                            }
                        } catch(e){}
                    }
                }
                const feed = document.getElementById("feed");
                if (!forceRefresh) feed.innerHTML = `<div class="loading">加载中...</div>`;
                try {
                    const [postRes, commRes, likeRes] = await Promise.all([
                        sb.from("posts").select("*").order("created_at", { ascending: false }),
                        sb.from("comments").select("*").order("created_at"),
                        sb.from("likes").select("*")
                    ]);
                    const data = { posts: postRes.data || [], comments: commRes.data || [], likes: likeRes.data || [] };
                    localStorage.setItem(CACHE_KEY, JSON.stringify({ data, timestamp: now }));
                    renderFeed(data);
                } catch(e) {
                    if (!forceRefresh) feed.innerHTML = `<div class="loading">加载失败，刷新重试</div>`;
                    console.error(e);
                }
            }

            function renderFeed({ posts, comments, likes }) {
                const visiblePosts = posts.filter(p => p.media_type !== AUTH_MARKER);
                document.getElementById("sPosts").textContent = visiblePosts.length;
                document.getElementById("sViews").textContent = visiblePosts.reduce((s,p)=>s+(p.views||0),0);
                document.getElementById("sLikes").textContent = likes.length;

                const feed = document.getElementById("feed");
                feed.innerHTML = visiblePosts.length ? visiblePosts.map(p => {
                    const pLikes = likes.filter(l=>l.post_id===p.id);
                    const pComms = comments.filter(c=>c.post_id===p.id);
                    const isLiked = pLikes.some(l=>l.actor_key===deviceId);
                    const canDelPost = p.actor_key === deviceId || isAdmin();
                    trackView(p.id);
                    return `
                <div class="post glass" data-post-id="${p.id}">
                  <div class="post-header">
                    <div class="avatar ${p.user_name===ADMIN_NAME?'admin':''}">${p.user_name[0].toUpperCase()}</div>
                    <div class="user-info">
                      <span class="user-name">${p.user_name} ${p.user_name===ADMIN_NAME?'<span class="admin-tag">ADMIN</span>':''}</span>
                      <span class="post-time">${new Date(p.created_at).toLocaleString()}</span>
                    </div>
                  </div>
                  <div class="content">${p.content}</div>
                  ${p.media_url?`<div class="media">${p.media_type==='video'?`<video src="${p.media_url}" controls preload="none">`:`<img src="${p.media_url}" loading="lazy" onclick="openImageViewer('${p.media_url}')">`}</div>`:''}
                  <div class="post-stats-text">浏览 ${p.views||0} · 点赞 ${pLikes.length} · 评论 ${pComms.length}</div>
                  <div class="actions">
                    <button class="action-btn ${isLiked?'liked':''}" onclick="toggleLike(this, '${p.id}')">${isLiked?'已点赞':'点赞'}</button>
                    <button class="action-btn" onclick="openComment('${p.id}')">评论</button>
                    ${canDelPost?`<button type="button" class="action-btn del" onclick="openDelete('${p.id}', '${p.actor_key}')">删除</button>`:''}
                  </div>
                  ${pComms.length?`
                  <div class="comments">
                    ${pComms.map(c=>`
                    <div class="comment-item" data-comment-id="${c.id}">
                      <div><b>${c.user_name}:</b>${c.content}</div>
                    </div>
                    `).join('')}
                  </div>
                  `:''}
                </div>
              `;
                }).join('') : `<div class="loading">快来发布第一条动态吧~</div>`;

                initPostScrollAnimation();
            }

            function initPostScrollAnimation() {
                const observer = new IntersectionObserver(e => {
                    e.forEach(i => { if(i.isIntersecting){ i.target.classList.add('visible'); observer.unobserve(i.target); } });
                }, { threshold: 0.1 });
                document.querySelectorAll('.post').forEach(p => { if(!p.classList.contains('visible')) observer.observe(p); });
            }

            async function initialLoad(skipCache = false) {
                if (!skipCache) {
                    const cached = localStorage.getItem(CACHE_KEY);
                    if (cached) {
                        try {
                            const parsed = JSON.parse(cached);
                            if (parsed?.data && Date.now()-parsed.timestamp < CACHE_DURATION) { renderFeed(parsed.data); loadFeed(true); return; }
                        } catch(e){}
                    }
                }
                await loadFeed(false);
            }

            sb.channel('updates')
                .on('postgres_changes', { event:'*', schema:'public', table:'posts' }, () => loadFeed(true))
                .on('postgres_changes', { event:'*', schema:'public', table:'comments' }, () => loadFeed(true))
                .on('postgres_changes', { event:'*', schema:'public', table:'likes' }, () => loadFeed(true))
                .subscribe();

            window.addEventListener('DOMContentLoaded', () => { initUI(); initRainAnimation(); initialLoad(); });
        })();
    </script>
</body>
</html>
