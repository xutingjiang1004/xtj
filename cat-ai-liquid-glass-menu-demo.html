<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小猫 AI 液态玻璃菜单演示</title>

  <style>
    :root {
      color-scheme: light;
      --page-bg-1: #e9fbf5;
      --page-bg-2: #eaf3ff;
      --page-bg-3: #f7fbff;

      --text: #203430;
      --muted: #71807d;

      --glass-border: rgba(255,255,255,.68);
      --glass-border-soft: rgba(115,172,157,.20);
      --glass-bg-top: rgba(255,255,255,.70);
      --glass-bg-bottom: rgba(237,249,247,.38);

      --accent: #4f9f87;
      --accent-strong: #2f8369;
      --accent-soft: rgba(82,167,137,.12);

      --shadow-1: 0 22px 55px rgba(52,91,82,.16);
      --shadow-2: 0 6px 18px rgba(52,91,82,.09);

      --spring: cubic-bezier(.18,.89,.32,1.18);
      --smooth: cubic-bezier(.2,.8,.2,1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(circle at 12% 18%, rgba(124,231,197,.42), transparent 30%),
        radial-gradient(circle at 83% 14%, rgba(143,196,255,.38), transparent 32%),
        radial-gradient(circle at 75% 86%, rgba(183,164,255,.24), transparent 32%),
        linear-gradient(145deg, var(--page-bg-1), var(--page-bg-2) 52%, var(--page-bg-3));
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .demo-shell {
      width: min(920px, calc(100vw - 28px));
      height: min(720px, calc(100vh - 28px));
      margin: 14px auto;

      display: flex;
      flex-direction: column;
      overflow: hidden;

      border: 1px solid rgba(255,255,255,.72);
      border-radius: 30px;

      background:
        linear-gradient(180deg, rgba(255,255,255,.50), rgba(242,251,249,.36));

      backdrop-filter: blur(26px) saturate(150%);
      -webkit-backdrop-filter: blur(26px) saturate(150%);

      box-shadow:
        0 28px 80px rgba(68,103,94,.18),
        inset 0 1px 0 rgba(255,255,255,.92);
    }

    .chat-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 14px 18px;

      border-bottom: 1px solid rgba(118,171,156,.12);

      background:
        linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.28));

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .avatar {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;

      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.84);

      background:
        radial-gradient(circle at 35% 25%, rgba(255,255,255,.96), transparent 28%),
        linear-gradient(145deg, #b8f0d9, #b8d9ff);

      box-shadow:
        0 9px 22px rgba(74,125,108,.16),
        inset 0 1px 0 rgba(255,255,255,.96);

      font-size: 22px;
    }

    .header-copy {
      min-width: 0;
      flex: 1;
    }

    .header-title {
      font-size: 14px;
      font-weight: 730;
      letter-spacing: -.02em;
    }

    .header-status {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .chat-main {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 22px 18px 118px;
      scroll-behavior: smooth;
    }

    .chat-main::-webkit-scrollbar {
      width: 5px;
    }

    .chat-main::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(91,151,131,.24);
    }

    .message {
      max-width: min(74%, 520px);
      margin: 0 0 14px;
      padding: 12px 15px;

      border-radius: 20px;
      font-size: 14px;
      line-height: 1.65;
    }

    .message.ai {
      margin-right: auto;
      border-bottom-left-radius: 8px;

      border: 1px solid rgba(255,255,255,.64);

      background:
        linear-gradient(145deg, rgba(255,255,255,.72), rgba(244,252,249,.46));

      box-shadow:
        0 12px 28px rgba(59,104,90,.09),
        inset 0 1px 0 rgba(255,255,255,.88);
    }

    .message.user {
      margin-left: auto;
      border-bottom-right-radius: 8px;

      color: #fff;
      background:
        linear-gradient(145deg, rgba(71,160,125,.96), rgba(87,177,154,.92));

      box-shadow:
        0 12px 26px rgba(52,131,102,.18);
    }

    .composer-area {
      position: relative;
      flex: 0 0 auto;

      padding:
        12px
        14px
        max(14px, env(safe-area-inset-bottom));

      border-top: 1px solid rgba(111,164,150,.12);

      background:
        linear-gradient(180deg, rgba(247,253,251,.60), rgba(241,250,247,.76));

      backdrop-filter: blur(22px) saturate(145%);
      -webkit-backdrop-filter: blur(22px) saturate(145%);
    }

    .composer-row {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: flex-end;
      gap: 9px;
    }

    .plus-wrap {
      position: relative;
      flex: 0 0 auto;
    }

    .plus-button {
      position: relative;

      width: 40px;
      height: 40px;
      padding: 0;
      overflow: hidden;

      display: grid;
      place-items: center;

      border: 1px solid rgba(255,255,255,.78);
      border-radius: 15px;

      color: #397f6c;
      cursor: pointer;

      background:
        radial-gradient(circle at 28% 18%, rgba(255,255,255,.92), transparent 34%),
        linear-gradient(145deg, rgba(255,255,255,.64), rgba(229,248,242,.38));

      backdrop-filter: blur(18px) saturate(165%);
      -webkit-backdrop-filter: blur(18px) saturate(165%);

      box-shadow:
        0 9px 22px rgba(55,103,89,.13),
        inset 0 1px 0 rgba(255,255,255,.98),
        inset 0 -1px 0 rgba(90,154,135,.08);

      transition:
        border-color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease,
        transform 130ms ease;
    }

    .plus-button::before {
      content: "";
      position: absolute;
      inset: 1px;
      pointer-events: none;

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.64),
          transparent 34%,
          transparent 74%,
          rgba(157,218,201,.16)
        );

      opacity: .75;
    }

    .plus-button:hover {
      border-color: rgba(255,255,255,.96);

      background:
        radial-gradient(circle at 28% 18%, rgba(255,255,255,1), transparent 36%),
        linear-gradient(145deg, rgba(255,255,255,.76), rgba(224,248,241,.44));

      box-shadow:
        0 12px 28px rgba(55,103,89,.16),
        inset 0 1px 0 rgba(255,255,255,1);
    }

    .plus-button:active {
      transform: scale(.94);
    }

    .plus-button:focus-visible {
      outline: 3px solid rgba(86,169,143,.22);
      outline-offset: 3px;
    }

    .plus-icon {
      position: relative;
      z-index: 2;

      width: 19px;
      height: 19px;

      transition:
        transform 380ms var(--spring);
    }

    .plus-icon::before,
    .plus-icon::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;

      border-radius: 999px;
      background: currentColor;

      transform: translate(-50%, -50%);
    }

    .plus-icon::before {
      width: 19px;
      height: 2px;
    }

    .plus-icon::after {
      width: 2px;
      height: 19px;
    }

    .plus-button[aria-expanded="true"] .plus-icon {
      transform: rotate(45deg);
    }

    .input-box {
      flex: 1 1 auto;
      min-width: 0;

      display: flex;
      align-items: flex-end;
      gap: 8px;

      padding: 7px 8px 7px 13px;

      border: 1px solid rgba(255,255,255,.76);
      border-radius: 20px;

      background:
        linear-gradient(145deg, rgba(255,255,255,.70), rgba(247,252,251,.46));

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.96),
        0 8px 22px rgba(58,101,90,.08);
    }

    .chat-input {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 30px;
      max-height: 120px;

      padding: 6px 0;
      resize: none;
      border: 0;
      outline: 0;

      color: var(--text);
      background: transparent;

      font-size: 14px;
      line-height: 1.45;
    }

    .chat-input::placeholder {
      color: rgba(73,94,88,.46);
    }

    .send-button {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      padding: 0;

      display: grid;
      place-items: center;

      border: 0;
      border-radius: 13px;

      color: #fff;
      cursor: pointer;

      background:
        linear-gradient(145deg, #4fa183, #68b69f);

      box-shadow:
        0 8px 18px rgba(57,135,106,.20),
        inset 0 1px 0 rgba(255,255,255,.28);

      transition:
        transform 130ms ease,
        filter 160ms ease;
    }

    .send-button:hover {
      filter: brightness(1.04);
    }

    .send-button:active {
      transform: scale(.94);
    }

    /* 菜单外层壳，只负责裁剪和位移，不对文字做 blur/scale */
    .glass-menu-shell {
      position: absolute;
      left: 0;
      bottom: calc(100% + 12px);

      width: 248px;
      overflow: hidden;

      visibility: hidden;
      pointer-events: none;
      opacity: 0;

      clip-path: inset(100% 78% 0 0 round 25px);
      transform: translateY(8px);

      transform-origin: left bottom;

      transition:
        opacity 210ms ease,
        visibility 0s linear 300ms,
        transform 280ms var(--smooth),
        clip-path 300ms var(--smooth);
    }

    .glass-menu-shell.open {
      visibility: visible;
      pointer-events: auto;
      opacity: 1;

      clip-path: inset(0 round 25px);
      transform: translateY(0);

      transition:
        opacity 190ms ease,
        visibility 0s linear 0s,
        transform 360ms var(--spring),
        clip-path 390ms var(--spring);
    }

    .glass-menu {
      position: relative;
      min-height: 228px;
      overflow: hidden;

      border: 1px solid var(--glass-border);
      border-radius: 25px;

      background:
        radial-gradient(circle at 15% 7%, rgba(255,255,255,.86), transparent 31%),
        radial-gradient(circle at 95% 100%, rgba(159,218,201,.20), transparent 36%),
        linear-gradient(145deg, var(--glass-bg-top), var(--glass-bg-bottom));

      backdrop-filter:
        blur(28px)
        saturate(168%)
        contrast(103%);

      -webkit-backdrop-filter:
        blur(28px)
        saturate(168%)
        contrast(103%);

      box-shadow:
        var(--shadow-1),
        var(--shadow-2),
        inset 0 1px 0 rgba(255,255,255,.96),
        inset 0 -1px 0 rgba(85,145,127,.07);
    }

    .glass-menu::before {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: 0;
      pointer-events: none;

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.70),
          transparent 32%,
          transparent 72%,
          rgba(135,203,184,.12)
        );

      opacity: .78;
    }

    .glass-menu::after {
      content: "";
      position: absolute;
      top: 0;
      left: 18px;
      right: 18px;
      height: 1px;
      z-index: 1;
      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.96),
          transparent
        );
    }

    .menu-viewport {
      position: relative;
      z-index: 2;
      min-height: 228px;
      overflow: hidden;
    }

    .menu-page {
      position: absolute;
      inset: 0;

      padding: 11px;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transform: translateX(20px);

      transition:
        opacity 210ms ease,
        visibility 0s linear 250ms,
        transform 300ms var(--smooth);
    }

    .menu-page.active {
      position: relative;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;

      transform: translateX(0);

      transition:
        opacity 220ms ease,
        visibility 0s linear 0s,
        transform 350ms var(--smooth);
    }

    .menu-page.leaving-left {
      transform: translateX(-18px);
    }

    .menu-page.leaving-right {
      transform: translateX(18px);
    }

    .menu-list {
      overflow: hidden;

      border: 1px solid rgba(255,255,255,.40);
      border-radius: 19px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.28),
          rgba(255,255,255,.10)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.56);
    }

    .menu-option {
      position: relative;

      width: 100%;
      min-height: 50px;
      padding: 9px 11px;

      display: flex;
      align-items: center;
      gap: 11px;

      border: 0;
      border-bottom: 1px solid rgba(107,158,143,.10);

      color: var(--text);
      cursor: pointer;
      text-align: left;

      background: transparent;

      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;

      transition:
        color 170ms ease,
        box-shadow 170ms ease;
    }

    .menu-option:last-child {
      border-bottom: 0;
    }

    .menu-option::before {
      content: "";
      position: absolute;
      inset: 4px 5px;

      border-radius: 14px;
      pointer-events: none;

      opacity: 0;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.52),
          rgba(216,244,236,.30)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.76);

      transition: opacity 170ms ease;
    }

    .menu-option:hover::before,
    .menu-option:focus-visible::before {
      opacity: 1;
    }

    .menu-option:focus-visible {
      outline: none;
      box-shadow: inset 0 0 0 2px rgba(82,164,138,.18);
    }

    .menu-option:active::before {
      opacity: .78;
      background:
        linear-gradient(
          145deg,
          rgba(221,245,238,.60),
          rgba(207,238,230,.38)
        );
    }

    .option-icon {
      position: relative;
      z-index: 1;

      flex: 0 0 auto;
      width: 30px;
      height: 30px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(255,255,255,.60);
      border-radius: 11px;

      color: #4b786c;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.58),
          rgba(235,248,245,.28)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.80),
        0 4px 12px rgba(63,108,95,.07);

      transition:
        transform 180ms var(--smooth),
        color 170ms ease;
    }

    .menu-option:hover .option-icon {
      transform: translateY(-1px);
      color: var(--accent-strong);
    }

    .option-copy {
      position: relative;
      z-index: 1;

      min-width: 0;
      flex: 1 1 auto;
    }

    .option-title {
      display: block;

      color: #27413b;
      font-size: 13px;
      font-weight: 620;
      line-height: 1.25;
      white-space: nowrap;
    }

    .option-subtitle {
      display: block;
      margin-top: 3px;

      overflow: hidden;
      color: #7a8985;

      font-size: 10.5px;
      line-height: 1.25;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .option-value {
      position: relative;
      z-index: 1;

      flex: 0 0 auto;
      max-width: 92px;

      overflow: hidden;
      color: #71817d;

      font-size: 11px;
      font-weight: 560;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .chevron {
      position: relative;
      z-index: 1;

      flex: 0 0 auto;
      color: rgba(60,88,81,.42);

      font-size: 19px;
      line-height: 1;

      transition:
        transform 180ms var(--smooth),
        color 170ms ease;
    }

    .menu-option:hover .chevron {
      color: var(--accent-strong);
      transform: translateX(2px);
    }

    .switch {
      position: relative;
      z-index: 1;

      flex: 0 0 auto;
      width: 40px;
      height: 24px;
      padding: 0;

      border: 0;
      border-radius: 999px;
      cursor: pointer;

      background: rgba(117,132,127,.18);

      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.46),
        inset 0 2px 4px rgba(47,72,65,.08);

      transition:
        background 200ms ease,
        box-shadow 200ms ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      background:
        radial-gradient(circle at 30% 25%, #fff, #f4fbf8 70%);

      box-shadow:
        0 3px 8px rgba(47,79,70,.18),
        inset 0 1px 0 rgba(255,255,255,1);

      transition:
        transform 240ms var(--spring);
    }

    .switch.on {
      background:
        linear-gradient(145deg, #5aa88e, #75bba7);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.25),
        0 5px 12px rgba(66,149,120,.16);
    }

    .switch.on::after {
      transform: translateX(16px);
    }

    .submenu-header {
      min-height: 38px;
      padding: 0 2px 8px;

      display: grid;
      grid-template-columns: 36px 1fr 36px;
      align-items: center;
      gap: 6px;
    }

    .back-button {
      width: 34px;
      height: 34px;
      padding: 0;

      display: grid;
      place-items: center;

      border: 1px solid rgba(255,255,255,.55);
      border-radius: 12px;

      color: #4a7167;
      cursor: pointer;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.48),
          rgba(238,249,246,.24)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.76);

      transition:
        background 170ms ease,
        color 170ms ease;
    }

    .back-button:hover {
      color: var(--accent-strong);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.68),
          rgba(226,246,240,.32)
        );
    }

    .submenu-title {
      min-width: 0;
      text-align: center;
    }

    .submenu-title strong {
      display: block;

      font-size: 13px;
      font-weight: 690;
      letter-spacing: -.015em;
    }

    .submenu-title span {
      display: block;
      margin-top: 2px;

      color: var(--muted);
      font-size: 10px;
    }

    .choice-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .choice {
      position: relative;

      width: 100%;
      min-height: 58px;
      padding: 10px 11px;

      display: flex;
      align-items: center;
      gap: 10px;

      border: 1px solid rgba(255,255,255,.42);
      border-radius: 17px;

      color: var(--text);
      cursor: pointer;
      text-align: left;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.30),
          rgba(255,255,255,.10)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.55);

      transition:
        border-color 170ms ease,
        background 170ms ease,
        box-shadow 170ms ease;
    }

    .choice:hover {
      border-color: rgba(255,255,255,.70);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.48),
          rgba(226,246,240,.22)
        );
    }

    .choice.selected {
      border-color: rgba(93,177,150,.38);

      background:
        linear-gradient(
          145deg,
          rgba(218,246,237,.62),
          rgba(227,241,255,.34)
        );

      box-shadow:
        inset 0 0 0 1px rgba(103,186,158,.14),
        inset 0 1px 0 rgba(255,255,255,.72);
    }

    .choice-copy {
      min-width: 0;
      flex: 1 1 auto;
    }

    .choice-title {
      display: block;

      font-size: 12.5px;
      font-weight: 650;
      line-height: 1.25;
    }

    .choice-description {
      display: block;
      margin-top: 4px;

      color: var(--muted);

      font-size: 10.5px;
      line-height: 1.35;
    }

    .check {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(91,123,114,.18);
      border-radius: 50%;

      color: transparent;
      background: rgba(255,255,255,.34);

      font-size: 13px;
      font-weight: 800;

      transition:
        color 170ms ease,
        background 170ms ease,
        border-color 170ms ease;
    }

    .choice.selected .check {
      color: #fff;
      border-color: transparent;

      background:
        linear-gradient(145deg, #4d9c82, #69b59e);

      box-shadow:
        0 5px 12px rgba(62,145,116,.18),
        inset 0 1px 0 rgba(255,255,255,.24);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 50;

      max-width: min(340px, calc(100vw - 32px));
      padding: 10px 14px;

      border: 1px solid rgba(255,255,255,.68);
      border-radius: 14px;

      color: #29413b;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.78),
          rgba(235,248,244,.54)
        );

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 16px 38px rgba(53,91,81,.18),
        inset 0 1px 0 rgba(255,255,255,.92);

      opacity: 0;
      pointer-events: none;

      transform: translate(-50%, 12px);

      font-size: 12px;

      transition:
        opacity 180ms ease,
        transform 230ms var(--smooth);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .hidden-input {
      display: none;
    }

    @media (max-width: 620px) {
      .demo-shell {
        width: 100%;
        height: 100vh;
        margin: 0;
        border: 0;
        border-radius: 0;
      }

      .glass-menu-shell {
        width: min(248px, calc(100vw - 34px));
      }

      .message {
        max-width: 86%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <section class="demo-shell">
    <header class="chat-header">
      <div class="avatar" aria-hidden="true">🐱</div>

      <div class="header-copy">
        <div class="header-title">小猫 AI</div>
        <div class="header-status">在线 · 液态玻璃菜单演示</div>
      </div>
    </header>

    <main class="chat-main" id="chatMain">
      <div class="message ai">
        这是一个独立演示。点击输入框左侧的加号，可以看到一级菜单、模型选择页和思考程度选择页。
      </div>

      <div class="message user">
        我不想再一直点按钮循环切换了。
      </div>

      <div class="message ai">
        所以这里改成了二级选择页面。人类终于不用像调老式电子表一样狂按按钮。
      </div>
    </main>

    <footer class="composer-area">
      <div class="composer-row">
        <div class="plus-wrap">
          <button
            class="plus-button"
            id="plusButton"
            type="button"
            aria-label="更多选项"
            aria-expanded="false"
            aria-controls="glassMenuShell"
          >
            <span class="plus-icon" aria-hidden="true"></span>
          </button>

          <div
            class="glass-menu-shell"
            id="glassMenuShell"
            aria-hidden="true"
          >
            <section class="glass-menu">
              <div class="menu-viewport">
                <div class="menu-page active" id="mainPage">
                  <div class="menu-list" role="menu">
                    <button
                      class="menu-option"
                      id="uploadOption"
                      type="button"
                      role="menuitem"
                    >
                      <span class="option-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                          <polyline points="14 2 14 8 20 8"/>
                          <line x1="12" y1="18" x2="12" y2="12"/>
                          <line x1="9" y1="15" x2="15" y2="15"/>
                        </svg>
                      </span>

                      <span class="option-copy">
                        <span class="option-title">上传文件</span>
                        <span class="option-subtitle">图片、PDF、文档与表格</span>
                      </span>
                    </button>

                    <button
                      class="menu-option"
                      id="modelOption"
                      type="button"
                      role="menuitem"
                    >
                      <span class="option-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                          <rect x="3" y="4" width="18" height="13" rx="3"/>
                          <path d="M8 21h8"/>
                          <path d="M12 17v4"/>
                        </svg>
                      </span>

                      <span class="option-copy">
                        <span class="option-title">模型</span>
                        <span class="option-subtitle">选择当前聊天模型</span>
                      </span>

                      <span class="option-value" id="modelValue">V4 Flash</span>
                      <span class="chevron" aria-hidden="true">›</span>
                    </button>

                    <button
                      class="menu-option"
                      id="thinkingOption"
                      type="button"
                      role="menuitem"
                    >
                      <span class="option-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M9.5 5.5a5.5 5.5 0 1 1 5 9"/>
                          <path d="M12 17v.01"/>
                          <path d="M8 21h8"/>
                          <path d="M9 18.5h6"/>
                        </svg>
                      </span>

                      <span class="option-copy">
                        <span class="option-title">思考程度</span>
                        <span class="option-subtitle">控制速度与分析深度</span>
                      </span>

                      <span class="option-value" id="thinkingValue">关闭</span>
                      <span class="chevron" aria-hidden="true">›</span>
                    </button>

                    <button
                      class="menu-option"
                      id="searchOption"
                      type="button"
                      role="menuitem"
                      aria-pressed="false"
                    >
                      <span class="option-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                          <circle cx="11" cy="11" r="7"/>
                          <path d="m20 20-4-4"/>
                        </svg>
                      </span>

                      <span class="option-copy">
                        <span class="option-title">网页搜索</span>
                        <span class="option-subtitle">结合实时网络信息回答</span>
                      </span>

                      <span class="switch" id="searchSwitch" aria-hidden="true"></span>
                    </button>
                  </div>
                </div>

                <div class="menu-page" id="modelPage">
                  <div class="submenu-header">
                    <button
                      class="back-button"
                      id="modelBack"
                      type="button"
                      aria-label="返回一级菜单"
                    >
                      ‹
                    </button>

                    <div class="submenu-title">
                      <strong>选择模型</strong>
                      <span id="modelCurrentLabel">当前：V4 Flash</span>
                    </div>

                    <span></span>
                  </div>

                  <div class="choice-list" role="radiogroup" aria-label="模型">
                    <button
                      class="choice selected"
                      type="button"
                      role="radio"
                      aria-checked="true"
                      data-model="flash"
                    >
                      <span class="choice-copy">
                        <span class="choice-title">DeepSeek V4 Flash</span>
                        <span class="choice-description">响应更快，适合日常聊天与简单任务</span>
                      </span>

                      <span class="check" aria-hidden="true">✓</span>
                    </button>

                    <button
                      class="choice"
                      type="button"
                      role="radio"
                      aria-checked="false"
                      data-model="pro"
                    >
                      <span class="choice-copy">
                        <span class="choice-title">DeepSeek V4 Pro</span>
                        <span class="choice-description">能力更强，适合复杂分析与代码任务</span>
                      </span>

                      <span class="check" aria-hidden="true">✓</span>
                    </button>
                  </div>
                </div>

                <div class="menu-page" id="thinkingPage">
                  <div class="submenu-header">
                    <button
                      class="back-button"
                      id="thinkingBack"
                      type="button"
                      aria-label="返回一级菜单"
                    >
                      ‹
                    </button>

                    <div class="submenu-title">
                      <strong>思考程度</strong>
                      <span id="thinkingCurrentLabel">当前：关闭</span>
                    </div>

                    <span></span>
                  </div>

                  <div class="choice-list" role="radiogroup" aria-label="思考程度">
                    <button class="choice selected" type="button" role="radio" aria-checked="true" data-thinking="off">
                      <span class="choice-copy">
                        <span class="choice-title">关闭</span>
                        <span class="choice-description">响应最快，不启用额外思考预算</span>
                      </span>
                      <span class="check" aria-hidden="true">✓</span>
                    </button>

                    <button class="choice" type="button" role="radio" aria-checked="false" data-thinking="low">
                      <span class="choice-copy">
                        <span class="choice-title">轻度</span>
                        <span class="choice-description">适合简单问答，速度优先</span>
                      </span>
                      <span class="check" aria-hidden="true">✓</span>
                    </button>

                    <button class="choice" type="button" role="radio" aria-checked="false" data-thinking="medium">
                      <span class="choice-copy">
                        <span class="choice-title">中度</span>
                        <span class="choice-description">平衡速度与分析深度</span>
                      </span>
                      <span class="check" aria-hidden="true">✓</span>
                    </button>

                    <button class="choice" type="button" role="radio" aria-checked="false" data-thinking="high">
                      <span class="choice-copy">
                        <span class="choice-title">深度</span>
                        <span class="choice-description">适合复杂问题与多步骤推理</span>
                      </span>
                      <span class="check" aria-hidden="true">✓</span>
                    </button>

                    <button class="choice" type="button" role="radio" aria-checked="false" data-thinking="max">
                      <span class="choice-copy">
                        <span class="choice-title">极致</span>
                        <span class="choice-description">使用更高思考预算，响应更慢</span>
                      </span>
                      <span class="check" aria-hidden="true">✓</span>
                    </button>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>

        <div class="input-box">
          <textarea
            class="chat-input"
            rows="1"
            placeholder="给小猫 AI 发消息…"
          ></textarea>

          <button class="send-button" type="button" aria-label="发送">
            ↑
          </button>
        </div>
      </div>

      <input
        class="hidden-input"
        id="fileInput"
        type="file"
        accept="image/*,.pdf,.docx,.txt,.csv,.xlsx"
      />
    </footer>
  </section>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const plusButton = document.getElementById("plusButton");
    const menuShell = document.getElementById("glassMenuShell");

    const mainPage = document.getElementById("mainPage");
    const modelPage = document.getElementById("modelPage");
    const thinkingPage = document.getElementById("thinkingPage");

    const modelOption = document.getElementById("modelOption");
    const thinkingOption = document.getElementById("thinkingOption");
    const uploadOption = document.getElementById("uploadOption");
    const searchOption = document.getElementById("searchOption");

    const modelBack = document.getElementById("modelBack");
    const thinkingBack = document.getElementById("thinkingBack");

    const modelValue = document.getElementById("modelValue");
    const thinkingValue = document.getElementById("thinkingValue");

    const modelCurrentLabel = document.getElementById("modelCurrentLabel");
    const thinkingCurrentLabel = document.getElementById("thinkingCurrentLabel");

    const searchSwitch = document.getElementById("searchSwitch");
    const fileInput = document.getElementById("fileInput");
    const toast = document.getElementById("toast");

    const modelChoices = [...document.querySelectorAll("[data-model]")];
    const thinkingChoices = [...document.querySelectorAll("[data-thinking]")];

    const state = {
      open: false,
      page: "main",
      model: "flash",
      thinking: "off",
      webSearch: false
    };

    const modelLabels = {
      flash: "V4 Flash",
      pro: "V4 Pro"
    };

    const thinkingLabels = {
      off: "关闭",
      low: "轻度",
      medium: "中度",
      high: "深度",
      max: "极致"
    };

    let toastTimer = null;
    let pageTimer = null;
    let closeTimer = null;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = window.setTimeout(() => {
        toast.classList.remove("show");
      }, 1700);
    }

    function setMenuOpen(open) {
      state.open = open;

      if (open) {
        // 重开时取消上一个关闭定时器，避免 260ms 后误回主页面
        if (closeTimer) clearTimeout(closeTimer);
        closeTimer = null;
      }

      menuShell.classList.toggle("open", open);

      plusButton.setAttribute(
        "aria-expanded",
        String(open)
      );

      menuShell.setAttribute(
        "aria-hidden",
        String(!open)
      );

      if (!open) {
        clearTimeout(closeTimer);
        closeTimer = window.setTimeout(() => {
          showPage("main", false);
        }, 260);
      }
    }

    function showPage(pageName, animate = true) {
      const pages = {
        main: mainPage,
        model: modelPage,
        thinking: thinkingPage
      };

      const nextPage = pages[pageName];

      if (!nextPage || state.page === pageName) {
        return;
      }

      // 同步更新 state.page，立即生效，避免 90ms 延迟期间连点导致状态不一致
      const previousPageName = state.page;
      state.page = pageName;

      const currentPage = pages[previousPageName];

      if (animate && currentPage) {
        currentPage.classList.add(
          pageName === "main"
            ? "leaving-right"
            : "leaving-left"
        );
      }

      currentPage?.classList.remove("active");

      // 取消上一个未完成的页面切换定时器，防止过期回调互相覆盖
      if (pageTimer) clearTimeout(pageTimer);

      pageTimer = window.setTimeout(() => {
        // 守卫：如果定时器触发时页面已再次切换，丢弃过期回调
        if (state.page !== pageName) return;

        currentPage?.classList.remove(
          "leaving-left",
          "leaving-right"
        );

        nextPage.classList.add("active");
      }, animate ? 90 : 0);
    }

    function updateModel(model) {
      state.model = model;

      modelChoices.forEach((choice) => {
        const selected =
          choice.dataset.model === model;

        choice.classList.toggle(
          "selected",
          selected
        );

        choice.setAttribute(
          "aria-checked",
          String(selected)
        );
      });

      const label = modelLabels[model];

      modelValue.textContent = label;
      modelCurrentLabel.textContent =
        "当前：" + label;

      showToast("模型已切换为 " + label);
    }

    function updateThinking(level) {
      state.thinking = level;

      thinkingChoices.forEach((choice) => {
        const selected =
          choice.dataset.thinking === level;

        choice.classList.toggle(
          "selected",
          selected
        );

        choice.setAttribute(
          "aria-checked",
          String(selected)
        );
      });

      const label = thinkingLabels[level];

      thinkingValue.textContent = label;
      thinkingCurrentLabel.textContent =
        "当前：" + label;

      showToast("思考程度：" + label);
    }

    function toggleSearch() {
      state.webSearch = !state.webSearch;

      searchSwitch.classList.toggle(
        "on",
        state.webSearch
      );

      searchOption.setAttribute(
        "aria-pressed",
        String(state.webSearch)
      );

      showToast(
        state.webSearch
          ? "网页搜索已开启"
          : "网页搜索已关闭"
      );
    }

    plusButton.addEventListener("click", (event) => {
      event.stopPropagation();
      setMenuOpen(!state.open);
    });

    menuShell.addEventListener("click", (event) => {
      event.stopPropagation();
    });

    modelOption.addEventListener("click", () => {
      showPage("model");
    });

    thinkingOption.addEventListener("click", () => {
      showPage("thinking");
    });

    modelBack.addEventListener("click", () => {
      showPage("main");
    });

    thinkingBack.addEventListener("click", () => {
      showPage("main");
    });

    modelChoices.forEach((choice) => {
      choice.addEventListener("click", () => {
        updateModel(choice.dataset.model);
      });
    });

    thinkingChoices.forEach((choice) => {
      choice.addEventListener("click", () => {
        updateThinking(
          choice.dataset.thinking
        );
      });
    });

    searchOption.addEventListener(
      "click",
      toggleSearch
    );

    uploadOption.addEventListener("click", () => {
      setMenuOpen(false);

      window.setTimeout(() => {
        fileInput.click();
      }, 230);
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files?.[0];

      if (file) {
        showToast("已选择：" + file.name);
      }

      fileInput.value = "";
    });

    document.addEventListener("click", () => {
      if (state.open) {
        setMenuOpen(false);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") {
        return;
      }

      if (!state.open) {
        return;
      }

      if (state.page !== "main") {
        showPage("main");
        return;
      }

      setMenuOpen(false);
      plusButton.focus();
    });
  </script>
</body>
</html>
