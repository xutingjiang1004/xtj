# ===== xtj Render 部署配置 =====
# 方案A：单一 Node.js Web Service（前后端合一）
# 部署后访问: https://xtj.onrender.com/admin.html

services:
  - type: web
    name: xtj
    runtime: node
    repo: https://github.com/xutingjiang1004/xtj
    plan: starter
    region: singapore
    # PR 已合并到 main；生产部署跟随默认主分支，避免继续跟随已合并的临时 hotfix 分支。
    branch: main
    rootDir: .
    # 构建阶段也执行测试，避免未经验证的提交自动进入生产。
    buildCommand: npm ci && npm run build && npm test
    startCommand: node render-api/server.js
    autoDeploy: true
    # M-4: 声明健康检查路径，Render 不再 ping "/" 污染访问统计
    #（server.js 已有 /health 端点并专门排除其访问记录）
    healthCheckPath: /health
    
    # 安全环境变量（请在 Render Dashboard 中设置实际值）
    envVars:
      - key: NODE_ENV
        value: production
      
      # ⚠️ 管理员密码 — 在 Render Dashboard 手动设置
      # 不要在此文件中填写明文密码！
      - key: ADMIN_PASSWORD
        sync: false  # 标记为手动管理，不会被代码覆盖
      
      # ⚠️ Supabase Service Role Key — 在 Render Dashboard 手动设置
      # 去 https://supabase.com/dashboard → Settings → API → service_role
      - key: SUPABASE_SERVICE_KEY
        sync: false  # 标记为手动管理，不会被代码覆盖
      
      # ⚠️ API 密钥（用于签发 token）— 在 Render Dashboard 手动设置一个随机字符串
      # 不设置的话，每次部署重启都会生成新密钥，导致所有已登录用户被迫重新登录
      - key: API_SECRET
        sync: false

      # Code 工作区 AI 与私有 GitHub 只读代理
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: CODE_AI_CONTEXT_TOKENS
        value: "1000000"
      - key: CODE_AI_MAX_OUTPUT_TOKENS
        value: "32768"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_ALLOWED_REPOS
        value: xutingjiang1004/xtj
      
      - key: SUPABASE_URL
        value: https://ithowxqignlhkwaykglt.supabase.co

      # ⚠️ Supabase Anon Key（前端直连用）— 在 Render Dashboard 手动设置
      # 去 https://supabase.com/dashboard → Settings → API → anon public key
      # 构建时注入 js/config.min.js：feed 失败回退 / 浏览统计 / 照片墙统计依赖它。
      # 不设置则前端直连功能保持占位符降级（其余功能不受影响）。
      - key: SUPABASE_ANON_KEY
        sync: false
      
      # ⚠️ Tavily API Key — 在 Render Dashboard 手动设置
      # 用途：小猫AI 深入研究（Tavily Deep Research 多agent报告）+ 联网搜索
      # 获取：https://app.tavily.com → API Keys
      - key: TAVILY_API_KEY
        sync: false
      
      - key: ADMIN_USERNAME
        value: xxz
      
      # CORS 白名单（逗号分隔）。留空则自动检测：
      # 放行 Render 同域、localhost 及 *.vercel.app 前端（M-2）。
      # 如实际 Vercel 域名固定，可显式填入，如：
      #   value: "https://xtj.vercel.app"
      - key: ALLOWED_ORIGINS
        value: ""
      
      # ⚠️ Gmail SMTP 邮件发送配置 — 在 Render Dashboard 手动设置
      # Gmail 邮箱地址
      - key: GMAIL_USER
        sync: false
      # Gmail 应用专用密码（非邮箱登录密码）
      # 获取方式：https://myaccount.google.com/apppasswords → 选择"邮件" → 生成
      - key: GMAIL_APP_PASSWORD
        sync: false
      # SMTP 端口（465=SSL 推荐，587=STARTTLS）
      - key: SMTP_PORT
        sync: false

      # Gmail GAS Web App URL（备选邮件通道，用于绕过 SMTP 限制）
      # 在 Render Dashboard 手动设置
      - key: GMAIL_GAS_URL
        sync: false

# 部署后验证：
# 1. 打开 https://你的服务名.onrender.com/health → 应返回 {"ok":true}
# 2. 打开 https://你的服务名.onrender.com/admin.html → 应显示登录页面
# 3. 打开 https://你的服务名.onrender.com/ → 应显示网站首页
